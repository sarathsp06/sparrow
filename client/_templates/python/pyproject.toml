[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparrow-webhooks"
version = "1.1.1"
description = "Python gRPC client for Sparrow webhook delivery platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=5.26.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60.0",
]

[project.urls]
Homepage = "https://github.com/sarathsp06/sparrow"
Documentation = "https://sarathsp06.github.io/sparrow"
Repository = "https://github.com/sarathsp06/sparrow"

[tool.setuptools.packages.find]
include = ["sparrow_webhooks*"]

[tool.setuptools.package-data]
"sparrow_webhooks" = ["py.typed"]
