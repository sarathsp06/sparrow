[project]
name = "sparrow-e2e"
version = "0.1.0"
description = "End-to-end tests for Sparrow webhook platform (Gauge + Python)"
requires-python = ">=3.11"
dependencies = [
    # Must match the installed Gauge python plugin version (gauge -v). The
    # plugin refuses to start unless the getgauge lib version is identical,
    # and the uv venv has no pip to self-install the missing version.
    "getgauge==0.5.1",
    "requests>=2.31",
    "flask>=3.0",
    "pynacl>=1.5",
    "testcontainers[postgres]>=4.0",
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
    "grpcio>=1.81.0",
]

[tool.uv]
dev-dependencies = []
