version: v1
plugins:
  # ── Server-side Go (protobuf + gRPC + Connect-RPC) ──
  - plugin: buf.build/protocolbuffers/go
    out: .
    opt:
      - paths=source_relative
  - plugin: buf.build/grpc/go
    out: .
    opt:
      - paths=source_relative
  - plugin: buf.build/connectrpc/go
    out: .
    opt:
      - paths=source_relative

  # ── Generated gRPC clients ──

  # Go gRPC client
  - plugin: buf.build/protocolbuffers/go
    out: client/go
    opt:
      - paths=source_relative
  - plugin: buf.build/grpc/go
    out: client/go
    opt:
      - paths=source_relative

  # JavaScript / TypeScript gRPC client (grpc-web compatible)
  - plugin: buf.build/protocolbuffers/js
    out: client/js
  - plugin: buf.build/grpc/web
    out: client/js
    opt:
      - import_style=typescript
      - mode=grpcweb

  # Python gRPC client
  - plugin: buf.build/protocolbuffers/python
    out: client/python
  - plugin: buf.build/grpc/python
    out: client/python

  # ── Web UI (Connect-RPC / @bufbuild/protobuf v2) ──
  - name: es
    path: web/node_modules/.bin/protoc-gen-es
    out: .
    opt:
      - target=js+dts

  # ── Documentation ──
  - plugin: doc
    out: docs
