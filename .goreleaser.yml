# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

# Only vX.Y.Z tags are releases. The split modules' path-prefixed tags
# (pkg/signature/vX.Y.Z, ...) sit on the same or nearby commits and must never
# be picked as the current or previous tag.
git:
  ignore_tags:
    - "pkg/*"
    - "satellites/*"

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    # Not "sparrow": that is the CLI, and both land in the same bin dir.
    binary: sparrow-server
    env:
      - CGO_ENABLED=0
    # Reproducible: no local paths in the binary, file times from the commit.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -w -s -X github.com/sarathsp06/sparrow.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: sparrow-cli
    main: ./satellites/sparrow
    binary: sparrow
    env:
      - CGO_ENABLED=0
    # Reproducible: no local paths in the binary, file times from the commit.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -w -s -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: sparrow-sources
    main: ./satellites/sparrow-sources
    binary: sparrow-sources
    env:
      - CGO_ENABLED=0
    # Reproducible: no local paths in the binary, file times from the commit.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -w -s -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: sparrow-sinks
    main: ./satellites/sparrow-sinks
    binary: sparrow-sinks
    env:
      - CGO_ENABLED=0
    # Reproducible: no local paths in the binary, file times from the commit.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -w -s -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: server
    ids:
      - server
    name_template: "sparrow-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: sparrow-cli
    ids:
      - sparrow-cli
    name_template: "sparrow-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: sparrow-sources
    ids:
      - sparrow-sources
    name_template: "sparrow-sources-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: sparrow-sinks
    ids:
      - sparrow-sinks
    name_template: "sparrow-sinks-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# An SPDX SBOM per archive (needs syft on PATH).
sboms:
  - artifacts: archive

# Keyless cosign signature of checksums.txt, which covers every archive and
# SBOM. Needs cosign on PATH and an OIDC token (id-token: write in CI).
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/sarathsp06/sparrow/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^test"
      - "^ci"
      - "^build"
      - "^chore\\(release\\)"
  groups:
    - title: Added
      regexp: "^feat"
      order: 0
    - title: Fixed
      regexp: "^fix"
      order: 1
    - title: Changed
      regexp: "^(perf|refactor|style|chore)"
      order: 2
    - title: Documentation
      regexp: "^docs"
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: sarathsp06
    name: sparrow
  # vX.Y.Z-rc.N is published as a pre-release, never as "latest".
  prerelease: auto
  # The API contract of this release, for generating clients against it.
  extra_files:
    - glob: ./api/openapi.yaml
    - glob: ./api/openapi.json
  header: |
    ## Sparrow {{ .Tag }}

snapshot:
  version_template: "{{ incpatch .Version }}-next"
