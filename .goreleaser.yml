# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    binary: sparrow
    env:
      - CGO_ENABLED=0
    ldflags:
      - -w -s -X github.com/sarathsp06/sparrow.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: sparrow-cli
    main: ./cmd/sparrow
    binary: sparrow
    env:
      - CGO_ENABLED=0
    ldflags:
      - -w -s -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: sparrow-sources
    main: ./cmd/sparrow-sources
    binary: sparrow-sources
    env:
      - CGO_ENABLED=0
    ldflags:
      - -w -s
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: sparrow-sinks
    main: ./cmd/sparrow-sinks
    binary: sparrow-sinks
    env:
      - CGO_ENABLED=0
    ldflags:
      - -w -s
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: server
    ids:
      - server
    name_template: "sparrow-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: sparrow-cli
    ids:
      - sparrow-cli
    name_template: "sparrow-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: sparrow-sources
    ids:
      - sparrow-sources
    name_template: "sparrow-sources-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

  - id: sparrow-sinks
    ids:
      - sparrow-sinks
    name_template: "sparrow-sinks-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test"
      - "^ci"
      - "^build"
      - "^chore\\(release\\)"
  groups:
    - title: Added
      regexp: "^feat"
      order: 0
    - title: Fixed
      regexp: "^fix"
      order: 1
    - title: Changed
      regexp: "^(perf|refactor|style|chore)"
      order: 2
    - title: Documentation
      regexp: "^docs"
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: sarathsp06
    name: sparrow
  header: |
    ## Sparrow {{ .Tag }}

    See [CHANGELOG.md](https://github.com/sarathsp06/sparrow/blob/main/CHANGELOG.md) for the full project history.
  extra_files:
    - glob: build/sparrow-*.tgz

snapshot:
  version_template: "{{ incpatch .Version }}-next"
