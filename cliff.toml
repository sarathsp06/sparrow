# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Generates a Keep a Changelog (https://keepachangelog.com/en/1.1.0/)
# formatted changelog from Conventional Commits.

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{%- macro remote_url() -%}
  https://github.com/sarathsp06/sparrow
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits
| filter(attribute="scope")
| sort(attribute="scope") %}
- **{{ commit.scope }}**: {{ commit.message }}
  {%- if commit.breaking %} (**BREAKING**){% endif %}
{%- endfor -%}
{% for commit in commits %}
{%- if not commit.scope %}
- {{ commit.message }}
  {%- if commit.breaking %} (**BREAKING**){% endif %}
{%- endif -%}
{%- endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"

# Strip noisy content from commit messages:
# 1. Remove everything after the first newline (PR bodies, bullet points)
# 2. Remove Signed-off-by lines
# 3. Remove Co-authored-by lines
# 4. Remove trailing whitespace
commit_preprocessors = [
  { pattern = "\n[\\s\\S]*", replace = "" },
  { pattern = "Signed-off-by:.*", replace = "" },
  { pattern = "Co-authored-by:.*", replace = "" },
  { pattern = "\\s+$", replace = "" },
]

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Changed" },
  { message = "^test", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Changed" },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { body = ".*security", group = "Security" },
]
