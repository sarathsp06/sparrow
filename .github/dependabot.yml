# Weekly dependency updates, grouped per ecosystem so each week is one PR
# per manifest set rather than one per package.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /pkg/access
      - /pkg/signature
      - /pkg/template
      - /satellites/recipes
      - /satellites/sparrow
      - /satellites/sparrow-sinks
      - /satellites/sparrow-sources
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /web
      - /docs
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /.oss-scanner
    schedule:
      interval: weekly
