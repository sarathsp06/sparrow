name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # cosign keyless signing of checksums.txt
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json


      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: |
          make build-ui SEMVER=${{ steps.version.outputs.VERSION }}
          git checkout -- internal/ui/dist/.gitkeep


      # The release note is the tag's CHANGELOG.md section, written for users.
      # A release without one fails here instead of shipping a commit list.
      # A release candidate (vX.Y.Z-rc.N) uses the vX.Y.Z section when it is
      # already written, otherwise Unreleased.
      - name: Extract release notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          section_of() {
            awk -v s="$1" '
              index($0, "## [" s "]") == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
          }
          for section in "$GITHUB_REF_NAME" "${GITHUB_REF_NAME%%-*}" Unreleased; do
            section_of "$section" > "$notes"
            if grep -q '[^[:space:]]' "$notes"; then break; fi
            # Only release candidates fall back past their own tag.
            case "$GITHUB_REF_NAME" in *-*) ;; *) break ;; esac
          done
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no '## [$GITHUB_REF_NAME]' section"
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\nFull commit list: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> "$notes"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-submodules:
    name: Release Split Modules
    runs-on: ubuntu-latest
    # The Go module proxy caches a tag forever, so only tag once the build and
    # the tests are green.
    needs: [test, release]
    permissions:
      contents: write # push the split-module tags
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag and publish pkg/* and satellites/* modules
        run: scripts/release-submodules.sh "$GITHUB_REF_NAME" --push

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SEMVER=${{ steps.version.outputs.VERSION }}
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
