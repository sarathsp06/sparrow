name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Ensure embedded UI placeholder exists
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # govulncheck may panic with Go 1.26 due to upstream x/tools bug
        # (https://github.com/golang/go/issues/XXXXX). Allow failure until fixed.
        continue-on-error: true
        run: |
          govulncheck ./...
          (cd satellites/sparrow && govulncheck ./...)

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Ensure embedded UI placeholder exists
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./... \
            github.com/sarathsp06/sparrow/satellites/sparrow/... \
            github.com/sarathsp06/sparrow/pkg/signature/... \
            github.com/sarathsp06/sparrow/pkg/template/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          fail_ci_if_error: false

  ui-e2e:
    name: UI E2E
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend unit tests
        working-directory: web
        run: npm run test:unit

      - name: Run UI browser tests
        run: make test-ui

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, ui-e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Ensure embedded UI placeholder exists
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep

      - name: Build server
        run: go build -v -o bin/server ./cmd/server

      - name: Build migrate
        run: go build -v -o bin/migrate ./cmd/migrate

      - name: Build benchmark
        run: go build -v -o bin/benchmark ./cmd/benchmark

      - name: Build CLI
        run: go build -v -o bin/sparrow ./satellites/sparrow

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Ensure embedded UI placeholder exists
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep

      - name: Install dependencies
        run: go mod download

      - name: Run integration tests
        run: go test -v -tags integration -timeout 600s -race ./internal/integration/...
