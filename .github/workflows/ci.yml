name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # release.yml runs the whole suite before it publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Ensure embedded UI placeholder exists
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m

      # sinks and sources are their own modules; root ./... no longer covers them.
      - name: golangci-lint (sparrow-sinks)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: satellites/sparrow-sinks
          args: --timeout=5m

      - name: golangci-lint (sparrow-sources)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: satellites/sparrow-sources
          args: --timeout=5m

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: |
          govulncheck ./...
          (cd satellites/sparrow && govulncheck ./...)
          (cd satellites/sparrow-sinks && govulncheck ./...)
          (cd satellites/sparrow-sources && govulncheck ./...)

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Ensure embedded UI placeholder exists
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep

      # sum.golang.org occasionally drops a request mid-stream; retry before
      # failing the job. Checksum verification stays on.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt), retrying in 10s"
            sleep 10
          done
          exit 1

      # go test skips packages without test files; build the binaries too.
      - name: Build binaries
        run: go build ./cmd/... github.com/sarathsp06/sparrow/satellites/sparrow/...

      - name: Run tests
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
        run: |
          go test -v -race \
            -coverpkg=./internal/...,github.com/sarathsp06/sparrow/pkg/... \
            -coverprofile=cover-unit.out \
            ./... \
            github.com/sarathsp06/sparrow/satellites/sparrow/... \
            github.com/sarathsp06/sparrow/satellites/recipes/... \
            github.com/sarathsp06/sparrow/satellites/sparrow-sinks/... \
            github.com/sarathsp06/sparrow/satellites/sparrow-sources/... \
            github.com/sarathsp06/sparrow/pkg/access/... \
            github.com/sarathsp06/sparrow/pkg/safetransport/... \
            github.com/sarathsp06/sparrow/pkg/signature/... \
            github.com/sarathsp06/sparrow/pkg/template/...

      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-unit
          path: cover-unit.out
          retention-days: 7

  ui-e2e:
    name: UI E2E
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend unit tests
        working-directory: web
        run: npm run test:unit

      - name: Run UI browser tests
        run: make test-ui

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Ensure embedded UI placeholder exists
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep

      # sum.golang.org occasionally drops a request mid-stream; retry before
      # failing the job. Checksum verification stays on.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $attempt), retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Run integration tests
        run: |
          go test -v -tags integration -timeout 600s -race \
            -coverpkg=./internal/...,github.com/sarathsp06/sparrow/pkg/... \
            -coverprofile=cover-integration.out \
            ./internal/integration/...

      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-integration
          path: cover-integration.out
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          merge-multiple: true

      # Core = internal/... and pkg/... without generated *_otel.go wrappers.
      - name: Check core coverage
        run: scripts/coverage.sh -v -min 80 cover-unit.out cover-integration.out
