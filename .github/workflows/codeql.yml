name: CodeQL

# Static analysis (SAST) for the Go server and modules, the Svelte UI and docs
# (JavaScript/TypeScript), and these workflows. Complements gosec in
# golangci-lint: CodeQL follows data flow across functions (e.g. a request
# value reaching an outbound URL, a file path or a log line). Results show in
# the repository's Security tab and as a check on pull requests.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, so new CodeQL queries run against code that has not changed.
    - cron: '21 4 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # Build every workspace module so CodeQL extracts all of them (root
      # ./... covers only the root module).
      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep
          go build ./...
          for m in pkg/access pkg/signature pkg/template satellites/recipes satellites/sparrow satellites/sparrow-sinks satellites/sparrow-sources; do
            (cd "$m" && go build ./...)
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
