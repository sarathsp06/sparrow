<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" enable-background="new 0 0 100 80" role="img" aria-labelledby="title desc">
  <title id="title">Flying sparrow logo</title>
  <desc id="desc">Fast flying sparrow with flapping wings.</desc>
  
  <!-- Bird (transformed for horizontal flight) -->
  <g transform="translate(20, 15) rotate(-10 32 32) scale(0.9)">
    <!-- Tail feathers (swept back) -->
    <g fill="#42ade2">
      <path d="m59.8 24.3c0 0 1.1-6.2-3.5-3.4 0 0-.4-6.3-4.3-1.9 0 0-2.1-3.9-4.4-.3-3.1 4.8-5.2 12.4-3.2 25l3.8-2.5c2.7-7.9 12.4-8.8 13.7-13.1.9-3-2.1-3.8-2.1-3.8"/>
    </g>
    
    <!-- Body -->
    <path d="m54 36.2c3.9 0-4.1 17.5-23.3 17.5-13 0-23.9-5.2-23.9-21.5 0-10.1 6.4-18.3 19.5-15 13.3 3.5 6.5 19 27.7 19" fill="#42ade2"/>
    
    <!-- Belly highlight -->
    <path d="m37.6 51.7c-15.6 0-14-12-27.9-11.2 5.1 15.8 27.9 11.2 27.9 11.2" fill="#fff"/>
    
    <!-- Top wing (flapping up) -->
    <path d="m39.1 29.2c-10-9.8-20.2 6.2-7.9 12.6 12.1 6.2 20.4-4.8 20.4-4.8s-6.1-1.5-12.5-7.8" fill="#297b9d" transform="rotate(-15 35 35)">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="-15 35 35"
        to="15 35 35"
        dur="0.3s"
        repeatCount="indefinite"
        additive="sum"/>
    </path>
    
    <!-- Bottom wing (flapping down) -->
    <path d="m39.1 29.2c-10-9.8-20.2 6.2-7.9 12.6 12.1 6.2 20.4-4.8 20.4-4.8s-6.1-1.5-12.5-7.8" fill="#297b9d" opacity="0.7" transform="rotate(15 35 40)">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="15 35 40"
        to="-15 35 40"
        dur="0.3s"
        repeatCount="indefinite"
        additive="sum"/>
    </path>
    
    <!-- Head feathers (swept back) -->
    <g fill="#42ade2">
      <path d="m22.1 17.6l-9.9 3.6c2.2-12 16.6-11.2 16.6-11.2s-6.8 3.2-6.7 7.6"/>
      <path d="m23.7 19.8l-10.5 1.4c4.8-11.2 18.7-7.3 18.7-7.3s-7.3 1.6-8.2 5.9"/>
    </g>
    
    <!-- Beak -->
    <g fill="#ffd93b">
      <path d="m2 29l5.4-1.4v3.6c0-.1-3.3-.6-5.4-2.2"/>
      <path d="M7.4,27.5L2,24.8c3.6-2.8,7.7-1.9,7.7-1.9L7.4,27.5z"/>
    </g>
    
    <!-- Eye -->
    <circle cx="15.1" cy="24.9" r="2.5" fill="#3e4347"/>
  </g>
  
  <!-- Speed lines (animated) -->
  <g stroke="#42ade2" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none">
    <line x1="5" y1="25" x2="20" y2="25">
      <animate attributeName="x1" from="5" to="0" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="20" to="15" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="8" y1="35" x2="25" y2="35">
      <animate attributeName="x1" from="8" to="3" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="25" to="20" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="3" y1="45" x2="18" y2="45">
      <animate attributeName="x1" from="3" to="-2" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="18" to="13" dur="0.6s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
