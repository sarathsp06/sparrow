  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "04b-recipes";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var DUR = 6.5;

      // ---------- geometry ----------
      // viewport inside the window: 1138 x 640; capture fit-width scale
      var VP_W = 1138, VP_H = 640;
      var IMG_S = VP_W / 1920;                     // 0.59271 (matches CSS)

      // recipe grid in 1920-wide capture coordinates
      var G = { x0: 548, y0: 205, x1: 1628, y1: 460 };
      // card boxes (capture space)
      var CARDS = {
        sendgrid:  [1272, 293, 1628, 375],
        twilio:    [910, 382, 1265, 460],
        pagerduty: [910, 293, 1265, 375],
        discord:   [1272, 205, 1628, 285]
      };

      function placeMark(key, box, pad) {
        var el = $("mark-" + key);
        var w = box[2] - box[0] + pad * 2, h = box[3] - box[1] + pad * 2;
        el.style.left = (box[0] - pad) + "px";
        el.style.top = (box[1] - pad) + "px";
        el.style.width = w + "px";
        el.style.height = h + "px";
        var r = el.querySelector("rect");
        r.setAttribute("x", 0); r.setAttribute("y", 0);
        r.setAttribute("width", w); r.setAttribute("height", h);
        return r;
      }
      var RECT = {};
      Object.keys(CARDS).forEach(function (k) { RECT[k] = placeMark(k, CARDS[k], 4); });
      RECT.grid = placeMark("grid", [G.x0, G.y0, G.x1, G.y1], 14);

      // coordinate-target-zoom (nested wrappers: T = -offset, independent of S)
      var gcx = ((G.x0 + G.x1) / 2) * IMG_S;       // grid centre in viewport px
      var gcy = ((G.y0 + G.y1) / 2) * IMG_S;
      var gW = (G.x1 - G.x0 + 28) * IMG_S, gH = (G.y1 - G.y0 + 28) * IMG_S;
      var OFF_X = gcx - VP_W / 2, OFF_Y = gcy - VP_H / 2;
      var DESIRED = (0.92 * VP_W) / gW;            // cards fill the stage width
      var MAXS = Math.min((0.94 * VP_W) / gW, (0.88 * VP_H) / gH);
      var ZS = Math.min(DESIRED, MAXS);
      var TX = -OFF_X, TY = -OFF_Y;

      // ---------- dynamic-content-sequencing: windows for the four recipes ----------
      // duration per entry = BASE + chars * SEC_PER_CHAR, normalised into the 1.6–4.4 window
      var SEQ_START = 1.6, SEQ_END = 4.4;
      var BASE = 0.5, SEC_PER_CHAR = 0.012;
      var CONTENT = [
        { key: "sendgrid",  text: "email via SendGrid" },
        { key: "twilio",    text: "SMS via Twilio" },
        { key: "pagerduty", text: "alerts via PagerDuty" },
        { key: "discord",   text: "chat via Discord" }
      ];
      var raw = CONTENT.map(function (e) { return BASE + e.text.length * SEC_PER_CHAR; });
      var rawSum = raw.reduce(function (s, v) { return s + v; }, 0);
      var kf = (SEQ_END - SEQ_START) / rawSum;
      var cum = SEQ_START;
      var TIMELINE = CONTENT.map(function (e, i) {
        var start = cum; cum += raw[i] * kf;
        return { key: e.key, start: start, end: cum };
      });
      var FINAL_AT = 4.5;

      // ---------- typed API line (one span per char, revealed by zero-length display sets) ----------
      var API = "sparrow use sendgrid --event order.created";
      var TYPE_AT = 0.6, TYPE_DUR = 0.9;
      var apiText = $("api-text");
      var CHARS = [];
      for (var c = 0; c < API.length; c++) {
        var sp = document.createElement("span");
        sp.className = ID + "-ch";
        sp.textContent = API.charAt(c);
        apiText.appendChild(sp);
        CHARS.push(sp);
      }

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–0.5): kicker, story, framed window settles ----
      tl.fromTo($("kicker"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo($("hairline"), { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#root [class~='04b-recipes-w']",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.035 }, 0.05);
      tl.fromTo($("support"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.35);
      tl.fromTo($("window"),
        { opacity: 0, y: 30, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0);

      // ---- Scene 2 (0.5–1.6): camera pushes in on the recipe grid; API line types on ----
      var ZOOM_AT = 0.5, ZOOM_DUR = 1.1;
      tl.fromTo($("zoom-outer"), { scale: 1 }, { scale: ZS, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);
      tl.fromTo($("zoom-inner"), { x: 0, y: 0 }, { x: TX, y: TY, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);
      tl.fromTo($("api"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power3.out" }, TYPE_AT - 0.05);
      CHARS.forEach(function (sp, i) {
        tl.fromTo(sp, { display: "none" }, { display: "inline", duration: 0, immediateRender: false }, TYPE_AT + (i / API.length) * TYPE_DUR);
      });

      // ---- Scene 3 (1.6–4.4): marker outlines step across the cards; sub-line swaps in step ----
      var DRAW = 0.38;
      TIMELINE.slice(0, 4).forEach(function (e, idx) {
        var t = e.start + 0.04;
        var r = RECT[e.key];
        tl.fromTo(r, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: DRAW, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo(r, { fill: "rgba(234,157,43,0)" }, { fill: "rgba(234,157,43,0.10)", duration: 0.25, ease: "power3.out", immediateRender: false }, t + DRAW - 0.12);
        if (idx > 0) {
          var prev = $("mark-" + TIMELINE[idx - 1].key);
          tl.fromTo(prev, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
        }
        var sl = $("sub-" + e.key);
        tl.fromTo(sl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, e.start);
        var outAt = idx < 3 ? TIMELINE[idx + 1].start - 0.12 : FINAL_AT - 0.14;
        tl.fromTo(sl, { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.14, ease: "power3.out", immediateRender: false }, outAt);
      });

      // ---- Scene 4 (4.4–5.6): outlines clear; one wide outline around the whole grid; sub-line settles ----
      tl.fromTo($("mark-discord"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 4.4);
      tl.fromTo(RECT.grid, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.75, ease: "power3.inOut", immediateRender: false }, 4.45);
      tl.fromTo($("sub-all"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, FINAL_AT);

      // ---- Scene 5 (5.6–6.5): held read. Still. ----

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
