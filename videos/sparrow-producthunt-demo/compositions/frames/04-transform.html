<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById("04-transform-" + id); };
  var tl = gsap.timeline({ paused: true });
  var DUR = 10;

  // ---------- marker outlines (capture coords, 1920-wide) ----------
  function sketch(x, y, w, h) {
    return "M" + (x + w * 0.05) + "," + (y - 2) +
      " L" + (x + w + 3) + "," + (y + 1) +
      " L" + (x + w - 1) + "," + (y + h + 3) +
      " L" + (x - 3) + "," + (y + h - 1) +
      " L" + (x + 1) + "," + (y - 3) +
      " L" + (x + w * 0.14) + "," + (y + 1);
  }
  $("olp").setAttribute("d", sketch(9, 139, 910, 79));   // PROMPT FOR AI textarea (x 16–910, y 145–210)
  $("olt").setAttribute("d", sketch(52, 568, 806, 30));  // template mrkdwn printf line (x 60–850, y≈582)

  // ---------- camera: outer scales, inner counter-translates (T = -offset), shared ease + duration ----------
  var K = 1138 / 1920, VW = 1138, VH = 640;
  var outer = $("camo"), inner = $("cami");
  function pose(s, cx, cy) {            // cx/cy = camera centre in capture coords, clamped so no blank shows past the edges
    var hx = 960 / s, hy = 540 / s;
    cx = Math.min(Math.max(cx, hx), 1920 - hx);
    cy = Math.min(Math.max(cy, hy), 1080 - hy);
    return { s: s, x: -(cx * K - VW / 2), y: -(cy * K - VH / 2) };
  }
  var N = pose(1, 960, 540);
  var P = pose(1.8, 463, 178);    // PROMPT FOR AI -> clamps to the capture's upper-left corner
  var T = pose(1.8, 455, 582);    // template printf line -> clamps to the left edge
  var R = pose(1.8, 1105, 517);   // RENDERED · LIVE line
  gsap.set(outer, { scale: N.s, transformOrigin: "50% 50%" });
  gsap.set(inner, { x: N.x, y: N.y });
  function move(from, to, at, dur, ease) {
    tl.fromTo(outer, { scale: from.s }, { scale: to.s, duration: dur, ease: ease, immediateRender: false }, at);
    tl.fromTo(inner, { x: from.x, y: from.y }, { x: to.x, y: to.y, duration: dur, ease: ease, immediateRender: false }, at);
  }
  move(N, P, 0.6, 1.4, "power3.inOut");   // Scene 2 push-in (coordinate-target-zoom)
  move(P, T, 2.8, 0.8, "power3.inOut");   // Scene 3 travel down to TEMPLATE (viewport-change)
  move(T, R, 3.9, 0.7, "power3.inOut");   // ...continues right to RENDERED · LIVE (cut-the-curve)
  move(R, N, 5.0, 1.3, "power3.out");     // Scene 4 one decelerating pull-back, then still

  // per-character spans revealed at keystroke thresholds (discrete-text-sequence, seek-safe tl.set)
  function spansFor(el, str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var sp = document.createElement("span");
      sp.className = "04-transform-ch";
      sp.textContent = str[i];
      el.appendChild(sp); out.push(sp);
    }
    return out;
  }

  // ---------- Scene 1 (0–0.6): panel + window settle ----------
  tl.fromTo($("kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0);
  tl.fromTo($("hair"), { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, 0);
  tl.fromTo([$("s1"), $("s2"), $("s3"), $("s4")], { opacity: 0, y: 26 },
    { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 0.05);
  tl.fromTo($("win"), { opacity: 0, y: 30, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0);

  // ---------- Scene 2 (0.6–2.8): prompt outline draws as the push settles ----------
  tl.fromTo($("olp"), { strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power3.inOut" }, 1.75);

  // ---------- Scene 3 (2.8–5.0): outline redraws on the template line; rendered line glows; API line types ----------
  tl.to($("olp"), { opacity: 0, duration: 0.3, ease: "power3.out" }, 2.8);
  tl.fromTo($("olt"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.55, ease: "power3.inOut" }, 3.35);
  tl.fromTo($("glowbar"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 4.45);
  tl.fromTo($("glowring"), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 4.6);

  var API = "POST /v1/subscriptions:testTemplate";
  var apiSp = spansFor($("api"), API);
  for (var ai = 0; ai < apiSp.length; ai++) tl.set(apiSp[ai], { display: "inline" }, 4.1 + ai * 0.024);

  // ---------- Scene 4 (5.0–6.4): pull back + sub-line ----------
  tl.fromTo($("sub"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.6);

  // ---------- Scene 5 (6.4–8.8): terminal chip slides up, recipe command types, output prints ----------
  tl.fromTo($("term"), { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 6.4);

  var CMD = "sparrow use slack --param webhook_url=https://hooks.slack.com/… --event order.created";
  var SPLIT = 63;   // line 1 ends after the pasted URL; "--event order.created" wraps to line 2 (wrap-point space dropped)
  var sp1 = spansFor($("c1"), CMD.substring(0, SPLIT));
  var sp2 = spansFor($("c2"), CMD.substring(SPLIT + 1));
  var all = sp1.concat([null]).concat(sp2);   // null = the wrap-point space
  var k1 = $("k1"), k2 = $("k2");
  gsap.set(k2, { opacity: 0 });
  // idle caret blink before typing starts (deterministic discrete sets)
  [6.4, 6.62].forEach(function (bt, bi) { tl.set(k1, { opacity: bi % 2 ? 0 : 1 }, bt); });
  var t = 6.85, n = 0;
  tl.set(k1, { opacity: 1 }, t);
  function reveal(sp, at) { if (sp) tl.set(sp, { display: "inline" }, at); }
  function keys(count, step) { for (var i = 0; i < count; i++) { t += step; reveal(all[n], t); n++; } }
  keys(7, 0.03);  t += 0.06;          // sparrow
  keys(11, 0.026); t += 0.06;         // " use slack "
  keys(20, 0.02);  t += 0.05;          // "--param webhook_url="
  t += 0.05;                          // pasted URL lands in one jump
  for (var u = 0; u < 25; u++) { reveal(all[n], t); n++; }
  t += 0.06;
  n++;                                // wrap-point space
  tl.set($("l2"), { visibility: "visible" }, t + 0.02);
  tl.set(k1, { opacity: 0 }, t + 0.02);
  tl.set(k2, { opacity: 1 }, t + 0.02);
  keys(all.length - n, 0.02);         // "--event order.created"
  var T_OUT = t + 0.18;               // ≈ 8.6s
  tl.set(k2, { opacity: 0 }, T_OUT);
  tl.set($("out"), { visibility: "visible" }, T_OUT);

  // ---------- Scene 6 (8.8–10): held read, still ----------
  tl.set({}, {}, DUR);

  window.__timelines = window.__timelines || {};
  window.__timelines["04-transform"] = tl;
})();
</script>
