      // ---- punch-in geometry (coordinate-target-zoom, nested wrappers, clipped by the window) ----

      // target row (TOP row) in 1920-space capture: x 335–1915, y 372–430
      // The full row spans 82% of the capture width, so fitting all of it is only a ~1.2x push.
      // Frame the readable span instead — event · webhook · consumer · Success · 200 (x 500–1450) —
      // so it fills the stage width; the row's outer columns crop at the window edge.
      var rowCX = (500 + 1450) / 2 * IMG_S, rowCY = (372 + 430) / 2 * IMG_S;
