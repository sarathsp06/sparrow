  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const DURATION = 4.5;
      const tl = gsap.timeline({ paused: true });

      const label = document.getElementById("06-closing-label");
      const headline = document.getElementById("06-closing-headline");
      const ruleLine = document.getElementById("06-closing-rule-line");
      const repoText = document.getElementById("06-closing-repo-text");
      const caret = document.getElementById("06-closing-caret");
      const docs = document.getElementById("06-closing-docs");

      // Scene 1 (0.0-0.4s): ink-black field, logo + wordmark anchor already settled.

      // Scene 2 (0.4-1.3s): the one move -- the orange label line and "mit licensed."
      // slide-up crossfade into center together (label leads by a hair).
      tl.fromTo(
        label,
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.4,
      );
      tl.fromTo(
        headline,
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.85, ease: "power3.out" },
        0.45,
      );

      // Scene 3 (1.3-2.6s): orange stub rule draws in (svg-path-draw)...
      const RULE_LEN = 36;
      tl.fromTo(
        ruleLine,
        { strokeDasharray: RULE_LEN, strokeDashoffset: RULE_LEN },
        { strokeDashoffset: 0, duration: 0.4, ease: "power3.out" },
        1.3,
      );

      // ...and the repo URL types on behind an orange caret (discrete-text-sequence +
      // context-sensitive-cursor). SEQUENCE baked once at build time.
      const URL = "github.com/sarathsp06/sparrow";
      const T_CARET_ON = 1.3;
      const T_TYPE_START = 1.42;
      const T_TYPE_END = 2.5;
      const STEP = (T_TYPE_END - T_TYPE_START) / URL.length;
      const SEQUENCE = [{ t: 0, text: "" }];
      for (let i = 1; i <= URL.length; i++) {
        SEQUENCE.push({ t: T_TYPE_START + (i - 1) * STEP, text: URL.slice(0, i) });
      }
      const CHANGE_TIMES = SEQUENCE.slice(1).map((e) => e.t);
      const TYPING_GRACE = 0.22;
      const BLINK_PERIOD = 1.0;

      function entryAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      const driver = { t: 0 };
      let lastText = null;
      function render() {
        const time = driver.t;
        const entry = entryAt(time);
        if (entry.text !== lastText) {
          repoText.textContent = entry.text;
          lastText = entry.text;
        }
        let visible;
        if (time < T_CARET_ON) {
          visible = false;
        } else {
          const isTyping =
            time < T_TYPE_START ||
            CHANGE_TIMES.some((t) => t <= time && time - t < TYPING_GRACE);
          if (isTyping) {
            visible = true;
          } else {
            // Deterministic square-wave blink, phase anchored at the end of typing.
            const phase = (time - T_TYPE_END) * (Math.PI * 2) / BLINK_PERIOD;
            visible = Math.sin(phase + Math.PI / 2) > 0;
          }
        }
        caret.style.opacity = visible ? "1" : "0";
      }
      tl.to(driver, { t: DURATION, duration: DURATION, ease: "none", onUpdate: render }, 0);

      // Scene 4 (2.6-3.4s): docs URL fades in cream-muted below.
      tl.fromTo(
        docs,
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        2.6,
      );

      // Scene 5 (3.4-4.5s): settled hold to the last frame; caret blink is the only motion.
      tl.set({}, {}, DURATION);

      render();
      window.__timelines["06-closing"] = tl;
    })();
  </script>
