  <script>
    (function () {
      const DURATION = 5.5;
      const tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0–0.6): kicker, story, hairline, terminal settle ----------
      tl.fromTo("#s02-kicker", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.0);
      tl.fromTo(["#s02-l1", "#s02-l2", "#s02-l3", "#s02-l4"],
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.09 }, 0.08);
      tl.fromTo("#s02-hairline", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, 0.0);
      // spring-pop entrance, smooth long-tail settle, no overshoot
      tl.fromTo("#s02-terminal",
        { opacity: 0, scale: 0.9, y: 24 },
        { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.0);

      // ---------- Scene 2 (0.6–1.8): command types behind a caret (discrete-text-sequence) ----------
      const CMD = "docker compose up -d";
      const SEQUENCE = [{ t: 0, text: "" }];
      let tt = 0.62;
      for (let i = 0; i < CMD.length; i++) {
        SEQUENCE.push({ t: tt, text: CMD.slice(0, i + 1) });
        tt += CMD[i] === " " ? 0.1 : 0.045;
      }
      const T_TYPED = SEQUENCE[SEQUENCE.length - 1].t;
      const T_ENTER = 1.8;    // submitted: caret leaves the command line
      const T_PROMPT2 = 2.95; // fresh prompt after the output

      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      // ---------- Scene 4 curl chip (3.0–4.3): command types, "healthy" prints ----------
      const CURL = "curl -s localhost:8080/health | jq .status";
      const CURL_SEQ = [{ t: 0, text: "" }];
      let ct = 3.15;
      for (let i = 0; i < CURL.length; i++) {
        CURL_SEQ.push({ t: ct, text: CURL.slice(0, i + 1) });
        ct += CURL[i] === " " ? 0.04 : 0.015;
      }
      const T_CURL_TYPED = CURL_SEQ[CURL_SEQ.length - 1].t;
      const T_CURL_ENTER = 4.0;
      const T_HEALTHY = 4.1;
      function curlAt(time) {
        for (let i = CURL_SEQ.length - 1; i >= 0; i--) {
          if (time >= CURL_SEQ[i].t) return CURL_SEQ[i].text;
        }
        return "";
      }

      const cmdEl = document.getElementById("s02-cmd");
      const caret1 = document.getElementById("s02-caret1");
      const caret2 = document.getElementById("s02-caret2");
      const prompt2 = document.getElementById("s02-prompt2");
      const curlEl = document.getElementById("s02-curl");
      const chipCaret = document.getElementById("s02-chip-caret");
      const healthyEl = document.getElementById("s02-healthy");
      const BLINK_PERIOD = 0.64;
      let lastCmd = null, lastCurl = null, lastState = "";

      function render(time) {
        const cmd = textAt(time);
        if (cmd !== lastCmd) { cmdEl.textContent = cmd; lastCmd = cmd; }
        const curl = curlAt(time);
        if (curl !== lastCurl) { curlEl.textContent = curl; lastCurl = curl; }

        // deterministic square-wave blink; solid while actively typing
        const blinkOn = Math.sin((time / BLINK_PERIOD) * Math.PI * 2) > -0.2;
        const typingCmd = time >= 0.62 && time < T_TYPED + 0.05;
        const c1 = time < T_ENTER && (typingCmd || blinkOn) ? "1" : "0";
        const p2 = time >= T_PROMPT2 ? "1" : "0";
        const c2 = time >= T_PROMPT2 && blinkOn ? "1" : "0";
        const typingCurl = time >= 3.15 && time < T_CURL_TYPED + 0.05;
        const cc = time < T_CURL_ENTER && (typingCurl || blinkOn) ? "1" : "0";
        const hl = time >= T_HEALTHY ? "1" : "0";
        const state = c1 + p2 + c2 + cc + hl;
        if (state !== lastState) {
          caret1.style.opacity = c1;
          prompt2.style.opacity = p2;
          caret2.style.opacity = c2;
          chipCaret.style.opacity = cc;
          healthyEl.style.opacity = hl;
          lastState = state;
        }
      }
      render(0);
      const driver = { t: 0 };
      tl.to(driver, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () { render(driver.t); }
      }, 0);

      // ---------- Scene 3 (1.8–3.0): output lines, one per cue (dynamic-content-sequencing) ----------
      const OUTPUT = [
        { sel: "#s02-out0", text: "Network sparrow_default Created" },
        { sel: "#s02-out1", text: "Container sparrow-postgres-1 Started" },
        { sel: "#s02-out2", text: "Container sparrow-sparrow-1 Started" }
      ];
      const BASE = 0.26, SEC_PER_CHAR = 0.003;
      let cum = 1.95;
      const OUT_TIMELINE = OUTPUT.map(function (e) {
        const start = cum;
        cum += BASE + e.text.length * SEC_PER_CHAR;
        return { sel: e.sel, start: start };
      });
      OUT_TIMELINE.forEach(function (e) {
        tl.fromTo(e.sel, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.14, ease: "power3.out" }, e.start);
      });
      tl.fromTo("#s02-out2 .s02-check",
        { scale: 0.5 },
        { scale: 1, duration: 0.3, ease: "power3.out", transformOrigin: "50% 50%" }, OUT_TIMELINE[2].start);

      // ---------- Scene 4 left: chip settles in (spring-pop, no overshoot) ----------
      tl.fromTo("#s02-chip",
        { opacity: 0, scale: 0.92, y: 18 },
        { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.0);
      tl.fromTo("#s02-healthy", { x: -8 }, { x: 0, duration: 0.2, ease: "power3.out" }, T_HEALTHY);

      // ---------- Scene 4 (3.0–4.3): cut-the-curve, matched upward travel ----------
      // terminal contracts toward the top of the stage while the browser rises from below the mask
      const MOVE_T = 3.12, MOVE_D = 1.0, MOVE_EASE = "power3.inOut";
      tl.fromTo("#s02-terminal",
        { scale: 1, x: 0 },
        { scale: 0.4, x: 80, duration: MOVE_D, ease: MOVE_EASE, immediateRender: false }, MOVE_T);
      tl.fromTo("#s02-browser",
        { y: 600 },
        { y: 0, duration: MOVE_D, ease: MOVE_EASE }, MOVE_T);
      // speed blur on the rising surface, resolving as it lands (full-frame surface: 18px peak)
      tl.fromTo("#s02-browser",
        { filter: "blur(18px)" },
        { filter: "blur(0px)", duration: 0.55, ease: "power3.out", immediateRender: true }, MOVE_T + MOVE_D * 0.45);

      // ---------- Scene 5 (4.3–5.5): held read; only the carets blink ----------

      window.__timelines = window.__timelines || {};
      window.__timelines["02-start-server"] = tl;
    })();
  </script>
