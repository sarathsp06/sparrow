  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const P = "05b-developer-";
      const $ = function (id) { return document.getElementById(P + id); };
      const DURATION = 9;
      const tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–0.5): kicker, story, hairline; terminal settles
      tl.fromTo($("kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.0);
      tl.fromTo($("hairline"), { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power3.out" }, 0.0);
      tl.fromTo([$("story-l1"), $("story-l2")], { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 0.08);
      tl.fromTo([$("assist-l1"), $("assist-l2")], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.32);
      tl.fromTo($("term"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.0);

      // ---- Scene 2 (0.5–2.0): install one-liner types at the prompt (discrete-text-sequence)
      const HEAD = "curl -fsSL ";
      const CHUNKS = ["https://", "raw.", "githubusercontent", ".com/", "sarathsp06/", "sparrow/", "main/", "scripts/", "install.sh", " | ", "sh"];
      const SEQUENCE = [{ t: 0, text: "" }];
      let tt = 0.55;
      for (let i = 0; i < HEAD.length; i++) {
        SEQUENCE.push({ t: tt, text: HEAD.slice(0, i + 1) });
        tt += HEAD[i] === " " ? 0.07 : 0.032;
      }
      let acc = HEAD;
      tt += 0.04;
      for (let j = 0; j < CHUNKS.length; j++) {
        acc += CHUNKS[j];
        SEQUENCE.push({ t: tt, text: acc });
        tt += 0.085;
      }
      const T_TYPED = SEQUENCE[SEQUENCE.length - 1].t;
      const T_ENTER = 2.0;
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      // left API line types on in Scene 4 (smooth slice)
      const API_TEXT = "GET /openapi.yaml · generate your client";
      const API_AT = 3.2, API_DUR = 1.3;

      const cmdEl = $("cmd"), caretEl = $("caret"), apiEl = $("api");
      const BLINK = 0.6;
      let lastCmd = null, lastCaret = "", lastApi = null;
      function render(time) {
        const text = textAt(time);
        if (text !== lastCmd) { cmdEl.textContent = text; lastCmd = text; }
        const typing = time >= 0.55 && time < T_TYPED + 0.05;
        const on = typing || Math.sin((time / BLINK) * Math.PI * 2) > -0.2;
        const c = time < T_ENTER && on ? "1" : "0";
        if (c !== lastCaret) { caretEl.style.opacity = c; lastCaret = c; }
        const k = Math.max(0, Math.min(1, (time - API_AT) / API_DUR));
        const api = API_TEXT.substring(0, Math.floor(k * API_TEXT.length));
        if (api !== lastApi) { apiEl.textContent = api; lastApi = api; }
      }
      render(0);
      const driver = { t: 0 };
      tl.to(driver, { t: DURATION, duration: DURATION, ease: "none", onUpdate: function () { render(driver.t); } }, 0);

      // ---- Scene 3 (2.0–2.9): two output lines print one per cue
      tl.fromTo($("out0"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.16, ease: "power3.out" }, 2.1);
      tl.fromTo($("out1"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.16, ease: "power3.out" }, 2.55);

      // ---- Scene 4 (2.9–5.2): three fact cards assemble left-to-right, one per cue
      [3.0, 3.7, 4.4].forEach(function (at, i) {
        const card = $("card" + i);
        tl.fromTo(card.querySelector(".dev05b-card-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, at);
        tl.fromTo(card.querySelector(".dev05b-card-rule-accent"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, at + 0.05);
        tl.fromTo(card.querySelector(".dev05b-card-label"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at + 0.06);
        tl.fromTo(card.querySelector(".dev05b-card-lead"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at + 0.12);
      });

      // ---- Scene 5 (5.2–7.6): browser rises over the cards; camera punches into the API Console
      tl.fromTo($("stagebase"), { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power3.out" }, 5.2);
      tl.fromTo($("browser"), { opacity: 0, y: 260 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 5.2);
      tl.fromTo($("sub"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.6);

      // coordinate-target-zoom, capture space (1920x1080) inside a 1138x640 viewport.
      // Rest: outer scale S0 fits the capture to the viewport. Punch: visible width 672 capture px (the drawer),
      // right edge clamped to the capture right edge (x 1920) -> centre x 1584; centre y 282 frames
      // the four curl entries (y 130–445). Nested wrappers: T = -offset from capture centre.
      const VIEW_W = 1138;
      const S0 = VIEW_W / 1920;
      const VIS_W = 672;
      const S1 = VIEW_W / VIS_W;
      const CX = 1920 - VIS_W / 2;   // 1584 — drawer x 1248–1920 fills the viewport
      const CY = 282;   // visible y ≈ 93–471: GET /v1/stats row through the /v1/whoami curl block
      const ZOOM_AT = 6.0, ZOOM_DUR = 1.4;
      tl.fromTo($("zoom-outer"), { scale: S0 }, { scale: S1, duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);
      tl.fromTo($("zoom-inner"), { x: 0, y: 0 }, { x: -(CX - 960), y: -(CY - 540), duration: ZOOM_DUR, ease: "power3.inOut" }, ZOOM_AT);

      // orange marker outline draws around the first curl block
      tl.fromTo($("marker").querySelector("rect"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power3.out" }, 7.0);

      // ---- Scene 6 (7.6–9.0): held read on the console. Still.

      window.__timelines = window.__timelines || {};
      window.__timelines["05b-developer"] = tl;
    })();
  </script>
