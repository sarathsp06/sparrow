    <script>
      (function () {
        var DURATION = 3.5;
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-0.4): static ink-black field. Lockup held invisible by the fromTo below.

        // Scene 2 (0.4-1.3): the ONE move - mark + wordmark fade in and settle up together (restrained in/settle, power3).
        tl.fromTo(
          "#t01-title-lockup",
          { opacity: 0, y: 46, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" },
          0.4
        );
        tl.fromTo(
          "#t01-title-mark",
          { y: 18 },
          { y: 0, duration: 0.85, ease: "power3.out" },
          0.4
        );

        // Scene 3 (1.3-2.3): kicker types on behind an orange caret (discrete text sequence).
        var FULL = "self-hosted webhook delivery";
        var STEPS = [0.026, 0.032, 0.028, 0.03, 0.024, 0.034];
        var SEQUENCE = [{ t: 0, text: "" }];
        var t = 1.34;
        for (var i = 1; i <= FULL.length; i++) {
          SEQUENCE.push({ t: t, text: FULL.substring(0, i) });
          var ch = FULL.charAt(i - 1);
          t += STEPS[i % STEPS.length] + (ch === " " || ch === "-" ? 0.03 : 0);
        }
        // Typing events baked at build time (seek-safe, no runtime state)
        var CHANGE_TIMES = SEQUENCE.slice(1).map(function (e) { return e.t; });
        var TYPE_END = CHANGE_TIMES[CHANGE_TIMES.length - 1];
        var CARET_ON = 1.3;
        var TYPING_GRACE = 0.15;
        var BLINK_PERIOD = 0.7; // 5 whole cycles across 3.5s

        function textAt(time) {
          for (var k = SEQUENCE.length - 1; k >= 0; k--) {
            if (time >= SEQUENCE[k].t) return SEQUENCE[k].text;
          }
          return "";
        }

        var textEl = document.getElementById("t01-title-text");
        var cursorEl = document.getElementById("t01-title-cursor");

        var driver = { t: 0 };
        tl.fromTo(
          driver,
          { t: 0 },
          {
            t: DURATION,
            duration: DURATION,
            ease: "none",
            onUpdate: function () {
              var now = driver.t;
              textEl.textContent = textAt(now);
              var op;
              if (now < CARET_ON) {
                op = 0;
              } else if (now <= TYPE_END + TYPING_GRACE) {
                op = 1; // solid while typing
              } else {
                // Scene 5 (3.0-3.5): held read, caret blinks (deterministic square wave)
                op = Math.sin((Math.PI * 2 * (now - TYPE_END - TYPING_GRACE)) / BLINK_PERIOD + Math.PI / 2) > 0 ? 1 : 0;
              }
              cursorEl.style.opacity = String(op);
            }
          },
          0
        );

        // Scene 4 (2.3-3.0): thesis line fades in below in cream-muted lead.
        tl.fromTo(
          "#t01-title-thesis",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          2.3
        );

        window.__timelines["01-title"] = tl;
