<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FAF9F6;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="70"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-title"
        class="scene"
        data-composition-id="01-title"
        data-composition-src="compositions/frames/01-title.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-title-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="3.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-start-server"
        class="scene"
        data-composition-id="02-start-server"
        data-composition-src="compositions/frames/02-start-server.html"
        data-start="3.5"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-start-server-voice"
        src="assets/voice/02.wav"
        data-start="3.5"
        data-duration="5.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03b-schema-infer"
        class="scene"
        data-composition-id="03b-schema-infer"
        data-composition-src="compositions/frames/03b-schema-infer.html"
        data-start="9"
        data-duration="9.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-03b-schema-infer-voice"
        src="assets/voice/03.wav"
        data-start="9"
        data-duration="9"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-register-deliver"
        class="scene"
        data-composition-id="03-register-deliver"
        data-composition-src="compositions/frames/03-register-deliver.html"
        data-start="18"
        data-duration="11.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-register-deliver-voice"
        src="assets/voice/04.wav"
        data-start="18"
        data-duration="11"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-transform"
        class="scene"
        data-composition-id="04-transform"

      <audio
        id="el-04-transform-voice"

        data-track-index="10"

      <div
        id="el-04b-recipes"

        data-composition-id="04b-recipes"

      ></div>
      <audio
        id="el-04b-recipes-voice"
        src="assets/voice/06.wav"
        data-start="39"
        data-duration="8.5"
        data-track-index="10"

      ></audio>

      <div
        id="el-05-health-portal"

        id="el-05b-developer-voice"

        data-start="55.5"

      <div
        id="el-06-closing"

        id="el-06-closing-voice"

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/bed.mp3"
        data-start="0"
        data-duration="70"
        data-track-index="11"
        data-volume="0.12"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-title", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-02-start-server", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.to("#el-02-start-server", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 9);
        tl.fromTo("#el-03b-schema-infer", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 9);
        tl.to("#el-03b-schema-infer", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-03-register-deliver", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.to("#el-03-register-deliver", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 29);
        tl.fromTo("#el-04-transform", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 29);
        tl.to("#el-04-transform", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 39);
        tl.fromTo("#el-04b-recipes", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 39);
        tl.to("#el-04b-recipes", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 47.5);
        tl.fromTo("#el-05-health-portal", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 47.5);
        tl.to("#el-05-health-portal", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 55.5);
        tl.fromTo("#el-05b-developer", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 55.5);
        tl.to("#el-05b-developer", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 65.5);
        tl.fromTo("#el-06-closing", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 65.5);
        tl.to({}, { duration: 70 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
