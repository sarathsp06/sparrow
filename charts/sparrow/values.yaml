# -- Container image for the Sparrow server
image:
  repository: ghcr.io/sarathsp06/sparrow
  # Defaults to .Chart.AppVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

# -- Number of Sparrow pods
# Safe to scale — Sparrow is stateless, all state is in Postgres + River queue.
replicaCount: 1

# -- Sparrow application configuration (non-secret env vars)
sparrow:
  # Serve the embedded SvelteKit web UI on port 8080
  serveUI: "true"
  # "development" = pretty logs; "production" = JSON structured logs
  environment: production
  # Comma-separated list of allowed CORS origins for Connect-RPC.
  # Required when the UI is hosted separately from the API.
  # Example: "https://ui.example.com,https://admin.example.com"
  # Empty + ENVIRONMENT=production = cross-origin blocked (same-origin UI needs no CORS).
  corsAllowedOrigins: ""
  # Extra env vars injected into the Sparrow container.
  # Use this for OTEL_EXPORTER_OTLP_ENDPOINT or any other env var.
  extraEnv: []
  #  - name: OTEL_EXPORTER_OTLP_ENDPOINT
  #    value: "http://otel-collector.observability.svc.cluster.local:4318"

# -- Secrets for Sparrow
secrets:
  # Postgres connection string. Required when postgresql.enabled=false.
  # When postgresql.enabled=true and this is empty, it is auto-constructed.
  databaseURL: ""
  # 64-char hex key for envelope encryption of webhook secrets and headers.
  # Generate with: openssl rand -hex 32
  # Required -- the server will not start without it.
  encryptionKey: ""
  # Optional API key for authenticating all API requests.
  # When set, all HTTP/gRPC requests must include X-API-Key header.
  apiKey: ""
  # Name of a pre-existing Kubernetes Secret containing 'DATABASE_URL' and
  # 'SPARROW_ENCRYPTION_KEY' keys (and optionally 'SPARROW_API_KEY').
  # When set, the chart does NOT create its own Secret.
  existingSecret: ""

# -- Built-in PostgreSQL (optional, OFF by default)
# Enable for dev/staging. For production, keep disabled and provide secrets.databaseURL.
# WARNING: The default password below is publicly known. ALWAYS override
# postgresql.auth.password in any non-ephemeral environment.
postgresql:
  enabled: false
  image: postgres:15-alpine
  auth:
    database: sparrow
    username: sparrow
    # SECURITY: Override this in production! Default is insecure.
    password: sparrow
    # sslmode for the auto-constructed DATABASE_URL.
    # Use "require" or "verify-full" when PG has TLS configured.
    sslmode: disable
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Kubernetes Service
service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 50051

# -- Ingress (optional, OFF by default)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: sparrow.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []
  #  - secretName: sparrow-tls
  #    hosts:
  #      - sparrow.example.com

# -- Resource requests and limits for the Sparrow container
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Horizontal Pod Autoscaler (optional, OFF by default)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 80

# -- ServiceAccount (optional, OFF by default)
serviceAccount:
  create: false
  name: ""
  annotations: {}

# -- Extra pod annotations (e.g. for Vault Agent, Istio, Linkerd sidecar injection)
podAnnotations: {}
#  vault.hashicorp.com/agent-inject: "true"

# -- NetworkPolicy (optional, OFF by default)
# Restricts ingress to Sparrow and PostgreSQL pods for network-level isolation.
networkPolicy:
  enabled: false
  # Additional ingress sources for Sparrow pods (e.g. ingress controller).
  # Example:
  #   ingressFrom:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []
