{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sparrow.postgresql.host" . }}
  labels:
    {{- include "sparrow.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    {{- include "sparrow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
