# Sparrow -- standalone deployment using the published Docker image.
# No need to clone the repo. Just save this file and run:
#
#   docker compose up -d
#
# The server starts on:
#   - Web UI + HTTP API: http://localhost:8080
#   - gRPC API: localhost:50051

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparrow
      POSTGRES_USER: sparrow
      POSTGRES_PASSWORD: sparrow
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparrow -d sparrow"]
      interval: 5s
      timeout: 3s
      retries: 10

  sparrow:
    image: ghcr.io/sarathsp06/sparrow:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DATABASE_URL: postgres://sparrow:sparrow@postgres:5432/sparrow?sslmode=disable
      SPARROW_SERVE_UI: "true"
      # Optional: require an API key for all requests
      # SPARROW_API_KEY: "change-me-to-a-secure-random-string"
      # Optional: explicit encryption key (auto-generated if omitted)
      # SPARROW_ENCRYPTION_KEY: "your-64-char-hex-key-from-openssl-rand-hex-32"
      # Optional: custom ports (default gRPC=50051, HTTP=8080)
      # Note: macOS AirPlay Receiver uses port 50051. Change if you hit conflicts.
      # SPARROW_GRPC_PORT: "50051"
      # SPARROW_HTTP_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
