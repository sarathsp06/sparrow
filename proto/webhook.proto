syntax = "proto3";

package webhook;

import "google/protobuf/struct.proto";

option go_package = "github.com/sarathsp06/sparrow/proto";

// WebhookService handles webhook registration and event pushing
service WebhookService {
  // RegisterWebhook registers a URL for specific events in a namespace
  rpc RegisterWebhook(RegisterWebhookRequest) returns (RegisterWebhookResponse);

  // UnregisterWebhook removes a webhook registration
  rpc UnregisterWebhook(UnregisterWebhookRequest) returns (UnregisterWebhookResponse);

  // PushEvent pushes an event that triggers registered webhooks
  rpc PushEvent(PushEventRequest) returns (PushEventResponse);

  // GetWebhookStatus gets the status of webhook deliveries
  rpc GetWebhookStatus(GetWebhookStatusRequest) returns (GetWebhookStatusResponse);

  // ListWebhooks lists all registered webhooks for a namespace
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);

  // RegisterEvent registers a new event type (no namespace required)
  rpc RegisterEvent(RegisterEventRequest) returns (RegisterEventResponse);

  // ListEvents lists all registered event types
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // UpdateEvent updates an event registration
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);

  // DeleteEvent deletes an event registration
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);

  // Health Management
  // GetWebhookHealth gets health metrics for a specific webhook
  rpc GetWebhookHealth(GetWebhookHealthRequest) returns (GetWebhookHealthResponse);

  // ListWebhooksByHealth lists webhooks filtered by health status
  rpc ListWebhooksByHealth(ListWebhooksByHealthRequest) returns (ListWebhooksByHealthResponse);

  // GetHealthSummary gets a summary of webhook health across all namespaces
  rpc GetHealthSummary(GetHealthSummaryRequest) returns (GetHealthSummaryResponse);

  // ResubmitWebhook manually retries failed or pending webhook deliveries
  rpc ResubmitWebhook(ResubmitWebhookRequest) returns (ResubmitWebhookResponse);

  // Additional webhook management methods
  // GetRegisteredWebhooks retrieves registered webhooks by ID or namespace
  rpc GetRegisteredWebhooks(GetRegisteredWebhooksRequest) returns (GetRegisteredWebhooksResponse);

  // ListRegisteredWebhooksByEvent retrieves webhooks registered for specific events
  rpc ListRegisteredWebhooksByEvent(ListRegisteredWebhooksByEventRequest) returns (ListRegisteredWebhooksByEventResponse);

  // GetWebhookDeliveryStatus retrieves delivery status for specific delivery
  rpc GetWebhookDeliveryStatus(GetWebhookDeliveryStatusRequest) returns (GetWebhookDeliveryStatusResponse);

  // ResendWebhook resends a failed webhook delivery
  rpc ResendWebhook(ResendWebhookRequest) returns (ResendWebhookResponse);

  // GetWebhookDeliveryHistory retrieves delivery history for a webhook
  rpc GetWebhookDeliveryHistory(GetWebhookDeliveryHistoryRequest) returns (GetWebhookDeliveryHistoryResponse);

  // GetNamespaceStats retrieves statistics for a namespace
  rpc GetNamespaceStats(GetNamespaceStatsRequest) returns (GetNamespaceStatsResponse);

  // UpdateWebhookConfig updates webhook configuration
  rpc UpdateWebhookConfig(UpdateWebhookConfigRequest) returns (UpdateWebhookConfigResponse);

  // PauseWebhook temporarily disables a webhook
  rpc PauseWebhook(PauseWebhookRequest) returns (PauseWebhookResponse);

  // ResumeWebhook re-enables a paused webhook
  rpc ResumeWebhook(ResumeWebhookRequest) returns (ResumeWebhookResponse);

  // ListEventReports lists all events in descending order for a given namespace
  rpc ListEventReports(ListEventReportsRequest) returns (ListEventReportsResponse);

  
}

// RegisterWebhookRequest represents a request to register a webhook URL
message RegisterWebhookRequest {
  string namespace = 1; // Namespace for grouping webhooks
  repeated string events = 2; // Event names to listen for (multiple events supported)
  string url = 3; // Target URL for the webhook
  map<string, string> headers = 4; // HTTP headers to include in requests
  int32 timeout = 5; // Timeout in seconds (default: 30)
  bool active = 6; // Whether webhook is active (default: true)
  string description = 7; // Optional description
}

// RegisterWebhookResponse represents the response for webhook registration
message RegisterWebhookResponse {
  string webhook_id = 1; // Unique webhook identifier
  bool success = 2; // Whether registration was successful
  string message = 3; // Success or error message
  int64 created_at = 4; // When the webhook was registered
}

// UnregisterWebhookRequest represents a request to remove a webhook
message UnregisterWebhookRequest {
  string webhook_id = 1; // Webhook ID to remove
}

// UnregisterWebhookResponse represents the response for webhook removal
message UnregisterWebhookResponse {
  bool success = 1; // Whether removal was successful
  string message = 2; // Success or error message
}

// PushEventRequest represents a request to push an event
message PushEventRequest {
  string namespace = 1; // Namespace for the event
  string event = 2; // Event name
  google.protobuf.Struct payload = 3; // Event payload as JSON struct
  int64 ttl_seconds = 4; // TTL for webhook retry attempts
  map<string, string> metadata = 5; // Additional event metadata
  optional string id = 6; // Optional id for idempotency 
}

// PushEventResponse represents the response for event pushing
message PushEventResponse {
  string event_id = 1; // Unique event identifier
  bool success = 2; // Whether event was processed
  string message = 3; // Success or error message
}

// GetWebhookStatusRequest represents a request to get webhook status
message GetWebhookStatusRequest {
  string webhook_id = 1; // Get status for specific webhook
  string namespace = 2; // Optional namespace filter
}

// WebhookDeliveryStatus represents the status of webhook delivery
enum WebhookDeliveryStatus {
  DELIVERY_UNSPECIFIED = 0;
  DELIVERY_PENDING = 1;
  DELIVERY_SENDING = 2;
  DELIVERY_SUCCESS = 3;
  DELIVERY_FAILED = 4;
  DELIVERY_RETRYING = 5;
  DELIVERY_EXPIRED = 6;
}

// WebhookDelivery represents a single webhook delivery attempt
message WebhookDelivery {
  string delivery_id = 1; // Unique delivery identifier
  string webhook_id = 2; // Associated webhook ID
  string event_id = 3; // Associated event ID
  WebhookDeliveryStatus status = 4; // Current delivery status
  int32 attempt_count = 5; // Number of delivery attempts
  int32 max_attempts = 6; // Maximum retry attempts
  int64 created_at = 7; // When delivery was created
  int64 last_attempted_at = 8; // Last attempt timestamp
  int64 next_retry_at = 9; // Next retry timestamp
  int64 expires_at = 10; // When delivery expires (TTL)
  int32 response_code = 11; // HTTP response code from last attempt
  string response_body = 12; // HTTP response body (truncated)
  string error_message = 13; // Error message if failed
}

// GetWebhookStatusResponse represents the response for webhook status
message GetWebhookStatusResponse {
  repeated WebhookDelivery deliveries = 1;
  int32 total_deliveries = 2;
  bool success = 3;
  string message = 4;
}

// ListWebhooksRequest represents a request to list webhooks
message ListWebhooksRequest {
  string namespace = 1; // Namespace to filter by
  string event = 2; // Event to filter by (optional)
  bool active_only = 3; // Only return active webhooks
}

// RegisteredWebhook represents a registered webhook
message RegisteredWebhook {
  string webhook_id = 1; // Unique webhook identifier
  string namespace = 2; // Webhook namespace
  repeated string events = 3; // Events the webhook listens for
  string url = 4; // Target URL
  map<string, string> headers = 5; // HTTP headers
  int32 timeout = 6; // Timeout in seconds
  bool active = 7; // Whether webhook is active
  string description = 8; // Webhook description
  WebhookHealth health = 9; // Webhook health status
  int64 created_at = 10; // When webhook was registered
  int64 updated_at = 11; // When webhook was last updated
}

// ListWebhooksResponse represents the response for listing webhooks
message ListWebhooksResponse {
  repeated RegisteredWebhook webhooks = 1;
  int32 total_count = 2;
  bool success = 3;
  string message = 4;
}

// RegisterEventRequest represents a request to register an event type
message RegisterEventRequest {
  string name = 1; // Event name (required)
  string description = 2; // Event description
  string schema = 3; // JSON schema for event payload validation
  map<string, string> metadata = 4; // Additional metadata
  bool active = 5; // Whether event is active (default: true)
}

// RegisterEventResponse represents the response for event registration
message RegisterEventResponse {
  string event_id = 1; // Unique event identifier
  bool success = 2; // Whether registration was successful
  string message = 3; // Success or error message
  int64 created_at = 4; // When the event was registered
}

// ListEventsRequest represents a request to list events
message ListEventsRequest {
  bool active_only = 1; // Only return active events
}

// RegisteredEvent represents a registered event type
message RegisteredEvent {
  string event_id = 1; // Unique event identifier
  string name = 2; // Event name
  string description = 3; // Event description
  string schema = 4; // JSON schema for validation
  map<string, string> metadata = 5; // Additional metadata
  bool active = 6; // Whether event is active
  int64 created_at = 7; // When event was registered
  int64 updated_at = 8; // When event was last updated
}

// ListEventsResponse represents the response for listing events
message ListEventsResponse {
  repeated RegisteredEvent events = 1;
  int32 total_count = 2;
  bool success = 3;
  string message = 4;
}

// UpdateEventRequest represents a request to update an event
message UpdateEventRequest {
  string name = 1; // Event name (required)
  string description = 2; // Event description
  string schema = 3; // JSON schema for event payload validation
  map<string, string> metadata = 4; // Additional metadata
  bool active = 5; // Whether event is active
}

// UpdateEventResponse represents the response for event update
message UpdateEventResponse {
  bool success = 1; // Whether update was successful
  string message = 2; // Success or error message
}

// DeleteEventRequest represents a request to delete an event
message DeleteEventRequest {
  string name = 1; // Event name to delete
}

// DeleteEventResponse represents the response for event deletion
message DeleteEventResponse {
  bool success = 1; // Whether deletion was successful
  string message = 2; // Success or error message
}

// Health Management Messages

// WebhookHealth represents webhook health status
enum WebhookHealth {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_HEALTHY = 1;
  HEALTH_DEGRADED = 2;
  HEALTH_UNHEALTHY = 3;
}

// GetWebhookHealthRequest represents a request to get webhook health
message GetWebhookHealthRequest {
  string webhook_id = 1; // Webhook ID
  string namespace = 2; // Namespace
}

// WebhookHealthMetrics represents detailed health metrics
message WebhookHealthMetrics {
  string webhook_id = 1;
  int32 total_deliveries = 2;
  int32 successful_deliveries = 3;
  int32 failed_deliveries = 4;
  int32 consecutive_failures = 5;
  int64 last_success_at = 6; // Unix timestamp
  int64 last_failure_at = 7; // Unix timestamp
  double success_rate = 8; // 0.0 to 1.0
  int32 avg_response_time = 9; // milliseconds
  int64 created_at = 10; // Unix timestamp
  int64 updated_at = 11; // Unix timestamp
}

// GetWebhookHealthResponse represents the response for getting webhook health
message GetWebhookHealthResponse {
  bool success = 1;
  string message = 2;
  string webhook_id = 3;
  WebhookHealth health = 4;
  WebhookHealthMetrics metrics = 5;
}

// ListWebhooksByHealthRequest represents a request to list webhooks by health
message ListWebhooksByHealthRequest {
  WebhookHealth health = 1; // Health status to filter by
}

// ListWebhooksByHealthResponse represents the response for listing webhooks by health
message ListWebhooksByHealthResponse {
  bool success = 1;
  string message = 2;
  repeated RegisteredWebhook webhooks = 3;
  int32 total_count = 4;
}

// GetHealthSummaryRequest represents a request to get health summary
message GetHealthSummaryRequest {
  // No parameters needed
}

// HealthSummary represents summary of webhook health
message HealthSummary {
  int32 healthy_count = 1;
  int32 degraded_count = 2;
  int32 unhealthy_count = 3;
  int32 unknown_count = 4;
  int32 total_count = 5;
}

// GetHealthSummaryResponse represents the response for getting health summary
message GetHealthSummaryResponse {
  bool success = 1;
  string message = 2;
  HealthSummary summary = 3;
}

// ResubmitWebhookRequest represents a request to manually retry webhook deliveries
message ResubmitWebhookRequest {
  string delivery_id = 1; // Resubmit specific delivery
  string namespace = 2; // Namespace for authorization
  bool force = 3; // Force retry even for non-failed deliveries (default: false)
}

// ResubmitWebhookResponse represents the response for webhook resubmission
message ResubmitWebhookResponse {
  bool success = 1; // Whether resubmission was successful
  string message = 2; // Success or error message
  int32 resubmitted_count = 3; // Number of deliveries resubmitted
  repeated string delivery_ids = 4; // IDs of deliveries that were resubmitted
}

// Additional message definitions for extended webhook management

// GetRegisteredWebhooksRequest represents a request to get registered webhooks
message GetRegisteredWebhooksRequest {
  string webhook_id = 1; // Optional webhook ID filter
  string namespace = 2; // Namespace (required for security)
  bool active_only = 3; // Only return active webhooks
}

// GetRegisteredWebhooksResponse represents the response for getting registered webhooks
message GetRegisteredWebhooksResponse {
  repeated RegisteredWebhook webhooks = 1;
  int32 total_count = 2;
  bool success = 3;
  string message = 4;
}

// ListRegisteredWebhooksByEventRequest represents a request to list webhooks by event
message ListRegisteredWebhooksByEventRequest {
  string namespace = 1; // Namespace (required)
  string event = 2; // Event name (required)
  bool active_only = 3; // Only return active webhooks
}

// ListRegisteredWebhooksByEventResponse represents the response for listing webhooks by event
message ListRegisteredWebhooksByEventResponse {
  repeated RegisteredWebhook webhooks = 1;
  string event = 2; // Event name
  string namespace = 3; // Namespace
  int32 total_count = 4;
  bool success = 5;
  string message = 6;
}

// GetWebhookDeliveryStatusRequest represents a request to get delivery status
message GetWebhookDeliveryStatusRequest {
  string delivery_id = 1; // Delivery ID (required)
  string namespace = 2; // Namespace (required for security)
}

// GetWebhookDeliveryStatusResponse represents the response for getting delivery status
message GetWebhookDeliveryStatusResponse {
  WebhookDelivery delivery = 1;
  bool success = 2;
  string message = 3;
}

// ResendWebhookRequest represents a request to resend a webhook
message ResendWebhookRequest {
  string delivery_id = 1; // Delivery ID to resend (required)
  string namespace = 2; // Namespace (required for security)
  bool force_resend = 3; // Force resend even if already successful
}

// ResendWebhookResponse represents the response for resending a webhook
message ResendWebhookResponse {
  string new_delivery_id = 1; // New delivery ID created for resend
  bool success = 2;
  string message = 3;
}

// GetWebhookDeliveryHistoryRequest represents a request to get delivery history
message GetWebhookDeliveryHistoryRequest {
  string webhook_id = 1; // Webhook ID (required)
  string namespace = 2; // Namespace (required for security)
  int32 limit = 3; // Maximum number of deliveries to return (default: 50)
  int32 offset = 4; // Offset for pagination (default: 0)
}

// GetWebhookDeliveryHistoryResponse represents the response for getting delivery history
message GetWebhookDeliveryHistoryResponse {
  repeated WebhookDelivery deliveries = 1;
  int32 total_count = 2;
  bool success = 3;
  string message = 4;
}

// GetNamespaceStatsRequest represents a request to get namespace statistics
message GetNamespaceStatsRequest {
  string namespace = 1; // Namespace (required)
}

// NamespaceStats represents statistics for a namespace
message NamespaceStats {
  int32 total_webhooks = 1;
  int32 active_webhooks = 2;
  int32 total_deliveries = 3;
  int32 successful_deliveries = 4;
  int32 failed_deliveries = 5;
  int32 pending_deliveries = 6;
  double success_rate = 7; // 0.0 to 1.0
}

// GetNamespaceStatsResponse represents the response for getting namespace statistics
message GetNamespaceStatsResponse {
  string namespace = 1;
  NamespaceStats stats = 2;
  bool success = 3;
  string message = 4;
}

// WebhookUpdateFields represents fields that can be updated for a webhook
message WebhookUpdateFields {
  repeated string events = 1; // Updated events list
  string url = 2; // Updated URL
  map<string, string> headers = 3; // Updated headers
  int32 timeout = 4; // Updated timeout
  bool active = 5; // Updated active status
  string description = 6; // Updated description
}

// UpdateWebhookConfigRequest represents a request to update webhook configuration
message UpdateWebhookConfigRequest {
  string webhook_id = 1; // Webhook ID (required)
  string namespace = 2; // Namespace (required for security)
  WebhookUpdateFields updates = 3; // Fields to update
}

// UpdateWebhookConfigResponse represents the response for updating webhook configuration
message UpdateWebhookConfigResponse {
  bool success = 1;
  string message = 2;
}

// PauseWebhookRequest represents a request to pause a webhook
message PauseWebhookRequest {
  string webhook_id = 1; // Webhook ID (required)
  string namespace = 2; // Namespace (required for security)
  string reason = 3; // Optional reason for pausing
}

// PauseWebhookResponse represents the response for pausing a webhook
message PauseWebhookResponse {
  bool success = 1;
  string message = 2;
}

// ResumeWebhookRequest represents a request to resume a webhook
message ResumeWebhookRequest {
  string webhook_id = 1; // Webhook ID (required)
  string namespace = 2; // Namespace (required for security)
  string reason = 3; // Optional reason for resuming
}

// ResumeWebhookResponse represents the response for resuming a webhook
message ResumeWebhookResponse {
  bool success = 1;
  string message = 2;
}

// EventReport represents detailed information about an event instance
message EventReport {
  string event_id = 1; // Unique event identifier
  string namespace = 2; // Event namespace
  string event_name = 3; // Event type name
  google.protobuf.Struct payload = 4; // Event payload
  map<string, string> metadata = 5; // Event metadata
  int64 created_at = 6; // When the event was created (Unix timestamp)
  int64 ttl_seconds = 7; // TTL for webhook retry attempts
  int32 webhook_count = 8; // Number of webhooks triggered by this event
  int32 successful_deliveries = 9; // Number of successful deliveries
  int32 failed_deliveries = 10; // Number of failed deliveries
  int32 pending_deliveries = 11; // Number of pending deliveries
}

// ListEventReportsRequest represents a request to list event reports
message ListEventReportsRequest {
  string namespace = 1; // Namespace to filter by (required)
  optional string event_name = 2; // Optional event name filter
  int32 limit = 3; // Maximum number of events to return (default: 50, max: 1000)
  int32 offset = 4; // Offset for pagination (default: 0)
}

// ListEventReportsResponse represents the response for listing event reports
message ListEventReportsResponse {
  repeated EventReport events = 1; // List of events in descending order by created_at
  int32 total_count = 2; // Total count of events matching the filter
  bool success = 3; // Whether the request was successful
  string message = 4; // Success or error message
}
