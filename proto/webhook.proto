syntax = "proto3";

package webhook;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sarathsp06/sparrow/proto";

// WebhookService handles webhook lifecycle management
service WebhookService {
  // RegisterWebhook registers a URL for specific events in a namespace
  rpc RegisterWebhook(RegisterWebhookRequest) returns (RegisterWebhookResponse);

  // UnregisterWebhook removes a webhook registration
  rpc UnregisterWebhook(UnregisterWebhookRequest) returns (UnregisterWebhookResponse);

  // ListWebhooks lists all registered webhooks for a namespace with filters
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);

  // UpdateWebhookConfig updates webhook configuration
  rpc UpdateWebhookConfig(UpdateWebhookConfigRequest) returns (UpdateWebhookConfigResponse);

  // PauseWebhook temporarily disables a webhook
  rpc PauseWebhook(PauseWebhookRequest) returns (PauseWebhookResponse);

  // ResumeWebhook re-enables a paused webhook
  rpc ResumeWebhook(ResumeWebhookRequest) returns (ResumeWebhookResponse);

  // GetNamespaceStats retrieves statistics for a namespace
  rpc GetNamespaceStats(GetNamespaceStatsRequest) returns (GetNamespaceStatsResponse);

  // GetTemplateFunctions returns all available template functions with their descriptions
  rpc GetTemplateFunctions(GetTemplateFunctionsRequest) returns (GetTemplateFunctionsResponse);
}

// EventService handles event definitions and reports
service EventService {
  // RegisterEvent registers a new event type
  rpc RegisterEvent(RegisterEventRequest) returns (RegisterEventResponse);

  // ListEvents lists all registered event types
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // UpdateEvent updates an event registration
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);

  // DeleteEvent deletes an event registration
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);

  // GetEvent retrieves an event type by name
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);

  // PushEvent pushes an event that triggers registered webhooks
  rpc PushEvent(PushEventRequest) returns (PushEventResponse);

  // ListEventReports lists all events in descending order for a given namespace
  rpc ListEventReports(ListEventReportsRequest) returns (ListEventReportsResponse);
}

// SubscriptionService manages mapping of webhooks to events
service SubscriptionService {
  // CreateSubscription creates a new event subscription for a webhook
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);

  // GetSubscription retrieves a specific subscription by ID
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);

  // ListSubscriptions lists all subscriptions for a webhook or event
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);

  // UpdateSubscription updates an existing subscription
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);

  // DeleteSubscription deletes a subscription
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);

  // TestSubscriptionTemplate dry-runs a transformation template with sample data
  rpc TestSubscriptionTemplate(TestSubscriptionTemplateRequest) returns (TestSubscriptionTemplateResponse);
}

// DeliveryService tracks history and handles retries
service DeliveryService {
  // GetDeliveryStatus retrieves delivery status for specific delivery
  rpc GetDeliveryStatus(GetDeliveryStatusRequest) returns (GetDeliveryStatusResponse);

  // ListDeliveries retrieves delivery history with filters
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);

  // RetryDelivery manually retries failed or pending webhook deliveries
  rpc RetryDelivery(RetryDeliveryRequest) returns (RetryDeliveryResponse);

  // GetDeliveryAttempts retrieves individual attempt history for a delivery
  rpc GetDeliveryAttempts(GetDeliveryAttemptsRequest) returns (GetDeliveryAttemptsResponse);
}

// HealthService manages health metrics and summaries
service HealthService {
  // GetWebhookHealth gets health metrics for a specific webhook
  rpc GetWebhookHealth(GetWebhookHealthRequest) returns (GetWebhookHealthResponse);

  // ListWebhooksByHealth lists webhooks filtered by health status
  rpc ListWebhooksByHealth(ListWebhooksByHealthRequest) returns (ListWebhooksByHealthResponse);

  // GetHealthSummary gets a summary of webhook health across all namespaces
  rpc GetHealthSummary(GetHealthSummaryRequest) returns (GetHealthSummaryResponse);
}

// WebhookHTTPConfig represents HTTP configuration for webhook delivery
message WebhookHTTPConfig {
  int32 max_retries = 1; // Maximum retry attempts (0-10, default: 3)
  int32 retry_backoff_seconds = 2; // Base backoff time between retries (1-3600s, default: 60)
  bool capture_response_body = 3; // Whether to capture and store response body (default: false)
  bool follow_redirects = 4; // Whether to follow HTTP redirects (default: true)
  bool verify_ssl = 5; // Whether to verify SSL certificates (default: true)
  int32 request_timeout_seconds = 6; // Per-request timeout (1-300s, default: 30)
  repeated int32 expected_status_codes = 7; // HTTP status codes considered successful (default: [200,201,202,204])
  string webhook_secret = 8; // Secret for webhook signature verification
  string user_agent = 9; // Custom User-Agent header (default: "Sparrow-Webhook/1.0")
  string content_type = 10; // Content-Type for requests (default: "application/json")
}

// RegisterWebhookRequest represents a request to register a webhook URL
message RegisterWebhookRequest {
  string namespace = 1; // Namespace for grouping webhooks
  repeated string events = 2; // Event names to listen for (multiple events supported)
  string url = 3; // Target URL for the webhook
  map<string, string> headers = 4; // HTTP headers to include in requests
  int32 timeout = 5; // Timeout in seconds (default: 30) - DEPRECATED, use http_config.request_timeout_seconds
  bool active = 6; // Whether webhook is active (default: true)
  string description = 7; // Optional description
  WebhookHTTPConfig http_config = 8; // HTTP configuration options (optional, defaults will be used if not provided)
}

// RegisterWebhookResponse represents the response for webhook registration
message RegisterWebhookResponse {
  string webhook_id = 1; // Unique webhook identifier
  bool success = 2 [deprecated = true]; // Use gRPC status codes instead
  string message = 3 [deprecated = true]; // Use gRPC status codes instead
  google.protobuf.Timestamp created_at = 4; // When the webhook was registered
}

// UnregisterWebhookRequest represents a request to remove a webhook
message UnregisterWebhookRequest {
  string webhook_id = 1; // Webhook ID to remove
  string namespace = 2; // Namespace (required)
}

// UnregisterWebhookResponse represents the response for webhook removal
message UnregisterWebhookResponse {
  bool success = 1 [deprecated = true]; // Use gRPC status codes instead
  string message = 2 [deprecated = true]; // Use gRPC status codes instead
}

// PushEventRequest represents a request to push an event
message PushEventRequest {
  string namespace = 1; // Namespace for the event
  string event = 2; // Event name
  google.protobuf.Struct payload = 3; // Event payload as JSON struct
  int64 ttl_seconds = 4; // TTL for webhook retry attempts
  map<string, string> metadata = 5; // Additional event metadata
  optional string id = 6; // Optional id for idempotency 
  map<string, string> labels = 7; // Optional labels for label-based subscription matching
}

// PushEventResponse represents the response for event pushing
message PushEventResponse {
  string event_id = 1; // Unique event identifier
  bool success = 2 [deprecated = true]; // Use gRPC status codes instead
  string message = 3 [deprecated = true]; // Use gRPC status codes instead
}

// WebhookDeliveryStatus represents the status of webhook delivery
enum WebhookDeliveryStatus {
  DELIVERY_UNSPECIFIED = 0;
  DELIVERY_PENDING = 1;
  DELIVERY_SENDING = 2;
  DELIVERY_SUCCESS = 3;
  DELIVERY_FAILED = 4;
  DELIVERY_RETRYING = 5;
  DELIVERY_EXPIRED = 6;
}

// WebhookDelivery represents a single webhook delivery attempt
message WebhookDelivery {
  string delivery_id = 1; // Unique delivery identifier
  string webhook_id = 2; // Associated webhook ID
  string event_id = 3; // Associated event ID
  WebhookDeliveryStatus status = 4; // Current delivery status
  int32 attempt_count = 5; // Number of delivery attempts
  int32 max_attempts = 6; // Maximum retry attempts
  google.protobuf.Timestamp created_at = 7; // When delivery was created
  google.protobuf.Timestamp last_attempted_at = 8; // Last attempt timestamp
  google.protobuf.Timestamp next_retry_at = 9; // Next retry timestamp
  google.protobuf.Timestamp expires_at = 10; // When delivery expires (TTL)
  int32 response_code = 11; // HTTP response code from last attempt
  string response_body = 12; // HTTP response body (truncated)
  string error_message = 13; // Error message if failed
  string request_body = 14; // Request body sent to webhook
  string error_category = 15; // Classified error category (e.g. client_error, server_error, timeout, network_error)
}

// ListWebhooksRequest represents a request to list webhooks
message ListWebhooksRequest {
  string namespace = 1; // Namespace to filter by (required)
  string event = 2; // Event to filter by (optional)
  bool active_only = 3; // Only return active webhooks
  PaginationRequest pagination = 4; // Optional pagination
  string webhook_id = 5; // Optional webhook ID filter
}

// RegisteredWebhook represents a registered webhook
message RegisteredWebhook {
  string webhook_id = 1; // Unique webhook identifier
  string namespace = 2; // Webhook namespace
  repeated string events = 3; // Events the webhook listens for
  string url = 4; // Target URL
  map<string, string> headers = 5; // HTTP headers
  int32 timeout = 6; // Timeout in seconds - DEPRECATED, see http_config.request_timeout_seconds
  bool active = 7; // Whether webhook is active
  string description = 8; // Webhook description
  WebhookHealth health = 9; // Webhook health status
  google.protobuf.Timestamp created_at = 10; // When webhook was registered
  google.protobuf.Timestamp updated_at = 11; // When webhook was last updated
  WebhookHTTPConfig http_config = 12; // HTTP configuration options
}

// ListWebhooksResponse represents the response for listing webhooks
message ListWebhooksResponse {
  repeated RegisteredWebhook webhooks = 1;
  PaginationResponse pagination = 2;
  bool success = 3 [deprecated = true];
  string message = 4 [deprecated = true];
  int32 total_count = 5 [deprecated = true]; // Use pagination.total_count instead
}

// RegisterEventRequest represents a request to register an event type
message RegisterEventRequest {
  string name = 1; // Event name (required)
  string description = 2; // Event description
  google.protobuf.Struct schema = 3; // JSON schema for event payload validation
  map<string, string> metadata = 4; // Additional metadata
  bool active = 5; // Whether event is active (default: true)
}

// RegisterEventResponse represents the response for event registration
message RegisterEventResponse {
  string event_id = 1 [deprecated = true]; // Deprecated: now returns the event name (same as the name in the request). Use name field instead.
  bool success = 2 [deprecated = true]; // Use gRPC status codes instead
  string message = 3 [deprecated = true]; // Use gRPC status codes instead
  google.protobuf.Timestamp created_at = 4; // When the event was registered
}

// ListEventsRequest represents a request to list events
message ListEventsRequest {
  bool active_only = 1; // Only return active events
  PaginationRequest pagination = 2;
}

// RegisteredEvent represents a registered event type
message RegisteredEvent {
  string event_id = 1 [deprecated = true]; // Deprecated: now returns the event name. Use the name field (field 2) instead.
  string name = 2; // Event name (unique per tenant — this is the primary identifier)
  string description = 3; // Event description
  google.protobuf.Struct schema = 4; // JSON schema for validation
  google.protobuf.Struct sample_payload = 9; // Auto-generated sample payload based on schema
  map<string, string> metadata = 5; // Additional metadata
  bool active = 6; // Whether event is active
  google.protobuf.Timestamp created_at = 7; // When event was registered
  google.protobuf.Timestamp updated_at = 8; // When event was last updated
}

// ListEventsResponse represents the response for listing events
message ListEventsResponse {
  repeated RegisteredEvent events = 1;
  PaginationResponse pagination = 2;
  bool success = 3 [deprecated = true];
  string message = 4 [deprecated = true];
  int32 total_count = 5 [deprecated = true];
}

// UpdateEventRequest represents a request to update an event
message UpdateEventRequest {
  string name = 1; // Event name (required)
  string description = 2; // Event description
  google.protobuf.Struct schema = 3; // JSON schema for event payload validation
  map<string, string> metadata = 4; // Additional metadata
  bool active = 5; // Whether event is active
}

// UpdateEventResponse represents the response for event update
message UpdateEventResponse {
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
}

// GetEventRequest represents a request to get an event by name
message GetEventRequest {
  string name = 1; // Event name (required)
}

// GetEventResponse represents the response for getting an event
message GetEventResponse {
  RegisteredEvent event = 1;
}

// DeleteEventRequest represents a request to delete an event
message DeleteEventRequest {
  string name = 1; // Event name to delete
}

// DeleteEventResponse represents the response for event deletion
message DeleteEventResponse {
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
}

// TestSubscriptionTemplateRequest represents a request to test a transformation template
message TestSubscriptionTemplateRequest {
  string event_name = 1; // Event name to get sample data from
  string transform_template = 2; // Template to test
  string namespace = 3; // Namespace
}

// TestSubscriptionTemplateResponse represents the result of a template test
message TestSubscriptionTemplateResponse {
  string transformed_payload = 1; // Resulting transformed payload
}

// Health Management Messages

// WebhookHealth represents webhook health status
enum WebhookHealth {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_HEALTHY = 1;
  HEALTH_DEGRADED = 2;
  HEALTH_UNHEALTHY = 3;
}

// GetWebhookHealthRequest represents a request to get webhook health
message GetWebhookHealthRequest {
  string webhook_id = 1; // Webhook ID
  string namespace = 2; // Namespace
}

// WebhookHealthMetrics represents detailed health metrics
message WebhookHealthMetrics {
  string webhook_id = 1;
  int32 total_deliveries = 2;
  int32 successful_deliveries = 3;
  int32 failed_deliveries = 4;
  int32 consecutive_failures = 5;
  google.protobuf.Timestamp last_success_at = 6; // Last success timestamp
  google.protobuf.Timestamp last_failure_at = 7; // Last failure timestamp
  double success_rate = 8; // 0.0 to 1.0
  int32 avg_response_time = 9; // milliseconds
  google.protobuf.Timestamp created_at = 10; // Created timestamp
  google.protobuf.Timestamp updated_at = 11; // Updated timestamp

  // Error category breakdown (last 24 hours)
  int32 client_errors = 12; // 4xx responses (never retried)
  int32 server_errors = 13; // 5xx responses (retried)
  int32 timeout_errors = 14; // Timeouts (retried)
  int32 network_errors = 15; // DNS, TLS, connection refused, and other network errors
}

// GetWebhookHealthResponse represents the response for getting webhook health
message GetWebhookHealthResponse {
  string webhook_id = 3;
  WebhookHealth health = 4;
  WebhookHealthMetrics metrics = 5;
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
}

// ListWebhooksByHealthRequest represents a request to list webhooks by health
message ListWebhooksByHealthRequest {
  WebhookHealth health = 1; // Health status to filter by
  PaginationRequest pagination = 2;
}

// ListWebhooksByHealthResponse represents the response for listing webhooks by health
message ListWebhooksByHealthResponse {
  repeated RegisteredWebhook webhooks = 3;
  PaginationResponse pagination = 5;
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
  int32 total_count = 4 [deprecated = true];
}

// GetHealthSummaryRequest represents a request to get health summary
message GetHealthSummaryRequest {
  // No parameters needed
}

// HealthSummary represents summary of webhook health
message HealthSummary {
  int32 healthy_count = 1;
  int32 degraded_count = 2;
  int32 unhealthy_count = 3;
  int32 unknown_count = 4;
  int32 total_count = 5;
}

// GetHealthSummaryResponse represents the response for getting health summary
message GetHealthSummaryResponse {
  HealthSummary summary = 3;
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
}

// RetryDeliveryRequest represents a request to manually retry webhook deliveries
message RetryDeliveryRequest {
  string namespace = 1; // Namespace (required)
  string delivery_id = 2; // Optional: Retry specific delivery
  string webhook_id = 3; // Optional: Retry all failed/pending for webhook
  bool force = 4; // Force retry even for successful deliveries (default: false)
}

// RetryDeliveryResponse represents the response for delivery retry
message RetryDeliveryResponse {
  int32 retried_count = 1; // Number of deliveries retried
  repeated string delivery_ids = 2; // IDs of deliveries that were retried
  bool success = 3 [deprecated = true];
  string message = 4 [deprecated = true];
}

// GetDeliveryStatusRequest represents a request to get delivery status
message GetDeliveryStatusRequest {
  string delivery_id = 1; // Delivery ID (required)
  string namespace = 2; // Namespace (required for security)
}

// GetDeliveryStatusResponse represents the response for getting delivery status
message GetDeliveryStatusResponse {
  WebhookDelivery delivery = 1;
  bool success = 2 [deprecated = true];
  string message = 3 [deprecated = true];
}

// ListDeliveriesRequest represents a request to list deliveries
message ListDeliveriesRequest {
  string namespace = 1; // Namespace (required)
  string webhook_id = 2; // Optional: filter by webhook
  string event_id = 3; // Optional: filter by event
  PaginationRequest pagination = 4;
}

// ListDeliveriesResponse represents the response for listing deliveries
message ListDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
  PaginationResponse pagination = 2;
  bool success = 3 [deprecated = true];
  string message = 4 [deprecated = true];
}

// GetNamespaceStatsRequest represents a request to get namespace statistics
message GetNamespaceStatsRequest {
  string namespace = 1; // Namespace (required)
}

// NamespaceStats represents statistics for a namespace
message NamespaceStats {
  int32 total_webhooks = 1;
  int32 active_webhooks = 2;
  int32 total_deliveries = 3;
  int32 successful_deliveries = 4;
  int32 failed_deliveries = 5;
  int32 pending_deliveries = 6;
  double success_rate = 7; // 0.0 to 1.0
}

// GetNamespaceStatsResponse represents the response for getting namespace statistics
message GetNamespaceStatsResponse {
  string namespace = 1;
  NamespaceStats stats = 2;
  bool success = 3 [deprecated = true];
  string message = 4 [deprecated = true];
}

// WebhookUpdateFields represents fields that can be updated for a webhook
message WebhookUpdateFields {
  repeated string events = 1; // Updated events list
  string url = 2; // Updated URL
  map<string, string> headers = 3; // Updated headers
  int32 timeout = 4; // Updated timeout - DEPRECATED, use http_config.request_timeout_seconds
  bool active = 5; // Updated active status
  string description = 6; // Updated description
  WebhookHTTPConfig http_config = 7; // Updated HTTP configuration options
}

// UpdateWebhookConfigRequest represents a request to update webhook configuration
message UpdateWebhookConfigRequest {
  string webhook_id = 1; // Webhook ID (required)
  string namespace = 2; // Namespace (required for security)
  WebhookUpdateFields updates = 3; // Fields to update
}

// UpdateWebhookConfigResponse represents the response for updating webhook configuration
message UpdateWebhookConfigResponse {
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
}

// PauseWebhookRequest represents a request to pause a webhook
message PauseWebhookRequest {
  string webhook_id = 1; // Webhook ID (required)
  string namespace = 2; // Namespace (required for security)
  string reason = 3; // Optional reason for pausing
}

// PauseWebhookResponse represents the response for pausing a webhook
message PauseWebhookResponse {
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
}

// ResumeWebhookRequest represents a request to resume a webhook
message ResumeWebhookRequest {
  string webhook_id = 1; // Webhook ID (required)
  string namespace = 2; // Namespace (required for security)
  string reason = 3; // Optional reason for resuming
}

// ResumeWebhookResponse represents the response for resuming a webhook
message ResumeWebhookResponse {
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
}

// EventReport represents detailed information about an event instance
message EventReport {
  string event_id = 1; // Unique event identifier
  string namespace = 2; // Event namespace
  string event_name = 3; // Event type name
  google.protobuf.Struct payload = 4; // Event payload
  map<string, string> metadata = 5; // Event metadata
  google.protobuf.Timestamp created_at = 6; // When the event was created
  int64 ttl_seconds = 7; // TTL for webhook retry attempts
  int32 webhook_count = 8; // Number of webhooks triggered by this event
  int32 successful_deliveries = 9; // Number of successful deliveries
  int32 failed_deliveries = 10; // Number of failed deliveries
  int32 pending_deliveries = 11; // Number of pending deliveries
}

// ListEventReportsRequest represents a request to list event reports
message ListEventReportsRequest {
  string namespace = 1; // Namespace to filter by (required)
  optional string event_name = 2; // Optional event name filter
  PaginationRequest pagination = 3;
  int32 limit = 4 [deprecated = true];
  int32 offset = 5 [deprecated = true];
}

// ListEventReportsResponse represents the response for listing event reports
message ListEventReportsResponse {
  repeated EventReport events = 1; // List of events in descending order by created_at
  PaginationResponse pagination = 5;
  int32 total_count = 2 [deprecated = true]; // Total count of events matching the filter
  bool success = 3 [deprecated = true]; // Whether the request was successful
  string message = 4 [deprecated = true]; // Success or error message
}

// Event Subscription Messages

// EventSubscription represents a subscription linking a webhook to an event
message EventSubscription {
  string subscription_id = 1; // Unique subscription identifier
  string webhook_id = 2; // Associated webhook ID
  string event_name = 3; // Event name to subscribe to
  string namespace = 4; // Namespace
  map<string, string> headers = 5; // Optional per-subscription headers (override webhook headers)
  string method = 6; // Optional HTTP method override (default: POST)
  int32 timeout = 7; // Optional timeout override in seconds
  bool transform_enabled = 8; // Whether payload transformation is enabled
  string transform_template = 9; // Go template for payload transformation
  google.protobuf.Timestamp created_at = 10; // When subscription was created
  google.protobuf.Timestamp updated_at = 11; // When subscription was last updated
  map<string, string> label_filters = 12; // Label filters for matching events (AND logic)
}

// CreateSubscriptionRequest represents a request to create a subscription
message CreateSubscriptionRequest {
  string webhook_id = 1; // Webhook ID (required)
  string event_name = 2; // Event name (required)
  string namespace = 3; // Namespace (required)
  map<string, string> headers = 4; // Optional per-subscription headers
  string method = 5; // Optional HTTP method (default: POST)
  int32 timeout = 6; // Optional timeout in seconds
  bool transform_enabled = 7; // Enable payload transformation
  string transform_template = 8; // Go template for transformation
  map<string, string> label_filters = 9; // Optional label filters for matching events (AND logic)
}

// CreateSubscriptionResponse represents the response for subscription creation
message CreateSubscriptionResponse {
  string subscription_id = 1; // Created subscription ID
  google.protobuf.Timestamp created_at = 4; // When subscription was created
  bool success = 2 [deprecated = true];
  string message = 3 [deprecated = true];
}

// GetSubscriptionRequest represents a request to get a subscription
message GetSubscriptionRequest {
  string subscription_id = 1; // Subscription ID (required)
  string namespace = 2; // Namespace (required)
}

// GetSubscriptionResponse represents the response for getting a subscription
message GetSubscriptionResponse {
  EventSubscription subscription = 1; // Subscription details
  bool success = 2 [deprecated = true];
  string message = 3 [deprecated = true];
}

// ListSubscriptionsRequest represents a request to list subscriptions
message ListSubscriptionsRequest {
  string webhook_id = 1; // Webhook ID to filter by (optional)
  string event_name = 4; // Event name to filter by (optional)
  string namespace = 2; // Namespace (required)
  PaginationRequest pagination = 3;
}

// ListSubscriptionsResponse represents the response for listing subscriptions
message ListSubscriptionsResponse {
  repeated EventSubscription subscriptions = 1; // List of subscriptions
  PaginationResponse pagination = 5;
  int32 total_count = 2 [deprecated = true];
  bool success = 3 [deprecated = true];
  string message = 4 [deprecated = true];
}

// UpdateSubscriptionRequest represents a request to update a subscription
message UpdateSubscriptionRequest {
  string subscription_id = 1; // Subscription ID (required)
  string namespace = 7; // Namespace (required)
  map<string, string> headers = 2; // Updated headers
  string method = 3; // Updated HTTP method
  int32 timeout = 4; // Updated timeout
  bool transform_enabled = 5; // Updated transform enabled flag
  string transform_template = 6; // Updated transform template
  map<string, string> label_filters = 8; // Updated label filters for matching events (AND logic)
}

// UpdateSubscriptionResponse represents the response for updating a subscription
message UpdateSubscriptionResponse {
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
}

// DeleteSubscriptionRequest represents a request to delete a subscription
message DeleteSubscriptionRequest {
  string subscription_id = 1; // Subscription ID (required)
  string namespace = 2; // Namespace (required)
}

// DeleteSubscriptionResponse represents the response for deleting a subscription
message DeleteSubscriptionResponse {
  bool success = 1 [deprecated = true];
  string message = 2 [deprecated = true];
}

// ListSubscriptionsByEventRequest represents a request to list subscriptions by event
message ListSubscriptionsByEventRequest {
  string namespace = 1; // Namespace (required)
  string event_name = 2; // Event name (required)
}

// ListSubscriptionsByEventResponse represents the response for listing subscriptions by event
message ListSubscriptionsByEventResponse {
  repeated EventSubscription subscriptions = 1; // List of subscriptions
  PaginationResponse pagination = 5;
  int32 total_count = 2 [deprecated = true];
  bool success = 3 [deprecated = true];
  string message = 4 [deprecated = true];
}

// TemplateFunction represents a template function with its name and description
message TemplateFunction {
  string name = 1; // Function name
  string description = 2; // Function description
}

// GetTemplateFunctionsRequest represents a request to get template functions
message GetTemplateFunctionsRequest {
  // No parameters needed for this request
}

// GetTemplateFunctionsResponse represents the response for getting template functions
message GetTemplateFunctionsResponse {
  repeated TemplateFunction functions = 1; // List of available template functions
  int32 total_count = 2; // Total count of functions
  bool success = 3 [deprecated = true];
  string message = 4 [deprecated = true];
}

// PaginationRequest represents a request for paginated results
message PaginationRequest {
  int32 limit = 1; // Maximum number of items to return (default: 50)
  int32 offset = 2; // Number of items to skip (default: 0)
}

// PaginationResponse represents metadata for paginated results
message PaginationResponse {
  int32 total_count = 1; // Total number of items available
  int32 limit = 2; // Limit used for the request
  int32 offset = 3; // Offset used for the request
}

// DeliveryAttempt represents a single attempt to deliver a webhook
message DeliveryAttempt {
  string attempt_id = 1; // Unique attempt identifier
  string delivery_id = 2; // Associated delivery ID
  string webhook_id = 3; // Associated webhook ID
  bool success = 4; // Whether this attempt succeeded
  int32 response_time = 5; // Response time in milliseconds
  int32 response_code = 6; // HTTP response code (0 if no response)
  string error_message = 7; // Error message (empty on success)
  string error_category = 8; // Error category (success, client_error, server_error, timeout, etc.)
  google.protobuf.Timestamp timestamp = 9; // When this attempt occurred
}

// GetDeliveryAttemptsRequest represents a request to get delivery attempt history
message GetDeliveryAttemptsRequest {
  string delivery_id = 1; // Delivery ID (required)
}

// GetDeliveryAttemptsResponse represents the response for getting delivery attempts
message GetDeliveryAttemptsResponse {
  repeated DeliveryAttempt attempts = 1; // List of delivery attempts ordered by timestamp
}

// ============================================================
// Namespace Management
// ============================================================

// NamespaceService manages namespace lifecycle within a tenant.
// Namespaces are sub-tenant scopes used to isolate webhooks, subscriptions,
// deliveries, and other resources.
service NamespaceService {
  // CreateNamespace creates a new namespace within the caller's tenant
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);

  // GetNamespace retrieves a namespace by ID
  rpc GetNamespace(GetNamespaceRequest) returns (GetNamespaceResponse);

  // ListNamespaces lists namespaces for the caller's tenant
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);

  // UpdateNamespace updates a namespace's name or description
  rpc UpdateNamespace(UpdateNamespaceRequest2) returns (UpdateNamespaceResponse2);

  // DeleteNamespace deletes a namespace
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse2);
}


// ---- Namespace Messages ----

// NamespaceResource represents a namespace entity
message NamespaceResource {
  string id = 1;                          // Namespace UUID
  string tenant_id = 2;                   // Owning tenant UUID
  string name = 3;                        // Namespace name (unique per tenant)
  string description = 4;                 // Human-readable description
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// CreateNamespaceRequest represents a request to create a namespace
message CreateNamespaceRequest {
  string name = 1;                        // Namespace name (required, lowercase alphanumeric with hyphens/underscores)
  string description = 2;                 // Optional description
}

// CreateNamespaceResponse represents the response for namespace creation
message CreateNamespaceResponse {
  NamespaceResource namespace = 1;
}

// GetNamespaceRequest represents a request to get a namespace
message GetNamespaceRequest {
  string id = 1;                          // Namespace UUID (one of id or name required)
  string name = 2;                        // Namespace name (alternative to id)
}

// GetNamespaceResponse represents the response for getting a namespace
message GetNamespaceResponse {
  NamespaceResource namespace = 1;
}

// ListNamespacesRequest represents a request to list namespaces
message ListNamespacesRequest {
  PaginationRequest pagination = 1;
}

// ListNamespacesResponse represents the response for listing namespaces
message ListNamespacesResponse {
  repeated NamespaceResource namespaces = 1;
  PaginationResponse pagination = 2;
}

// UpdateNamespaceRequest2 represents a request to update a namespace
// (suffixed with "2" to avoid conflict with existing UpdateNamespaceRequest in internal package)
message UpdateNamespaceRequest2 {
  string id = 1;                          // Namespace UUID (required)
  string name = 2;                        // Updated name (optional, empty = no change)
  string description = 3;                 // Updated description (optional, empty = no change)
}

// UpdateNamespaceResponse2 represents the response for updating a namespace
message UpdateNamespaceResponse2 {
  NamespaceResource namespace = 1;
}

// DeleteNamespaceRequest represents a request to delete a namespace
message DeleteNamespaceRequest {
  string id = 1;                          // Namespace UUID
}

// DeleteNamespaceResponse2 represents the response for namespace deletion
message DeleteNamespaceResponse2 {
  // Empty on success; errors use gRPC status codes
}


