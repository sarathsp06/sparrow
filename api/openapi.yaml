        - total_deliveries
        - successful_deliveries
        - failed_deliveries
        - consecutive_failures
        - success_rate
        - avg_response_time
        - client_errors
        - server_errors
        - timeout_errors
        - network_errors
        - unexpected_status_errors
      type: object
    WebhookOut:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WebhookOut.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether the webhook currently receives deliveries.
          type: boolean
        consumer:
          description: Tenant consumer this webhook belongs to.
          type: string
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        description:
          description: Human-readable note about this webhook.
          type: string
        events:
          description: Event type names this webhook is currently subscribed to, derived from its subscriptions.
          items:
            type: string
          type:
            - array
            - "null"
        headers:
          additionalProperties:
            type: string
          description: Static HTTP headers sent with every delivery.
          type: object
        health:
          description: Computed rolling health status.
          enum:
            - healthy
            - degraded
            - unhealthy
            - unknown
          type: string
        http_config:
          $ref: "#/components/schemas/WebhookHTTPConfigOut"
          description: Per-webhook HTTP delivery configuration.
        secret_headers:
          additionalProperties:
            type: string
          description: Encrypted secret header names, with values always masked. Update them via PATCH secret_headers; send an empty string to remove one.
          type: object
        signature_type:
          description: Signing scheme. "hmac" (default) signs every delivery with HMAC-SHA256 (v1,); "ed25519" adds an Ed25519 signature (v1a,) alongside the HMAC one.
          enum:
            - hmac
            - ed25519
          type: string
        signing_public_key:
          description: Hex-encoded Ed25519 public key for verifying the v1a, delivery signature. Safe to expose; there is no private-key equivalent to mask.
          type: string
        updated_at:
          description: Last-modified timestamp, RFC3339.
          type: string
        url:
          description: HTTP endpoint deliveries are POSTed to.
          type: string
        webhook_id:
          description: Webhook id (UUID).
          type: string
      required:
        - webhook_id
        - consumer
        - events
        - url
        - active
        - health
        - signature_type
        - http_config
        - created_at
        - updated_at
      type: object
    WhoAmIOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WhoAmIOutputBody.json
          format: uri
          readOnly: true
          type: string
        auth_enabled:
          description: "False when SPARROW_API_KEY is unset: every endpoint is open."
          type: boolean
        master_key:
          description: True when the request used SPARROW_API_KEY itself.
          type: boolean
        name:
          description: Name of the credential used for this request.
          type: string
        token_id:
          description: Id of the access token used, if any.
          type:
            - string
            - "null"
      required:
        - auth_enabled
        - name
        - master_key
        - token_id
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: "Required only when the server is started with SPARROW_API_KEY set; otherwise all endpoints are open. Note: if the embedded dashboard is enabled (SPARROW_SERVE_UI=true), it is served without authentication and exposes this key to any browser that can load it — treat the deployment as trusted-network-only, or disable the dashboard / put it behind an authenticating proxy for untrusted networks."
      in: header
      name: X-API-Key
      type: apiKey
info:
  contact:
    name: Sparrow
    url: https://github.com/sarathsp06/sparrow
  description: |-
    Sparrow is a self-hosted webhook delivery platform: register the events your system produces, register the webhooks that should receive them, then push event occurrences and Sparrow fans them out with retries and health tracking.

    ## Concepts

    - **Event type** (`Event Types`) — a named, versioned schema for something that happened in your system, e.g. `order.created`. Optional JSON Schema validation is *soft*: invalid payloads are stored with warnings, never rejected.
    - **Event** (`Events`) — one occurrence of an event type, pushed with a payload. Pushing an event asynchronously fans it out to every matching subscription.
    - **Webhook** (`Webhooks`) — a registered HTTP endpoint plus its delivery configuration (retries, timeouts, signing). Every delivery is signed with HMAC-SHA256 and Ed25519.
    - **Subscription** (`Subscriptions`) — links one webhook to one event type within a consumer, optionally with a Go-template payload transform and label filters. Registering a webhook auto-creates matching subscriptions.
    - **Delivery** (`Deliveries`) — one attempt (and its retry history) to send an event to a webhook. Failures are classified as retryable (5xx, timeout, network) or not (4xx, DNS, TLS).
    - **Health** (`Health`) — a rolling per-webhook status (healthy/degraded/unhealthy) computed from recent delivery outcomes.

    ## Consumers

    Webhooks, events, subscriptions, and deliveries are scoped to a `consumer` path segment (defaults to `default` if you don't need multi-tenancy). A handful of read endpoints are deliberately global (no consumer) for cross-tenant dashboards and id-only lookups where the resource id is already globally unique.

    ## Authentication

    Optional. When the server is started with `SPARROW_API_KEY` set, every `/v1/*` request must include it in the `X-API-Key` header. When unset, all endpoints are open.

    Alternatively, a consumer-scoped access token (`createToken` with a `consumer`) powers the embedded portal at `/portal`, whose API calls are served under the single `/portal/api/` prefix — the consumer is carried by the token, not the URL, so exposing the portal means allowlisting only `/portal`, `/_app`, and `/portal/api`. Portal tokens reach their own consumer's webhooks, subscriptions, and deliveries (never event injection, token minting, other consumers, or admin routes).
  license:
    identifier: MIT
    name: MIT
  title: Sparrow
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/consumers/{consumer}/alert-configs:
    get:
      description: Lists alert configs in a consumer, optionally filtered to one webhook's own configs.
      operationId: listAlertConfigs
      parameters:
        - description: Consumer to list alert configs in.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer to list alert configs in.
            type: string
        - description: Filter to alert configs scoped to one webhook. Omit to list every config in the consumer, including consumer-wide ones.
          explode: false
          in: query
          name: webhook_id
          schema:
            description: Filter to alert configs scoped to one webhook. Omit to list every config in the consumer, including consumer-wide ones.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAlertConfigsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List email alert recipients
      tags:
        - Alert Configs
    post:
      description: Opts an email address into Sparrow's self-generated health-change and permanent-delivery-failure notifications, scoped to one webhook or the whole consumer.
      operationId: createAlertConfig
      parameters:
        - in: path
          name: consumer
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertConfigBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertConfigItem"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Register an email alert recipient
      tags:
        - Alert Configs
  /v1/consumers/{consumer}/alert-configs/{alert_config_id}:
    delete:
      description: Removes an alert config. The webhook and its delivery history are unaffected.
      operationId: deleteAlertConfig
      parameters:
        - in: path
          name: consumer
          required: true
          schema:
            type: string
        - in: path
          name: alert_config_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Delete an email alert recipient
      tags:
        - Alert Configs
  /v1/consumers/{consumer}/deliveries:
    get:
      description: Lists deliveries in a consumer, optionally filtered by webhook, event occurrence, or status. Set prepare_retry to snapshot the filtered set for the batch retry endpoint.
      operationId: listDeliveries
      parameters:
        - description: Tenant consumer to list deliveries in.
          in: path
          name: consumer
          required: true
          schema:
            description: Tenant consumer to list deliveries in.
            type: string
        - description: Filter to deliveries for one webhook.
          explode: false
          in: query
          name: webhook_id
          schema:
            description: Filter to deliveries for one webhook.
            type: string
        - description: Filter to deliveries for one pushed event occurrence.
          explode: false
          in: query
          name: event_id
          schema:
            description: Filter to deliveries for one pushed event occurrence.
            type: string
        - description: Filter by delivery status (e.g. pending, success, failed, retrying, paused).
          explode: false
          in: query
          name: status
          schema:
            description: Filter by delivery status (e.g. pending, success, failed, retrying, paused).
