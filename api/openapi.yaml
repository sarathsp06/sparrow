components:
  schemas:
    AIDraftingStruct:
      additionalProperties: false
      properties:
        enabled:
          description: True when the server is started with SPARROW_AI_ENABLED=true, whether or not the provider settings are valid. Drafting (POST /v1/subscriptions:draftTemplate) is usable only when enabled is true and problem is absent.
          type: boolean
        model:
          description: Model id used for drafting; absent when drafting is off or not usable.
          type: string
        problem:
          description: "Why drafting is enabled but not usable: a missing or invalid provider setting. POST /v1/subscriptions:draftTemplate answers 503 with this text."
          type: string
        prompt_only:
          description: "Always the opposite of enabled: true when SPARROW_AI_ENABLED is not true, so clients offer only the copy-and-paste prompt. POST /v1/subscriptions:draftTemplatePrompt works whatever this says."
          type: boolean
        provider:
          description: "Chat API behind drafting: anthropic, or openai for any OpenAI-compatible server (Ollama, vLLM, OpenRouter, OpenAI). Absent when drafting is off or not usable."
          enum:
            - anthropic
            - openai
          type: string
      required:
        - enabled
        - prompt_only
      type: object
    AlertConfigItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AlertConfigItem.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: Consumer this alert config belongs to.
          type: string
        created_at:
          description: Creation timestamp, RFC3339.
          format: date-time
          type: string
        email:
          description: Recipient email address.
          type: string
        event_types:
          description: Sparrow system event types this recipient is alerted on.
          items:
            type: string
          type: array
        id:
          description: Alert config id (UUID).
          type: string
        webhook_id:
          description: Webhook this alert is scoped to; omitted for consumer-wide alerts.
          type: string
      required:
        - id
        - consumer
        - email
        - event_types
        - created_at
      type: object
    AlertDeliveryStruct:
      additionalProperties: false
      properties:
        configured:
          description: True when an active webhook under the _sparrow consumer has an unpaused subscription to Sparrow's system events, so alert configs actually send email. When false, alert configs are stored but nothing is sent.
          type: boolean
      required:
        - configured
      type: object
    AttemptItem:
      additionalProperties: false
      properties:
        error_category:
          description: Failure classification for this attempt.
          enum:
            - success
            - client_error
            - server_error
            - timeout
            - dns_error
            - tls_error
            - connection_refused
            - network_error
            - rate_limited
            - unexpected_status
            - template_error
            - unknown
          type: string
        error_message:
          description: Human-readable failure reason for this attempt.
          type: string
        response_code:
          description: HTTP status code returned by the endpoint on this attempt; 0 when no response was received.
          format: int64
          type: integer
        response_time:
          description: Round-trip time of this attempt, in milliseconds.
          format: int64
          type: integer
        success:
          description: Whether this attempt succeeded (got one of the webhook's expected_status_codes).
          type: boolean
        timestamp:
          description: When this attempt was made, RFC3339.
          format: date-time
          type: string
      required:
        - success
        - response_time
        - response_code
        - timestamp
      type: object
    AttemptsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AttemptsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Every recorded attempt, oldest first.
          items:
            $ref: "#/components/schemas/AttemptItem"
          type: array
      required:
        - items
      type: object
    BatchJobOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BatchJobOutputBody.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: Consumer the snapshot was taken in; empty for a snapshot taken from a cross-consumer list.
          type: string
        created_at:
          description: Creation timestamp, RFC3339.
          format: date-time
          type: string
        expires_at:
          description: "When the snapshot expires, RFC3339: 15 minutes after it was taken. An expired snapshot can no longer be started."
          format: date-time
          type: string
        failed:
          description: Items that could not be re-pushed or retried (e.g. the event or delivery no longer exists).
          format: int64
          type: integer
        id:
          description: "Batch job id (UUID): the repush_id or retry_id from the list call."
          type: string
        job_type:
          description: Which batch operation this job performs.
          enum:
            - event_repush
            - delivery_retry
          type: string
        processed:
          description: Items handled successfully so far.
          format: int64
          type: integer
        status:
          description: "pending: snapshot taken, not started. processing: running. completed: every item was handled (see failed for the ones that could not be). failed: every item failed. cancelled: stopped by a cancel call."
          enum:
            - pending
            - processing
            - completed
            - failed
            - cancelled
          type: string
        total:
          description: Total items in the batch snapshot.
          format: int64
          type: integer
      required:
        - id
        - consumer
        - job_type
        - status
        - total
        - processed
        - failed
        - created_at
        - expires_at
      type: object
    BundleItem:
      additionalProperties: false
      properties:
        active:
          description: Whether events of this type can be pushed. Omitted means true.
          type: boolean
        description:
          description: "Human-readable summary. Omitted means empty: an import replaces the definition."
          type: string
        event_schema:
          additionalProperties: {}
          description: JSON Schema. Omitted means no schema, which removes an existing schema (a breaking change).
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata. Omitted means none.
          type: object
        name:
          description: Event type name.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - name
      type: object
    BundleStampBody:
      additionalProperties: false
      properties:
        format:
          description: Bundle format number.
          format: int64
          type: integer
        sha256:
          description: sha256 of the canonical encoding of items, to tell whether they changed after export.
          type: string
        sparrow_version:
          description: Version of the Sparrow server that exported the bundle.
          type: string
      required:
        - sparrow_version
        - format
        - sha256
      type: object
    CapabilitiesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CapabilitiesOutputBody.json
          format: uri
          readOnly: true
          type: string
        ai_drafting:
          $ref: "#/components/schemas/AIDraftingStruct"
          description: AI-assisted transform template drafting.
        alert_delivery:
          $ref: "#/components/schemas/AlertDeliveryStruct"
          description: Delivery of Sparrow's own alert emails (see the alert-configs endpoints).
      required:
        - ai_drafting
        - alert_delivery
      type: object
    ConsumerHint:
      additionalProperties: false
      properties:
        name:
          description: Consumer to register the recipe under, e.g. _sparrow.
          type: string
        note:
          description: Why, and what the recipe does under any other consumer.
          type: string
      required:
        - name
        - note
      type: object
    ConsumerItem:
      additionalProperties: false
      properties:
        name:
          description: Consumer name.
          type: string
      required:
        - name
      type: object
    ConsumerStatsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConsumerStatsOutputBody.json
          format: uri
          readOnly: true
          type: string
        active_webhooks:
          description: Webhooks currently active (not paused).
          format: int64
          type: integer
        failed_deliveries:
          description: Attempts that failed, all time, including failures that were later retried successfully. Lags like total_deliveries.
          format: int64
          type: integer
        pending_deliveries:
          description: Deliveries waiting to be sent or retried right now (pending, sending or retrying).
          format: int64
          type: integer
        success_rate:
          description: successful_deliveries / total_deliveries, 0.0 to 1.0.
          format: double
          type: number
        successful_deliveries:
          description: Attempts that succeeded, all time. Lags like total_deliveries.
          format: int64
          type: integer
        total_deliveries:
          description: Delivery attempts recorded, all time. A retried delivery counts once per attempt. Updated by each health evaluation (SPARROW_HEALTH_EVAL_INTERVAL), so it can lag by that much.
          format: int64
          type: integer
        total_webhooks:
          description: Total webhooks registered.
          format: int64
          type: integer
      required:
        - total_webhooks
        - active_webhooks
        - total_deliveries
        - successful_deliveries
        - failed_deliveries
        - pending_deliveries
        - success_rate
      type: object
    CreateAlertConfigBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateAlertConfigBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Recipient email address.
          format: email
          type: string
        event_types:
          description: "Sparrow system event types to alert on, at least one of: sparrow.webhook.health_changed, sparrow.webhook.delivery_failed, sparrow.webhook.disabled."
          items:
            type: string
          type: array
        webhook_id:
          description: Scope the alert to one webhook. Omit for a consumer-wide alert covering every webhook.
          type: string
      required:
        - email
        - event_types
      type: object
    CreateInviteBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateInviteBody.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: "Invite into one consumer's portal: the token it creates is limited to that consumer. Omit for tenant-wide (operator console) access. Same naming rules as on POST /v1/tokens."
          type: string
        name:
          description: Name for the token the invite creates, e.g. the invitee's name.
          maxLength: 200
          minLength: 1
          type: string
        token_never_expires:
          description: The token it creates never expires; same rules as never_expires on POST /v1/tokens.
          type: boolean
        token_ttl_seconds:
          description: Lifetime in seconds of the token it creates, counted from redemption; same defaults and limits as ttl_seconds on POST /v1/tokens.
          format: int64
          minimum: 0
          type: integer
        ttl_seconds:
          description: How long the invite can be redeemed, in seconds. 0 or omitted means 24 hours; at most 7 days.
          format: int64
          minimum: 0
          type: integer
      required:
        - name
      type: object
    CreateInviteOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateInviteOutputBody.json
          format: uri
          readOnly: true
          type: string
        invite:
          $ref: "#/components/schemas/InviteOut"
          description: The created invite.
        path:
          description: "UI-relative link with the secret in the fragment (never sent to servers or logs): /#invite=... for a tenant-wide invite, /portal#invite=... for a consumer invite. Prepend the base URL the UI is served from."
          type: string
        secret:
          description: The invite secret. Shown only in this response.
          type: string
      required:
        - invite
        - secret
        - path
      type: object
    CreateSubscriptionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateSubscriptionBody.json
          format: uri
          readOnly: true
          type: string
        event_name:
          description: Event type name to subscribe to, or "*" to receive every event in the consumer (catch-all). sparrow.* names only under the _sparrow consumer. One subscription per webhook, event name and consumer (409 on a duplicate).
          type: string
        headers:
          additionalProperties:
            type: string
          description: Extra HTTP headers sent with deliveries from this subscription. They override the webhook's headers of the same name; the webhook's secret_headers override both. Same name and value rules as webhook headers.
          type: object
        label_filters:
          additionalProperties:
            type: string
          description: Key/value pairs that must ALL be present in an event's labels for this subscription to receive it. Empty means match every event of event_name. Same limits as event labels (20 pairs, 64-character keys, 256-character values).
          type: object
        method:
          description: HTTP method used for deliveries from this subscription, e.g. PUT. Defaults to POST.
          type: string
        on_transform_error:
          description: "What happens when transform_template fails to render. fail (default): the delivery fails with error category template_error, is not retried automatically, and can be retried once the template is fixed; it does not affect the webhook's health. fallback: the default envelope payload is sent instead, and the error is still recorded on the delivery."
          enum:
            - fail
            - fallback
          type: string
        template_missing_key:
          description: "How transform_template reads a key the payload does not have. error (default): the render fails, so a field removed from the event schema cannot silently turn into \"<no value>\" in the body; read optional fields with index or dig (default only fills a key that is present but empty). zero: the key renders as \"<no value>\"."
          enum:
            - error
            - zero
          type: string
        timeout:
          description: Request timeout for this subscription's deliveries, in seconds, overriding the webhook's request_timeout_seconds. 0 to 300; 0 (default) uses the webhook's.
          format: int64
          type: integer
        transform_enabled:
          description: Whether to render transform_template into the delivered body instead of sending the default envelope. Defaults to false.
          type: boolean
        transform_template:
          description: Go text/template rendered against the event to produce the delivered body, used when transform_enabled is true. See GET /v1/template-functions for available helpers; test it with POST /v1/subscriptions:testTemplate. A template that does not parse is rejected with 400; it is not rendered on save. Saving a new template records a version in the template history.
          type: string
        webhook_id:
          description: Webhook id (UUID) to deliver matching events to. Must belong to this consumer.
          type: string
      required:
        - webhook_id
        - event_name
      type: object
    CreateTokenBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateTokenBody.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: "Limit the token to one consumer: it then works only through the portal API (/portal/api/). Omit for a tenant-wide token with the same power as SPARROW_API_KEY. At most 255 characters, no /, \\, ?, #, % or dot segments; _sparrow is not allowed."
          type: string
        external_id:
          description: "Consumer tokens only. Your id for who or what the token is for, e.g. your user id when embedding the portal. There is at most one active token per consumer and external_id: while it is valid, asking again returns it, secret included (reused: true; name and ttl_seconds are ignored), instead of creating another; once it expires or is revoked, a new one is created. This makes minting a portal link on every page view safe. Not a secret: it is fine to log."
          maxLength: 200
          type: string
        name:
          description: Who or what the token is for, e.g. "alice" or "ci-deploy".
          maxLength: 200
          minLength: 1
          type: string
        never_expires:
          description: Create a tenant-wide token that never expires (revoke it when no longer needed). Not allowed with ttl_seconds or for consumer tokens.
          type: boolean
        ttl_seconds:
          description: "Lifetime in seconds. 0 or omitted takes the default: SPARROW_TOKEN_DEFAULT_TTL (90 days unless changed) for tenant-wide tokens, 7 days for consumer tokens. Consumer tokens allow at most 30 days."
          format: int64
          minimum: 0
          type: integer
      required:
        - name
      type: object
    CreateTokenOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateTokenOutputBody.json
          format: uri
          readOnly: true
          type: string
        portal_path:
          description: "Consumer tokens only: server-relative portal URL with the token in the fragment (never sent to the server or logged). Prepend the base URL the UI is served from (the Sparrow server with SPARROW_SERVE_UI=true, or your separately hosted UI) and hand it to the end consumer."
          type: string
        reused:
          description: True when external_id matched a still-valid token, which is returned instead of a new one.
          type: boolean
        secret:
          description: "The credential. Shown only in this response (and again for the same external_id); send it as X-API-Key or Authorization: Bearer."
          type: string
        token:
          $ref: "#/components/schemas/TokenOut"
          description: The created (or reused) token.
      required:
        - token
        - secret
        - reused
      type: object
    CrlOut:
      additionalProperties: false
      properties:
        entries:
          description: Revoked certificates it lists.
          format: int64
          type: integer
        error:
          description: Why the last download or check failed. In soft mode such a CRL gives no answer and connections are allowed.
          type: string
        fetched_at:
          description: When this instance last downloaded it successfully.
          format: date-time
          type: string
        issuer:
          description: Common name of the CA that signs this CRL.
          type: string
        next_update:
          description: When the CA promises a newer CRL. Past it, the CRL is downloaded again before use.
          format: date-time
          type: string
        url:
          description: CRL distribution point, from an intermediate in a receiver's chain.
          type: string
      required:
        - url
        - issuer
        - entries
      type: object
    CursorPaginationOutput:
      additionalProperties: false
      properties:
        has_more:
          description: True when older items follow this page.
          type: boolean
        limit:
          description: Page size applied (the requested limit, default 50).
          format: int32
          type: integer
        next_cursor:
          description: Pass as cursor to get the next, older page. Absent on the last page.
          type: string
      required:
        - limit
        - has_more
      type: object
    DeliveryItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeliveryItem.json
          format: uri
          readOnly: true
          type: string
        attempt_count:
          description: Number of delivery attempts made so far, including earlier rounds before a manual retry.
          format: int64
          type: integer
        consumer:
          description: Consumer of the webhook. Set in delivery listings.
          type: string
        created_at:
          description: When the delivery was created by fan-out, RFC3339.
          format: date-time
          type: string
        delivery_id:
          description: Delivery id (UUID).
          type: string
        error_category:
          description: Outcome classification of the most recent attempt, used to decide retryability. server_error (5xx), timeout, connection_refused, network_error and rate_limited (429) are retried; client_error (other 4xx), dns_error, tls_error and unexpected_status (a 2xx/3xx not in expected_status_codes) are not. template_error means the subscription's transform failed to render; it is not retried automatically and does not count against the webhook's health.
          enum:
            - success
            - client_error
            - server_error
            - timeout
            - dns_error
            - tls_error
            - connection_refused
            - network_error
            - rate_limited
            - unexpected_status
            - template_error
            - unknown
          type: string
        error_message:
          description: Human-readable failure reason from the most recent attempt.
          type: string
        event_id:
          description: Pushed event occurrence this delivery originated from.
          type: string
        event_name:
          description: Event type of that occurrence, e.g. order.created. Set in delivery listings.
          type: string
        last_attempted_at:
          description: Timestamp of the most recent attempt, RFC3339.
          format: date-time
          type: string
        max_attempts:
          description: "Attempts allowed per round before the delivery is marked failed: the webhook's max_retries + 1 when the delivery was created. A manual retry starts a new round."
          format: int64
          type: integer
        next_retry_at:
          description: Timestamp of the next scheduled retry, RFC3339, if one is pending.
          format: date-time
          type: string
        response_body:
          description: "Endpoint response body from the most recent attempt: up to 1 KiB, or up to SPARROW_MAX_CAPTURED_RESPONSE_BYTES when the webhook has capture_response_body."
          type: string
        response_code:
          description: HTTP status code returned by the endpoint on the most recent attempt, if any.
          format: int64
          type: integer
        status:
          description: "Current delivery status. pending: queued for its first attempt (or re-queued by a retry). sending: an attempt is in flight. retrying: an attempt failed and another is scheduled (next_retry_at). success: an attempt got an expected status code. failed: attempts exhausted, or a non-retryable error such as template_error. expired: the event's ttl_seconds passed before the attempt. paused: held because the webhook or subscription was paused; not attempted until retried."
          enum:
            - pending
            - sending
            - success
            - failed
            - retrying
            - expired
            - paused
          type: string
        template_error:
          description: "The payload transform error, when the subscription's template failed to render. Set for both on_transform_error modes: with fail the delivery was not sent; with fallback the default envelope was sent instead."
          type: string
        webhook_description:
          description: Description of that webhook. Set in delivery listings.
          type: string
        webhook_id:
          description: Webhook this delivery was sent to.
          type: string
        webhook_url:
          description: URL of that webhook. Set in delivery listings.
          type: string
      required:
        - delivery_id
        - webhook_id
        - event_id
        - status
        - attempt_count
        - max_attempts
        - created_at
      type: object
    DraftTemplateBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DraftTemplateBody.json
          format: uri
          readOnly: true
          type: string
        current_template:
          description: Optional existing template to refine instead of drafting from scratch.
          maxLength: 20000
          type: string
        docs_url:
          description: Optional http(s) page documenting the receiver's payload. Sparrow fetches it (subject to the same network policy as webhook deliveries, so private and cloud-metadata addresses are refused unless allowed) and gives the model an excerpt of its text.
          format: uri
          maxLength: 2048
          type: string
        event_name:
          description: Registered event type whose schema and sample payload ground the draft, and against which it is verified.
          type: string
        instructions:
          description: Plain-language description of the body the receiver should get, e.g. "a short Slack message with the order id and total, flagged when refunded".
          maxLength: 4000
          minLength: 1
          type: string
        recipe:
          description: Name of a shipped recipe (see GET /v1/recipes) whose destination format the draft should follow, e.g. "slack". Omit for a custom receiver.
          type: string
        sample_payload:
          additionalProperties: {}
          description: Optional payload to ground and verify the draft against instead of the event type's registered sample. Does not change the event type.
          type: object
        target_example:
          description: "Optional: what the receiver expects, either an example body (the draft maps event fields onto that exact structure) or a plain-language description of its shape."
          maxLength: 20000
          type: string
      required:
        - event_name
        - instructions
      type: object
    DraftTemplateOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DraftTemplateOutputBody.json
          format: uri
          readOnly: true
          type: string
        attempts:
          description: Draft/render rounds it took; more than 1 means an earlier draft failed to render and was repaired.
          format: int64
          type: integer
        model:
          description: Model id that produced the draft.
          type: string
        notes:
          description: Short explanation from the model of the fields used and assumptions made.
          type: string
        rendered:
          description: The template rendered against the sample payload used (provided or registered), proving it renders.
          type: string
        sample_source:
          description: "Which sample payload grounded and verified the draft: registered or provided."
          enum:
            - registered
            - provided
          type: string
        template:
          description: The drafted Go template, ready to save as transform_template.
          type: string
      required:
        - template
        - rendered
        - sample_source
        - attempts
        - model
      type: object
    DraftTemplatePromptOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DraftTemplatePromptOutputBody.json
          format: uri
          readOnly: true
          type: string
        prompt:
          description: "A self-contained prompt to paste into any chat assistant: the template data model, rules, helper catalog, the event's schema and sample payload, any recipe, receiver example, docs excerpt, current template, and the instructions. Asks for the template in a code block."
          type: string
        sample_source:
          description: "Which sample payload the prompt carries: registered (the event type's sample_payload) or provided (sample_payload from the request)."
          enum:
            - registered
            - provided
          type: string
      required:
        - prompt
        - sample_source
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    EventOccurrenceItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventOccurrenceItem.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: Tenant consumer this occurrence was pushed into.
          type: string
        created_at:
          description: When this occurrence was pushed, RFC3339.
          format: date-time
          type: string
        event:
          description: Event type name.
          type: string
        event_id:
          description: Event occurrence id (UUID).
          type: string
        event_version:
          description: Event type version this occurrence was accepted under.
          format: int64
          type: integer
        failed_deliveries:
          description: "Failed delivery attempts for this occurrence. Counts attempts, not deliveries: a delivery that failed twice and then succeeded adds 2 here and 1 to successful_deliveries."
          format: int32
          type: integer
        labels:
          additionalProperties:
            type: string
          description: Key/value labels used to match against subscription label filters.
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata stored with the occurrence.
          type: object
        payload:
          additionalProperties: {}
          description: The pushed payload.
          type: object
        pending_deliveries:
          description: "Deliveries not finished yet: pending, sending or retrying."
          format: int32
          type: integer
        schema_valid:
          description: Whether the payload validated against the event type's JSON Schema at push time.
          type: boolean
        successful_deliveries:
          description: Successful delivery attempts for this occurrence.
          format: int32
          type: integer
        webhook_count:
          description: Number of distinct webhooks that got a delivery for this occurrence.
          format: int32
          type: integer
      required:
        - event_id
        - consumer
        - event
        - payload
        - schema_valid
        - event_version
        - webhook_count
        - successful_deliveries
        - failed_deliveries
        - pending_deliveries
        - created_at
      type: object
    EventTypeBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeBody.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether events of this type can be pushed; a push to an inactive type fails with 409. Defaults to true on register; unchanged on update when omitted.
          type: boolean
        description:
          description: Human-readable summary of what this event represents. On update, an empty string leaves it unchanged.
          type: string
        event_schema:
          additionalProperties: {}
          description: "Optional JSON Schema for the payload. Validation is soft: non-conforming payloads are still accepted, with warnings returned from the push call. On update, sending a different schema creates a new version."
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata for your own tooling. On update, replaces the whole map.
          type: object
        name:
          description: Unique event type name, e.g. order.created. Required on register, ignored on update (the path names the type). Lowercase letters, digits, '_' and '-' in dot-separated parts (e.g. stripe.payment_intent.succeeded), at most 255 characters; the sparrow. prefix is reserved. Immutable after creation, and event types cannot be deleted.
          type: string
      type: object
    EventTypeBundle:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeBundle.json
          format: uri
          readOnly: true
          type: string
        apiVersion:
          description: Bundle schema version.
          enum:
            - sparrow/v1
          type: string
        items:
          description: Event type definitions, sorted by name.
          items:
            $ref: "#/components/schemas/BundleItem"
          type: array
        kind:
          description: Bundle kind.
          enum:
            - EventTypeList
          type: string
        stamp:
          $ref: "#/components/schemas/BundleStampBody"
          description: Which Sparrow produced this bundle. A compatibility hint, not a signature.
      required:
        - apiVersion
        - kind
        - stamp
        - items
      type: object
    EventTypeChange:
      additionalProperties: false
      properties:
        action:
          description: "created: new event type at version 1. new_version: the schema changed, so a new version was created and the previous one kept. updated: the current version changed in place (description, metadata, active, or a first schema added to a schema-less version). unchanged: nothing was written."
          enum:
            - created
            - new_version
            - updated
            - unchanged
          type: string
        active_change:
          description: Set when the write flips the active flag.
          enum:
            - deactivates
            - reactivates
          type: string
        affected_subscriptions:
          description: "For new_version: subscriptions that receive this event type, by name or catch-all."
          format: int64
          type: integer
        changes:
          description: "Fields that changed: schema, schema_defined (a first schema was added in place), description, metadata, active."
          items:
            type: string
          type: array
        compatibility:
          $ref: "#/components/schemas/SchemaCompatibilityItem"
          description: "For new_version: whether the schema change could break a subscription's payload transformation."
        previous_version:
          description: Version before the write; absent when the event type was created.
          format: int64
          type: integer
        version:
          description: Version after the write.
          format: int64
          type: integer
      required:
        - action
        - version
      type: object
    EventTypeItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeItem.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether events of this type can currently be pushed.
          type: boolean
        created_at:
          description: Creation timestamp, RFC3339.
          format: date-time
          type: string
        description:
          description: Human-readable summary of what this event represents.
          type: string
        event_schema:
          additionalProperties: {}
          description: JSON Schema payloads are softly validated against, if one is registered.
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata.
          type: object
        name:
          description: Event type name, e.g. order.created.
          type: string
        sample_payload:
          additionalProperties: {}
          description: Example payload derived from the schema, used to preview subscription transform templates.
          type: object
        updated_at:
          description: Last-modified timestamp, RFC3339.
          format: date-time
          type: string
        version:
          description: Current schema version. Starts at 1 and increases only when the schema changes; every version is kept (see listEventTypeVersions).
          format: int64
          type: integer
      required:
        - name
        - active
        - version
        - created_at
        - updated_at
      type: object
    EventTypeVersionItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeVersionItem.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When this version was created, RFC3339.
          format: date-time
          type: string
        description:
          description: Description as it was when this version was created.
          type: string
        event_schema:
          additionalProperties: {}
          description: JSON Schema of this version. Absent for a schema-less version.
          type: object
        name:
          description: Event type name.
          type: string
        sample_payload:
          additionalProperties: {}
          description: Example payload generated from this version's schema.
          type: object
        schema_defined_at:
          description: When a first schema was added to this version in place, RFC3339. Events pushed before this time were accepted while the version had no schema.
          format: date-time
          type: string
        version:
          description: Version number.
          format: int64
          type: integer
      required:
        - name
        - version
        - created_at
      type: object
    ExportEventTypesInputBody:
      additionalProperties: false
