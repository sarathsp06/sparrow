      properties:
        catch_all:
          description: How many of the affected subscriptions are catch-all ("*").
          format: int64
          type: integer
        failures:
          description: Subscriptions whose transform no longer renders against the new version.
          items:
            $ref: "#/components/schemas/TemplateFailureItem"
          type: array
        passed:
          description: Subscriptions whose transform renders.
          format: int64
          type: integer
        paused:
          description: Subscriptions this import paused (subscription_policy=pause).
          items:
            type: string
          type: array
        without_transform:
          description: Subscriptions with no transform. Sparrow passes the payload through and cannot tell whether the receiver copes.
          format: int64
          type: integer
      required:
        - passed
        - without_transform
        - catch_all
      type: object
    TemplateFailureItem:
      additionalProperties: false
      properties:
        consumer:
          description: Consumer the subscription belongs to.
          type: string
        error:
          description: The render error.
          type: string
        payload:
          description: "Which generated payload failed: every field, or only required fields (a template reading an optional field without guarding for it)."
          enum:
            - sample
            - required_only
          type: string
        subscription_id:
          description: Subscription whose template failed.
          type: string
        webhook_id:
          description: Webhook the subscription delivers to.
          type: string
      required:
        - subscription_id
        - consumer
        - webhook_id
        - payload
        - error
      type: object
    TemplateFunctionItem:
      additionalProperties: false
      properties:
        description:
          description: Markdown documentation for the function, including usage and an example.
          type: string
        name:
          description: Function name, as used in a transform_template.
          type: string
      required:
        - name
        - description
      type: object
    TemplateFunctionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TemplateFunctionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          description: Every helper function, in the engine's own order.
          items:
            $ref: "#/components/schemas/TemplateFunctionItem"
          type: array
      required:
        - items
      type: object
    TemplateVersionItem:
      additionalProperties: false
      properties:
        created_at:
          description: When it was saved, RFC3339.
          format: date-time
          type: string
        current:
          description: True for the newest version, which is the subscription's current template.
          type: boolean
        notes:
          description: Note stored with the version.
          type: string
        saved_by:
          description: Name of the master key or access token that saved it; absent when auth is off.
          type: string
        source:
          description: "How the template was produced: manual or ai_draft."
          enum:
            - manual
            - ai_draft
          type: string
        template:
          description: The template text as saved.
          type: string
        version_id:
          description: Version id (UUID).
          type: string
      required:
        - version_id
        - template
        - source
        - created_at
        - current
      type: object
    TestTemplateBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TestTemplateBody.json
          format: uri
          readOnly: true
          type: string
        event_name:
          description: Registered event type. Its name is the envelope's event_name, and its sample_payload (generated from its schema; empty without one) is rendered against when payload is omitted.
          type: string
        payload:
          additionalProperties: {}
          description: Payload to render against instead of the event type's generated sample, e.g. a real event's payload from listEventOccurrences. Used as given, even when empty; the event type needs no schema.
          type: object
        template:
          description: Go template to render, in the same syntax used by transform_template.
          type: string
        template_missing_key:
          description: Render as a subscription with this template_missing_key would. Defaults to error, the subscription default.
          enum:
            - error
            - zero
          type: string
      required:
        - event_name
        - template
      type: object
    TestTemplateOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TestTemplateOutputBody.json
          format: uri
          readOnly: true
          type: string
        rendered:
          description: The template output, rendered against payload (or the event type's sample payload) with a placeholder event id and the current time.
          type: string
      required:
        - rendered
      type: object
    TokenOut:
      additionalProperties: false
      properties:
        consumer:
          description: "Consumer the token is limited to (portal API only). Null: tenant-wide, same power as SPARROW_API_KEY."
          type:
            - string
            - "null"
        created_at:
          description: When the token was created, RFC3339.
          format: date-time
          type: string
        created_by:
          description: Name of the credential that created it (the master key, or another token).
          type: string
        expires_at:
          description: "When the token stops working, RFC3339. Null: never expires."
          format: date-time
          type:
            - string
            - "null"
        id:
          description: Token id (not the secret).
          type: string
        last_used_at:
          description: "When the token was last used, RFC3339; approximate (updated at most once a minute). Null: never used."
          format: date-time
          type:
            - string
            - "null"
        name:
          description: Who or what the token is for.
          type: string
        revoked_at:
          description: "When the token was revoked, RFC3339. Null: not revoked."
          format: date-time
          type:
            - string
            - "null"
        status:
          description: "active: usable. revoked: revoked by DELETE /v1/tokens/{token_id}. expired: past expires_at."
          enum:
            - active
            - revoked
            - expired
          type: string
      required:
        - id
        - name
        - consumer
        - status
        - created_by
        - created_at
        - expires_at
        - revoked_at
        - last_used_at
      type: object
    UpdateEventTypeOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateEventTypeOutputBody.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether events of this type can currently be pushed.
          type: boolean
        change:
          $ref: "#/components/schemas/EventTypeChange"
          description: What this update did.
        created_at:
          description: Creation timestamp, RFC3339.
          format: date-time
          type: string
        description:
          description: Human-readable summary of what this event represents.
          type: string
        event_schema:
          additionalProperties: {}
          description: JSON Schema payloads are softly validated against, if one is registered.
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata.
          type: object
        name:
          description: Event type name, e.g. order.created.
          type: string
        sample_payload:
          additionalProperties: {}
          description: Example payload derived from the schema, used to preview subscription transform templates.
          type: object
        updated_at:
          description: Last-modified timestamp, RFC3339.
          format: date-time
          type: string
        version:
          description: Current schema version. Starts at 1 and increases only when the schema changes; every version is kept (see listEventTypeVersions).
          format: int64
          type: integer
      required:
        - change
        - name
        - active
        - version
        - created_at
        - updated_at
      type: object
    ValidateEventPayloadInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ValidateEventPayloadInputBody.json
          format: uri
          readOnly: true
          type: string
        payload:
          additionalProperties: {}
          description: Payload to validate against the event type's registered JSON Schema.
          type: object
      required:
        - payload
      type: object
    ValidateEventPayloadOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ValidateEventPayloadOutputBody.json
          format: uri
          readOnly: true
          type: string
        valid:
          description: Whether the payload matches the event type's JSON Schema. Always true when the event type has no schema registered.
          type: boolean
        warnings:
          description: Per-field validation errors, present when valid is false.
          items:
            type: string
          type: array
      required:
        - valid
      type: object
    Webhook:
      additionalProperties: false
      properties:
        headers:
          additionalProperties:
            type: string
          description: Static headers sent with every delivery; values may contain {{param}} tokens.
          type: object
        requires_transform:
          description: The destination only accepts the transformed payload; the webhook is registered with requires_transform.
          type: boolean
        secret_headers:
          additionalProperties:
            type: string
          description: Headers whose values are encrypted at rest and masked in API responses (upstream tokens, passwords); values may contain {{param}} tokens.
          type: object
        url:
          description: Destination URL; may contain {{param}} tokens.
          type: string
      required:
        - url
      type: object
    WebhookHTTPConfig:
      additionalProperties: false
      properties:
        capture_response_body:
          description: "How much of the endpoint's response body is stored with each attempt: false (default) keeps up to 1 KiB, true up to SPARROW_MAX_CAPTURED_RESPONSE_BYTES (default 1 MiB)."
          type: boolean
        content_type:
          description: "Stored and returned, but deliveries do not use it yet: they send Content-Type: application/json. To send another Content-Type, set it in headers (or the subscription's headers). Must not be empty; defaults to application/json."
          type: string
        expected_status_codes:
          description: HTTP status codes treated as a successful delivery, each between 100 and 599. Defaults to 200, 201, 202 and 204.
          items:
            format: int64
            type: integer
          type: array
        follow_redirects:
          description: Whether to follow HTTP redirects returned by the endpoint. Each redirect target passes the same SSRF checks. Defaults to true.
          type: boolean
        max_retries:
          description: Retries after the first attempt before a delivery is marked failed, so a delivery gets up to max_retries + 1 attempts. 0 means no retries. Between 0 and 10; defaults to 3.
          format: int64
          type: integer
        rate_limit_rps:
          description: Maximum delivery rate to this webhook, in requests per second (fractions allowed, e.g. 0.5). Must be positive; unset means no limit. Deliveries over the limit wait in the queue.
          format: double
          type: number
        request_timeout_seconds:
          description: How long to wait for the endpoint to respond before treating the attempt as a timeout, in seconds. Between 1 and 300; defaults to 30.
          format: int64
          type: integer
        retry_backoff_seconds:
          description: Base retry delay, in seconds. The delay after attempt N is retry_backoff_seconds * 2^(N-1), capped at 24 hours. Between 1 and 3600; defaults to 60.
          format: int64
          type: integer
        user_agent:
          description: "Stored and returned, but deliveries do not use it yet: they always send User-Agent: Sparrow-Webhook/<server version>. To send another User-Agent, set it in headers. Defaults to Sparrow-Webhook/1.0."
          type: string
        verify_ssl:
          description: Whether to verify the endpoint's TLS certificate. Defaults to true. Set false only for trusted internal endpoints with self-signed certificates; SSRF and redirect checks still apply.
          type: boolean
      type: object
    WebhookHTTPConfigOut:
      additionalProperties: false
      properties:
        capture_response_body:
          description: "false: up to 1 KiB of each response body is stored; true: up to SPARROW_MAX_CAPTURED_RESPONSE_BYTES (default 1 MiB)."
          type: boolean
        content_type:
          description: "Stored value; deliveries currently send Content-Type: application/json unless headers override it."
          type: string
        expected_status_codes:
          description: HTTP status codes treated as a successful delivery.
          items:
            format: int32
            type: integer
          type: array
        follow_redirects:
          description: Whether HTTP redirects returned by the endpoint are followed.
          type: boolean
        max_retries:
          description: Retries after the first attempt before a delivery is marked failed (up to max_retries + 1 attempts).
          format: int64
          type: integer
        rate_limit_rps:
          description: Delivery rate limit for this webhook, in requests per second; absent means no limit.
          format: double
          type: number
        request_timeout_seconds:
          description: Per-attempt request timeout, in seconds.
          format: int64
          type: integer
        retry_backoff_seconds:
          description: Base retry delay, in seconds; the delay after attempt N is retry_backoff_seconds * 2^(N-1), capped at 24 hours.
          format: int64
          type: integer
        user_agent:
          description: "Stored value; deliveries currently always send User-Agent: Sparrow-Webhook/<server version> unless headers override it."
          type: string
        verify_ssl:
          description: Whether the endpoint's TLS certificate is verified.
          type: boolean
        webhook_secret:
          description: HMAC signing secret. Shown in full only once, in the response to webhook registration; masked on every later read.
          type: string
      required:
        - max_retries
        - retry_backoff_seconds
        - capture_response_body
        - follow_redirects
        - verify_ssl
        - request_timeout_seconds
      type: object
    WebhookHealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WebhookHealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        avg_response_time:
          description: Average endpoint response time over the window, in milliseconds.
          format: int64
          type: integer
        client_errors:
          description: Failed attempts in the window with a 4xx response (client_error).
          format: int64
          type: integer
        consecutive_failures:
          description: Current run of consecutive failed attempts; resets on a success.
          format: int64
          type: integer
        failed_deliveries:
          description: Failed attempts in the window.
          format: int64
          type: integer
        health:
          description: "Health label from the last health evaluation: healthy, degraded, unhealthy, or unknown (too few recent attempts). Updated every SPARROW_HEALTH_EVAL_INTERVAL (default 1m)."
          enum:
            - healthy
            - degraded
            - unhealthy
            - unknown
          type: string
        network_errors:
          description: Failed attempts in the window with a network-level error (DNS, TLS, connection refused, reset).
          format: int64
          type: integer
        rules:
          $ref: "#/components/schemas/HealthRules"
          description: Thresholds the health status is derived from.
        server_errors:
          description: Failed attempts in the window with a 5xx response (server_error).
          format: int64
          type: integer
        success_rate:
          description: successful_deliveries / total_deliveries over the window, 0.0 to 1.0.
          format: double
          type: number
        successful_deliveries:
          description: Successful attempts in the window.
          format: int64
          type: integer
        timeout_errors:
          description: Failed attempts in the window that timed out.
          format: int64
          type: integer
        total_deliveries:
          description: Delivery attempts in the last rules.window_hours hours (each retry counts).
          format: int64
          type: integer
        unexpected_status_errors:
          description: Attempts in the window whose 2xx/3xx response was not in expected_status_codes.
          format: int64
          type: integer
        webhook_id:
          description: Webhook id (UUID).
          type: string
      required:
        - webhook_id
        - health
        - total_deliveries
        - successful_deliveries
        - failed_deliveries
        - consecutive_failures
        - success_rate
        - avg_response_time
        - client_errors
        - server_errors
        - timeout_errors
        - network_errors
        - unexpected_status_errors
        - rules
      type: object
    WebhookOut:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WebhookOut.json
          format: uri
          readOnly: true
          type: string
        active:
          description: "Whether deliveries are sent. false: paused by an operator or auto-disabled; new deliveries are held as paused."
          type: boolean
        auto_disabled_at:
          description: Set when Sparrow paused this webhook itself because its receiver kept failing (see SPARROW_AUTO_DISABLE_AFTER), RFC3339. Cleared when the webhook is resumed.
          format: date-time
          type: string
        auto_disabled_reason:
          description: Why Sparrow auto-disabled this webhook. Cleared when the webhook is resumed.
          type: string
        consumer:
          description: Consumer this webhook belongs to.
          type: string
        created_at:
          description: Creation timestamp, RFC3339.
          format: date-time
          type: string
        description:
          description: Human-readable note about this webhook.
          type: string
        events:
          description: Event type names this webhook is currently subscribed to, derived from its subscriptions.
          items:
            type: string
          type: array
        headers:
          additionalProperties:
            type: string
          description: Static HTTP headers sent with every delivery.
          type: object
        health:
          description: Health label from the last health evaluation (see getWebhookHealth).
          enum:
            - healthy
            - degraded
            - unhealthy
            - unknown
          type: string
        http_config:
          $ref: "#/components/schemas/WebhookHTTPConfigOut"
          description: Per-webhook HTTP delivery configuration.
        requires_transform:
          description: Whether every subscription must carry an enabled transform_template because the receiver only accepts transformed payloads.
          type: boolean
        secret_headers:
          additionalProperties:
            type: string
          description: Encrypted secret header names, with values always masked. Update them via PATCH secret_headers; send an empty string to remove one.
          type: object
        signature_type:
          description: Signing scheme. "hmac" (default) signs every delivery with HMAC-SHA256 (v1,); "ed25519" adds an Ed25519 signature (v1a,) alongside the HMAC one.
          enum:
            - hmac
            - ed25519
          type: string
        signing_public_key:
          description: Hex-encoded Ed25519 public key for verifying the v1a, delivery signature. Safe to expose; there is no private-key equivalent to mask.
          type: string
        updated_at:
          description: Last-modified timestamp, RFC3339.
          format: date-time
          type: string
        url:
          description: HTTP endpoint deliveries are POSTed to.
          type: string
        webhook_id:
          description: Webhook id (UUID).
          type: string
      required:
        - webhook_id
        - consumer
        - events
        - url
        - active
        - health
        - signature_type
        - http_config
        - requires_transform
        - created_at
        - updated_at
      type: object
    WhoAmIOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WhoAmIOutputBody.json
          format: uri
          readOnly: true
          type: string
        auth_enabled:
          description: "False when SPARROW_API_KEY is unset: every endpoint is open."
          type: boolean
        master_key:
          description: True when the request used SPARROW_API_KEY itself. Always false when auth is off.
          type: boolean
        name:
          description: "Name of the credential used for this request: the master key's name, the access token's name, or a placeholder when auth is off."
          type: string
        token_id:
          description: Id of the access token used; null for the master key or when auth is off.
          type:
            - string
            - "null"
      required:
        - auth_enabled
        - name
        - master_key
        - token_id
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: "The master key (SPARROW_API_KEY) or a tenant-wide access token. Also accepted as Authorization: Bearer <credential>. Required only when the server is started with SPARROW_API_KEY set; otherwise all endpoints are open. The embedded UI never receives the key: it asks for a credential on the first 401."
      in: header
      name: X-API-Key
      type: apiKey
info:
  contact:
    name: Sparrow
    url: https://github.com/sarathsp06/sparrow
  description: |-
    Sparrow is a self-hosted webhook delivery platform: register the events your system produces, register the webhooks that should receive them, then push event occurrences and Sparrow fans them out with retries and health tracking.

    ## Concepts

    - **Event type** (`Event Types`) — a named, versioned schema for something that happened in your system, e.g. `order.created`. Optional JSON Schema validation is *soft*: invalid payloads are stored with warnings, never rejected.
    - **Event** (`Events`) — one occurrence of an event type, pushed with a payload. Pushing an event asynchronously fans it out to every matching subscription.
    - **Webhook** (`Webhooks`) — a registered HTTP endpoint plus its delivery configuration (retries, timeouts, signing). Every delivery is signed with HMAC-SHA256 (Standard Webhooks), plus Ed25519 when the webhook's signature_type is ed25519.
    - **Subscription** (`Subscriptions`) — links one webhook to one event type within a consumer, optionally with a Go-template payload transform and label filters. Registering a webhook auto-creates matching subscriptions.
    - **Delivery** (`Deliveries`) — one attempt (and its retry history) to send an event to a webhook. Failures are classified as retryable (5xx, timeout, network) or not (4xx, DNS, TLS).
    - **Health** (`Health`) — a per-webhook label (healthy/degraded/unhealthy/unknown) derived from the last 24 hours of attempts, refreshed every `SPARROW_HEALTH_EVAL_INTERVAL`.

    ## Consumers

    Webhooks, events, subscriptions, and deliveries are scoped to a `consumer` path segment (defaults to `default` if you don't need multi-tenancy). A handful of read endpoints are deliberately global (no consumer) for cross-tenant dashboards and id-only lookups where the resource id is already globally unique.

    ## Authentication

    Optional. When the server is started with `SPARROW_API_KEY` set, every `/v1/*` request must carry that master key or a tenant-wide access token (`createToken` without a `consumer`), in the `X-API-Key` header or as `Authorization: Bearer <credential>`. When `SPARROW_API_KEY` is unset, every endpoint is open, and outside `SPARROW_ENVIRONMENT=production` CORS also allows any origin: never expose such a server beyond a trusted network.

    ## Portal tokens

    A consumer-scoped access token (`createToken` with a `consumer`) powers the embedded portal at `/portal`. It is refused on `/v1` (403); its API calls go to the single `/portal/api/` prefix with `Authorization: Bearer <token>`, and the consumer is carried by the token, not the URL, so exposing the portal means allowlisting only `/portal`, `/_app`, and `/portal/api`. `/portal/api/<rest>` is served by `/v1/consumers/<token's consumer>/<rest>`, except `POST events` (refused), plus these global helpers: `GET event-types[/...]` (listed for the token's consumer), `GET template-functions`, `GET capabilities`, and `POST subscriptions:testTemplate`. Each operation's description says whether portal tokens can call it.

    ## Errors

    Errors from the API itself are RFC 9457 problem details (`Content-Type: application/problem+json`): `{"title", "status", "detail", "errors"}`, where `errors` lists per-field validation problems. Two layers in front of the API answer with plain `application/json` instead:

    - Authentication (`401`, `503`): `{"error": "unauthorized", "reason": "missing|invalid|expired|revoked", "message": "..."}`; `reason` is absent for `503 unavailable` (retry after the `Retry-After` header).
    - Authorization and the portal gateway (`401`, `403`): `{"error": "forbidden" or "unauthorized", "message": "..."}`, e.g. a consumer-scoped token on `/v1`.

    Status codes: `400` invalid input, `404` not found, `409` conflict or wrong state, `413` body over `SPARROW_MAX_BODY_BYTES`, `429` rate limited, `500` internal (details are logged, not returned), `503` temporarily unavailable, `504` timed out.
  license:
    identifier: MIT
    name: MIT
  title: Sparrow
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/capabilities:
    get:
      description: |-
        Reports which optional, deployment-configured features this server offers so clients can show or hide the matching UI: AI-assisted transform template drafting, with the provider and model in use, and whether alert email delivery is set up. Read-only.

        ai_drafting.enabled reflects SPARROW_AI_ENABLED=true; drafting is usable only when enabled is true and problem is absent; prompt_only is the opposite of enabled.

        Portal tokens: allowed, as GET /portal/api/capabilities.
      operationId: getCapabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List optional server features
      tags:
        - Server
  /v1/consumers:
    get:
      description: |-
        Lists the consumers that own a webhook or an event, sorted by name, optionally only those whose name contains q (case-insensitive). Consumers are created implicitly by registering a webhook or pushing an event under them; this is how clients find them, e.g. for a consumer picker. Not paginated: returns at most limit names.

        Portal tokens: not allowed.
      operationId: listConsumers
      parameters:
        - description: Only consumers whose name contains this text, case-insensitive.
          explode: false
          in: query
          name: q
          schema:
            description: Only consumers whose name contains this text, case-insensitive.
            maxLength: 255
            type: string
        - description: Maximum names to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum names to return.
            format: int32
            maximum: 1000
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConsumersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Search consumer names
      tags:
        - Webhooks
  /v1/consumers/{consumer}/alert-configs:
    get:
      description: |-
        Lists alert configs in a consumer, oldest first, optionally filtered to one webhook's own configs. Not paginated.

        Portal tokens: allowed, as GET /portal/api/alert-configs.
      operationId: listAlertConfigs
      parameters:
        - description: Consumer to list alert configs in.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer to list alert configs in.
