  /v1/event-types:export:
    post:
      description: |-
        Returns the current definitions of the selected event types as one JSON bundle, ready to import into another environment with importEventTypes. Choose exactly one of names, prefix or all. An unknown name fails the whole export. Sparrow's own sparrow.* event types are never exported. Read-only despite POST (the selection travels in the body).

        Portal tokens: not allowed.
      operationId: exportEventTypes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportEventTypesInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTypeBundle"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Export event type definitions as a bundle
      tags:
        - Event Types
  /v1/event-types:import:
    post:
      description: |-
        Applies a bundle in one transaction: each item replaces the named event type using the usual version rules, or nothing is written. Event types not in the bundle are never touched; an import does not delete. The full per-item result is returned either way. Nothing is written for a dry run, when a stamp warning is not acknowledged, or when a change is breaking for subscriptions and allow_breaking is not set; blocked_by says why. The body may be an exported bundle as-is, plus the options. Idempotent: importing the same bundle again reports every item unchanged. The body is limited to 5 MiB and 500 items.

        Portal tokens: not allowed.
      operationId: importEventTypes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportEventTypesInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportEventTypesOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Import a bundle of event type definitions
      tags:
        - Event Types
  /v1/events:
    get:
      description: |-
        Lists event occurrences across every consumer, newest first, with the same filters, cursor pagination and prepare_repush side effect as the per-consumer route. Pass consumer to scope to one consumer.

        Portal tokens: not allowed.
      operationId: listEventOccurrencesGlobal
      parameters:
        - description: Filter to one consumer; omit to list occurrences across all consumers.
          explode: false
          in: query
          name: consumer
          schema:
            description: Filter to one consumer; omit to list occurrences across all consumers.
            type: string
        - description: Filter to occurrences of this event type name.
          explode: false
          in: query
          name: event
          schema:
            description: Filter to occurrences of this event type name.
            type: string
        - description: "Filter by schema validation result: valid or invalid. Other values are 400."
          explode: false
          in: query
          name: schema_valid
          schema:
            description: "Filter by schema validation result: valid or invalid. Other values are 400."
            type: string
        - description: Filter by labels as comma-separated key=value pairs, e.g. region=eu,tier=gold. Matches occurrences whose labels contain every pair.
          explode: false
          in: query
          name: labels
          schema:
            description: Filter by labels as comma-separated key=value pairs, e.g. region=eu,tier=gold. Matches occurrences whose labels contain every pair.
            type: string
        - description: "Only occurrences created at or after this time: YYYY-MM-DD (start of that day, UTC) or an RFC3339 timestamp."
          explode: false
          in: query
          name: created_after
          schema:
            description: "Only occurrences created at or after this time: YYYY-MM-DD (start of that day, UTC) or an RFC3339 timestamp."
            type: string
        - description: "Only occurrences created at or before this time: YYYY-MM-DD (through the end of that day, UTC) or an RFC3339 timestamp."
          explode: false
          in: query
          name: created_before
          schema:
            description: "Only occurrences created at or before this time: YYYY-MM-DD (through the end of that day, UTC) or an RFC3339 timestamp."
            type: string
        - description: "Side effect: when true, also snapshots the ids of every occurrence matching the filters (not just this page; at most 10,000, more is an error) into a batch job and returns its id as repush_id. Pass it to POST .../events:rePush within 15 minutes. Each call creates a new snapshot."
          explode: false
          in: query
          name: prepare_repush
          schema:
            default: false
            description: "Side effect: when true, also snapshots the ids of every occurrence matching the filters (not just this page; at most 10,000, more is an error) into a batch job and returns its id as repush_id. Pass it to POST .../events:rePush within 15 minutes. Each call creates a new snapshot."
            type: boolean
        - description: Maximum items to return, 1 to 1000.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return, 1 to 1000.
            format: int32
            maximum: 1000
            minimum: 1
            type: integer
        - description: "Continue after the page this came from: pagination.next_cursor of the previous response. Stable while new events arrive."
          explode: false
          in: query
          name: cursor
          schema:
            description: "Continue after the page this came from: pagination.next_cursor of the previous response. Stable while new events arrive."
            type: string
        - description: "Removed: page with cursor. Any value other than 0 is rejected with 400, so a client still paging by offset fails loudly instead of re-reading the first page."
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: "Removed: page with cursor. Any value other than 0 is rejected with 400, so a client still paging by offset fails loudly instead of re-reading the first page."
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEventOccurrencesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List pushed event occurrences across all consumers
      tags:
        - Events
  /v1/events/{event_id}:
    get:
      description: |-
        Returns one event occurrence's payload, labels, and delivery outcome counts. Event ids are globally unique, so no consumer is required. 400 when event_id is not a UUID, 404 when it does not exist (or was removed by retention).

        Portal tokens: not allowed.
      operationId: getEventOccurrence
      parameters:
        - description: Event occurrence id (UUID).
          in: path
          name: event_id
          required: true
          schema:
            description: Event occurrence id (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventOccurrenceItem"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a pushed event occurrence by id
      tags:
        - Events
  /v1/events/{event_id}:repush:
    post:
      description: |-
        Pushes a stored event occurrence again: creates a new event occurrence (new event_id) with the same consumer, event type, payload, labels, metadata and TTL, validates the payload against the current schema, and fans it out to the subscriptions that match now. The original occurrence and its deliveries are unchanged. Not idempotent: each call creates another event. To resend one existing delivery instead, retry the delivery.

        404 when the event does not exist; the same errors as pushEvent when the event type is now inactive or unregistered.

        Portal tokens: not allowed.
      operationId: repushEvent
      parameters:
        - description: Event occurrence id (UUID).
          in: path
          name: event_id
          required: true
          schema:
            description: Event occurrence id (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepushEventOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Replay a single pushed event occurrence
      tags:
        - Events
