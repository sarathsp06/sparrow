  /v1/webhooks:
    get:
      description: Cross-namespace webhook listing. Pass health to filter by computed status, or webhook_id for an id-only lookup when the namespace isn't known.
      operationId: listWebhooksByHealth
      parameters:
        - description: Filter to webhooks with this computed health status.
          explode: false
          in: query
          name: health
          schema:
            description: Filter to webhooks with this computed health status.
            enum:
              - healthy
              - degraded
              - unhealthy
              - unknown
              - ""
            type: string
        - description: Look up a single webhook by id when its namespace is unknown.
          explode: false
          in: query
          name: webhook_id
          schema:
            description: Look up a single webhook by id when its namespace is unknown.
            type: string
        - description: Maximum items to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return.
            format: int32
            type: integer
        - description: Number of items to skip, for pagination.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip, for pagination.
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWebhooksOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List webhooks across all namespaces filtered by computed health status
      tags:
        - Health
security:
  - ApiKeyAuth: []
  - {}
tags:
  - description: Registered HTTP endpoints and their delivery configuration (retries, timeouts, signing, rate limits). Secrets are always masked in responses except once, at creation time.
    name: Webhooks
  - description: Named, versioned schemas for the events your system can produce. Schema validation is soft — invalid payloads are stored with warnings, not rejected.
    name: Event Types
  - description: Pushed occurrences of an event type. Pushing an event asynchronously fans it out to every subscription that matches its event name and label filters.
    name: Events
  - description: The link between one webhook and one event type within a namespace. Carries the optional payload-transform template and label filters that decide whether a given event occurrence produces a delivery.
    name: Subscriptions
  - description: Individual delivery attempts and their per-attempt retry history. Failed deliveries can be retried singly or in bulk via a prepared batch snapshot.
    name: Deliveries
  - description: Rolling per-webhook health status computed from recent delivery outcomes, plus cross-namespace aggregate counts for dashboards.
    name: Health
