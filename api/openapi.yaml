        - description: Subscription id (UUID).
          in: path
          name: subscription_id
          required: true
          schema:
            description: Subscription id (UUID).
            type: string
        - description: Maximum versions to return, newest first, 1 to 20.
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Maximum versions to return, newest first, 1 to 20.
            format: int64
            maximum: 20
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
