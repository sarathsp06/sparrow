        - Subscriptions
  /v1/consumers/{consumer}/subscriptions/{subscription_id}:pause:
    post:
      description: |-
        Stops the subscription's deliveries from being attempted, for any reason (receiver maintenance, a template being fixed, an investigation). Events keep fanning out to it: each delivery is recorded with status paused and nothing is queued, so nothing is lost. Queued or retrying deliveries of the subscription are held as paused when their turn comes. A pause never affects the webhook's health. Returns the subscription (200), unlike webhook pause, which returns 204.

        Idempotent: pausing again updates the reason and keeps the original pause time. 400 for a reason over 500 characters, 404 when it is not in this consumer.

        Portal tokens: allowed, as POST /portal/api/subscriptions/{subscription_id}:pause.
      operationId: pauseSubscription
      parameters:
        - description: Consumer the subscription belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer the subscription belongs to.
            type: string
        - description: Subscription id (UUID).
          in: path
          name: subscription_id
          required: true
          schema:
            description: Subscription id (UUID).
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseSubscriptionInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionItem"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Pause a subscription
      tags:
        - Subscriptions
  /v1/consumers/{consumer}/subscriptions/{subscription_id}:resume:
    post:
      description: |-
        Lets new deliveries be attempted again. Deliveries recorded while paused stay paused and are never sent automatically: the response says how many there are and when the pause began, so you can retry all of them or only those since a time with the delivery retry endpoints. Idempotent: resuming a subscription that is not paused succeeds with no paused_since.

        Portal tokens: allowed, as POST /portal/api/subscriptions/{subscription_id}:resume.
      operationId: resumeSubscription
      parameters:
        - description: Consumer the subscription belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer the subscription belongs to.
            type: string
        - description: Subscription id (UUID).
          in: path
          name: subscription_id
          required: true
          schema:
            description: Subscription id (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeSubscriptionOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Resume a paused subscription
      tags:
        - Subscriptions
  /v1/consumers/{consumer}/subscriptions/{subscription_id}:sendTestEvent:
    post:
      description: |-
        Sends event_name to the subscription: one signed delivery of payload, or of the event type's sample when payload is omitted, rendered through the subscription's transform as a real delivery would be, to its webhook's URL, synchronously, and returns what the receiver answered. It uses the same request builder, signing, network policy (SSRF protection) and timeout as real deliveries and adds the header X-Sparrow-Test: true. It creates no delivery and never counts toward the webhook's health or auto-disable. A receiver error is reported in the response (status_code, error_class), not as an API error.

        One test event per webhook every 2 seconds on each server: more answer 429. 404 for a subscription not in this consumer. 400 when the subscription does not receive event_name, or when the event type is not registered and no payload is given.

        Portal tokens: allowed, as POST /portal/api/subscriptions/{subscription_id}:sendTestEvent.
      operationId: sendTestEvent
      parameters:
        - description: Tenant consumer the subscription belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Tenant consumer the subscription belongs to.
            type: string
        - description: "Subscription to send the event to: its transform renders the payload, and its webhook receives it."
          in: path
          name: subscription_id
          required: true
          schema:
            description: "Subscription to send the event to: its transform renders the payload, and its webhook receives it."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTestEventInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendTestEventOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Send a test event to a subscription
      tags:
        - Subscriptions
  /v1/consumers/{consumer}/webhooks:
    get:
      description: |-
        Lists the webhooks of one consumer, newest first, optionally filtered by id, subscribed event, active flag, or health status. Secrets are masked. Offset paginated with total_count. Deleted webhooks are never listed.

        Portal tokens: allowed, as GET /portal/api/webhooks.
      operationId: listWebhooks
      parameters:
        - description: Tenant consumer to list webhooks in.
          in: path
          name: consumer
          required: true
          schema:
            description: Tenant consumer to list webhooks in.
            type: string
        - description: Filter to a single webhook by id.
          explode: false
          in: query
          name: webhook_id
          schema:
            description: Filter to a single webhook by id.
            type: string
        - description: Filter to webhooks subscribed to this event type name.
          explode: false
          in: query
          name: event
          schema:
            description: Filter to webhooks subscribed to this event type name.
            type: string
        - description: true returns only active (not paused) webhooks; false returns all.
          explode: false
          in: query
          name: active
          schema:
            default: false
            description: true returns only active (not paused) webhooks; false returns all.
            type: boolean
        - description: Filter by computed health status.
          explode: false
          in: query
          name: health
          schema:
            description: Filter by computed health status.
            enum:
              - healthy
              - degraded
              - unhealthy
              - unknown
            type: string
        - description: Maximum items to return, 1 to 1000.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return, 1 to 1000.
            format: int32
            maximum: 1000
            minimum: 1
            type: integer
        - description: Number of items to skip, for pagination.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip, for pagination.
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWebhooksOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List webhooks
      tags:
        - Webhooks
    post:
      description: |-
        Registers a new HTTP endpoint and creates one subscription per name in events (with transform_template, when given). Generates the HMAC signing secret and returns it in plaintext in http_config.webhook_secret; this response is the only time it is shown. Event names are not required to be registered event types yet.

        Not idempotent: a second call with the same URL in the same consumer fails with 409 while the first webhook exists. 400 for an invalid URL (scheme, unresolvable or blocked host), invalid headers, http_config out of range, a sparrow.* event outside the _sparrow consumer, or requires_transform without transform_template.

        Portal tokens: allowed, as POST /portal/api/webhooks.
      operationId: registerWebhook
      parameters:
        - description: Consumer to register the webhook under. Created implicitly on first use.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer to register the webhook under. Created implicitly on first use.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWebhookBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookOut"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Register a webhook
      tags:
        - Webhooks
  /v1/consumers/{consumer}/webhooks/{webhook_id}:
    delete:
      description: |-
        Deletes a webhook (a soft delete): it stops receiving events and no longer appears in webhook lists, and its URL can be registered again in the consumer. Its subscriptions and delivery history are kept, and its deliveries stay listed until retention removes them. Queued deliveries for it fail with "Webhook was deleted". This cannot be undone. A second delete returns 404.

        Portal tokens: allowed, as DELETE /portal/api/webhooks/{webhook_id}.
      operationId: deleteWebhook
      parameters:
        - description: Tenant consumer the webhook belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Tenant consumer the webhook belongs to.
            type: string
        - description: Webhook id (UUID).
          in: path
          name: webhook_id
          required: true
          schema:
            description: Webhook id (UUID).
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Delete a webhook
      tags:
        - Webhooks
    get:
      description: |-
        Returns one webhook's configuration, subscribed events, masked secrets, and current health label. 404 when it does not exist in this consumer or was deleted.

        Portal tokens: allowed, as GET /portal/api/webhooks/{webhook_id}.
      operationId: getWebhook
      parameters:
        - description: Tenant consumer the webhook belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Tenant consumer the webhook belongs to.
            type: string
        - description: Webhook id (UUID).
          in: path
          name: webhook_id
          required: true
          schema:
            description: Webhook id (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookOut"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a webhook by id
      tags:
        - Webhooks
    patch:
      description: |-
        Partially updates a webhook: only fields present in the body change. Within http_config only the sent fields change, and the merged result is validated as on register (400 if out of range). Sending events replaces every subscription of the webhook (see events). Setting active toggles delivery like :pause/:resume but never fails when the state is already as requested. Returns the updated webhook. Idempotent: repeating the same body leaves the same state.

        409 when turning requires_transform on while a subscription has no enabled transform, or replacing events while it is on. The deprecated top-level timeout is applied only when http_config.request_timeout_seconds is not sent.

        Portal tokens: allowed, as PATCH /portal/api/webhooks/{webhook_id}.
      operationId: updateWebhook
      parameters:
        - description: Consumer the webhook belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer the webhook belongs to.
            type: string
        - description: Webhook id (UUID).
          in: path
          name: webhook_id
          required: true
          schema:
            description: Webhook id (UUID).
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWebhookBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookOut"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Partially update a webhook
      tags:
        - Webhooks
  /v1/consumers/{consumer}/webhooks/{webhook_id}/health:
    get:
      description: |-
        Returns one webhook's health label plus attempt counts and per-category error counts (client, server, timeout, network, unexpected-status) over the last rules.window_hours hours, and the thresholds the label is derived from. The label lags by up to SPARROW_HEALTH_EVAL_INTERVAL. Counts are zero before the first attempt. 404 when the webhook is not in this consumer.

        Portal tokens: allowed, as GET /portal/api/webhooks/{webhook_id}/health.
      operationId: getWebhookHealth
      parameters:
        - description: Tenant consumer the webhook belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Tenant consumer the webhook belongs to.
            type: string
        - description: Webhook id (UUID).
          in: path
          name: webhook_id
          required: true
          schema:
            description: Webhook id (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookHealthOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
