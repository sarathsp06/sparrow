  /v1/consumers/{consumer}/subscriptions:
    get:
      description: |-
        Lists subscriptions in a consumer, newest first, optionally filtered by webhook or event type name. Offset paginated with total_count. 404 when webhook_id is given and the webhook is not in this consumer.

        Portal tokens: allowed, as GET /portal/api/subscriptions.
      operationId: listSubscriptions
      parameters:
        - description: Consumer to list subscriptions in.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer to list subscriptions in.
            type: string
        - description: "Filter to subscriptions for one webhook (UUID). Takes precedence over event_name: when both are given, event_name is ignored."
          explode: false
          in: query
          name: webhook_id
          schema:
            description: "Filter to subscriptions for one webhook (UUID). Takes precedence over event_name: when both are given, event_name is ignored."
            type: string
        - description: Filter to subscriptions with exactly this event_name ("*" matches only catch-all subscriptions).
          explode: false
          in: query
          name: event_name
          schema:
            description: Filter to subscriptions with exactly this event_name ("*" matches only catch-all subscriptions).
            type: string
        - description: Maximum items to return, 1 to 1000.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return, 1 to 1000.
            format: int32
            maximum: 1000
            minimum: 1
            type: integer
        - description: Number of items to skip, for pagination.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
