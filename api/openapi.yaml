        - description: Filter to subscriptions with exactly this event_name ("*" matches only catch-all subscriptions).
          explode: false
          in: query
          name: event_name
          schema:
            description: Filter to subscriptions with exactly this event_name ("*" matches only catch-all subscriptions).
            type: string
        - description: Maximum items to return, 1 to 1000.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return, 1 to 1000.
            format: int32
            maximum: 1000
            minimum: 1
            type: integer
        - description: Number of items to skip, for pagination.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip, for pagination.
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubscriptionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List subscriptions across all consumers
      tags:
        - Subscriptions
  /v1/subscriptions:draftTemplate:
    post:
      description: |-
        Drafts a transform_template from a plain-language description, grounded in the event type's JSON Schema and sample payload, the template helper catalog, and optionally a shipped recipe's destination format or an example body the receiver expects. Every draft is rendered against the sample payload (as POST /v1/subscriptions:testTemplate does) and repaired until it renders, so the returned template is known to work. Nothing is saved: put the template into a subscription's transform_template. Requires SPARROW_AI_ENABLED=true and the provider settings (SPARROW_AI_API_KEY for Anthropic, or SPARROW_AI_PROVIDER=openai with SPARROW_AI_BASE_URL and SPARROW_AI_MODEL for any OpenAI-compatible server); otherwise 503, naming the missing setting. Only the sample payload (registered or provided in the request), the schema, and the request's own text are sent to the model, never stored events, headers, or secrets.

        Not idempotent (model output varies). 404 for an unknown event type or recipe, 429 when the provider rate-limits, 504 when the draft takes longer than SPARROW_AI_TIMEOUT (default 3m).

        Portal tokens: not allowed.
      operationId: draftSubscriptionTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftTemplateBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftTemplateOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
        "504":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Gateway Timeout
      summary: Draft a transform template with AI
      tags:
        - Subscriptions
  /v1/subscriptions:draftTemplatePrompt:
    post:
      description: |-
        Returns the same prompt POST /v1/subscriptions:draftTemplate would send, as one self-contained text to paste into any chat assistant (ChatGPT, Claude, a local model). Works whether or not the server has an AI provider configured, so installs without SPARROW_AI_* still get a one-click prompt. The user pastes the assistant's template back into the subscription editor and checks it with Run Preview. Nothing is sent anywhere by Sparrow; a docs_url, if given, is fetched under the delivery network policy to include an excerpt. No side effects.

        Portal tokens: not allowed.
      operationId: buildSubscriptionTemplatePrompt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftTemplateBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftTemplatePromptOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Build the AI drafting prompt without calling a model
      tags:
        - Subscriptions
  /v1/subscriptions:testTemplate:
    post:
      description: |-
        Dry-runs a transform template against payload when given, else the named event type's generated sample payload, without creating a subscription or any delivery. Use this to iterate on transform_template before saving it; pass a real event's payload to see what a receiver would get. Stateless and idempotent.

        400 when the template does not parse or fails to render (with template_missing_key error, a key the payload lacks is an error), 404 when the event type is not registered, 503 when the template engine is at capacity (retry).

        Portal tokens: allowed, as POST /portal/api/subscriptions:testTemplate.
      operationId: testSubscriptionTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestTemplateBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestTemplateOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Render a transform template against a sample or given payload
      tags:
        - Subscriptions
  /v1/template-functions:
    get:
      description: |-
        Lists the helper functions available to subscription transform templates (on top of Go text/template built-ins), each with Markdown documentation. Static: the same for every caller.

        Portal tokens: allowed, as GET /portal/api/template-functions.
      operationId: getTemplateFunctions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateFunctionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List available payload-transformation template functions
      tags:
        - Webhooks
  /v1/tls/crls:
    get:
      description: Shows the CRLs the instance that answers has cached for checking intermediates in receivers' TLS chains, with when each was fetched and any error. CRLs are downloaded the first time a chain needs them, refreshed in the background by the next handshake once older than SPARROW_CRL_MAX_AGE, and on demand with refreshCrls. Each instance keeps its own cache, so behind a load balancer this shows one instance.
      operationId: listCrls
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCrlsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List cached CRLs
      tags:
        - Server
  /v1/tls/crls:refresh:
    post:
      description: "Asks every instance (through Postgres NOTIFY) to download its cached CRLs now, for when a CA revokes an intermediate and deliveries should stop trusting it before SPARROW_CRL_MAX_AGE passes. Returns 202 once the request is sent; check listCrls for the result. One request a minute on each server: more answer 429. 409 when SPARROW_TLS_REVOCATION=off."
      operationId: refreshCrls
      responses:
        "202":
          description: Accepted
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Refresh cached CRLs on every instance
      tags:
        - Server
  /v1/tokens:
    get:
      description: |-
        Lists access tokens, newest first. Secrets are never returned. Revoked and expired tokens are hidden unless include_inactive is set. Not paginated.

        Portal tokens: not allowed.
      operationId: listTokens
      parameters:
        - description: Only tokens limited to this consumer. Omit to list every token, tenant-wide ones included.
          explode: false
          in: query
          name: consumer
          schema:
            description: Only tokens limited to this consumer. Omit to list every token, tenant-wide ones included.
            type: string
        - description: Also return revoked and expired tokens.
          explode: false
          in: query
          name: include_inactive
          schema:
            description: Also return revoked and expired tokens.
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTokensOutputBody"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: List access tokens
      tags:
        - Access
    post:
      description: |-
        Creates a named token. A tenant-wide token (no consumer) works exactly like SPARROW_API_KEY but can be revoked on its own and never needs the master key to be shared. A consumer token only works through the portal API (/portal/api/), limited to that consumer, and comes with a ready-made portal link (portal_path) to embed or hand to the end consumer. The secret is returned once, or again for the same external_id while the token is valid. Without external_id every call creates a new token.

        400 for an invalid consumer, both ttl_seconds and never_expires, never_expires or more than 30 days on a consumer token, or external_id without a consumer. 503 when the token store is unavailable, or for external_id when no keyring is configured.

        Portal tokens: not allowed.
      operationId: createToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenOutputBody"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Create an access token
      tags:
        - Access
  /v1/tokens/{token_id}:
    delete:
      description: |-
        Revokes a token: it stops working immediately on this server and within 30 seconds on other instances. Revoking is permanent and idempotent (204 again for an already revoked token). Returns 204; 404 for an unknown id.

        Portal tokens: not allowed.
      operationId: revokeToken
      parameters:
        - description: Token id (the id field, not the secret).
          in: path
          name: token_id
          required: true
          schema:
            description: Token id (the id field, not the secret).
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Revoke an access token
      tags:
        - Access
  /v1/webhooks:
    get:
      description: |-
        Lists webhooks across every consumer, newest first, with masked secrets. Pass consumer to scope to one consumer, health to filter by label, or webhook_id for an id-only lookup when the consumer is not known. Offset paginated with total_count.

        Portal tokens: not allowed.
      operationId: listWebhooksByHealth
      parameters:
        - description: Filter to one consumer; omit to list webhooks across all consumers.
          explode: false
          in: query
          name: consumer
          schema:
            description: Filter to one consumer; omit to list webhooks across all consumers.
            type: string
        - description: Filter to webhooks with this computed health status.
          explode: false
          in: query
          name: health
          schema:
            description: Filter to webhooks with this computed health status.
            enum:
              - healthy
              - degraded
              - unhealthy
              - unknown
            type: string
        - description: Look up a single webhook by id when its consumer is unknown.
          explode: false
          in: query
          name: webhook_id
          schema:
            description: Look up a single webhook by id when its consumer is unknown.
            type: string
        - description: Maximum items to return; values above 1000 are capped at 1000.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return; values above 1000 are capped at 1000.
            format: int32
            type: integer
        - description: Number of items to skip, for pagination.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip, for pagination.
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWebhooksOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List webhooks across all consumers
      tags:
        - Health
  /v1/whoami:
    get:
      description: |-
        Reports whether auth is on and which credential (master key or access token) authenticated this request. No side effects. Useful to check a key or token before using it.

        Portal tokens: not allowed.
      operationId: getWhoAmI
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmIOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show which credential this request used
      tags:
        - Access
security:
  - ApiKeyAuth: []
  - {}
tags:
  - description: Registered HTTP endpoints and their delivery configuration (retries, timeouts, signing, rate limits). Secrets are always masked in responses except once, at creation time.
    name: Webhooks
  - description: Named, versioned schemas for the events your system can produce. Schema validation is soft — invalid payloads are stored with warnings, not rejected.
    name: Event Types
  - description: Pushed occurrences of an event type. Pushing an event asynchronously fans it out to every subscription that matches its event name and label filters.
    name: Events
  - description: The link between one webhook and one event type within a consumer. Carries the optional payload-transform template and label filters that decide whether a given event occurrence produces a delivery.
    name: Subscriptions
  - description: Individual delivery attempts and their per-attempt retry history. Failed deliveries can be retried singly or in bulk via a prepared batch snapshot.
    name: Deliveries
  - description: Rolling per-webhook health status computed from recent delivery outcomes, plus cross-consumer aggregate counts for dashboards.
    name: Health
  - description: Opt-in email recipients for Sparrow's own self-generated webhook.health_changed, webhook.delivery_failed and webhook.disabled system events.
    name: Alert Configs
  - description: Shipped webhook adapter recipes that pre-fill destinations, headers, and payload transforms.
    name: Recipes
  - description: Access tokens and invites. Tenant-wide tokens work like SPARROW_API_KEY but can be revoked one by one; consumer-scoped tokens only reach the portal API. Secrets are shown once.
    name: Access
  - description: Deployment-level information about this server, such as which optional features are configured.
    name: Server
