security:
  - ApiKeyAuth: []
  - {}
tags:
  - description: Registered HTTP endpoints and their delivery configuration (retries, timeouts, signing, rate limits). Secrets are always masked in responses except once, at creation time.
    name: Webhooks
  - description: Named, versioned schemas for the events your system can produce. Schema validation is soft — invalid payloads are stored with warnings, not rejected.
    name: Event Types
  - description: Pushed occurrences of an event type. Pushing an event asynchronously fans it out to every subscription that matches its event name and label filters.
    name: Events
  - description: The link between one webhook and one event type within a consumer. Carries the optional payload-transform template and label filters that decide whether a given event occurrence produces a delivery.
    name: Subscriptions
  - description: Individual delivery attempts and their per-attempt retry history. Failed deliveries can be retried singly or in bulk via a prepared batch snapshot.
    name: Deliveries
  - description: Rolling per-webhook health status computed from recent delivery outcomes, plus cross-consumer aggregate counts for dashboards.
    name: Health
