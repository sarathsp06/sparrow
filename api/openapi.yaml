components:
  schemas:
    AttemptItem:
      additionalProperties: false
      properties:
        error_category:
          description: Failure classification for this attempt.
          enum:
            - success
            - client_error
            - server_error
            - timeout
            - dns_error
            - tls_error
            - connection_refused
            - network_error
            - rate_limited
            - unexpected_status
            - unknown
            - ""
          type: string
        error_message:
          description: Human-readable failure reason for this attempt.
          type: string
        response_code:
          description: HTTP status code returned by the endpoint on this attempt.
          format: int64
          type: integer
        response_time:
          description: Round-trip time of this attempt, in milliseconds.
          format: int64
          type: integer
        success:
          description: Whether this attempt succeeded (matched an expected status code).
          type: boolean
        timestamp:
          description: When this attempt was made, RFC3339.
          type: string
      required:
        - success
        - response_time
        - response_code
        - timestamp
      type: object
    AttemptsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AttemptsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/AttemptItem"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    BatchJobOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BatchJobOutputBody.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        expires_at:
          description: When the job's underlying snapshot expires, RFC3339.
          type: string
        failed:
          description: Items that failed to process.
          format: int64
          type: integer
        id:
          description: Batch job id (UUID) — the repush_id/retry_id used elsewhere.
          type: string
        job_type:
          description: Which batch operation this job performs.
          enum:
            - event_repush
            - delivery_retry
          type: string
        namespace:
          description: Tenant namespace the job runs in.
          type: string
        processed:
          description: Items processed so far (successes + failures).
          format: int64
          type: integer
        status:
          description: Current job status.
          enum:
            - pending
            - processing
            - completed
            - failed
            - cancelled
          type: string
        total:
          description: Total items in the batch snapshot.
          format: int64
          type: integer
      required:
        - id
        - namespace
        - job_type
        - status
        - total
        - processed
        - failed
        - created_at
        - expires_at
      type: object
    CreateSubscriptionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateSubscriptionBody.json
          format: uri
          readOnly: true
          type: string
        event_name:
          description: Event type name to subscribe to, or "*" to receive every event in the namespace (catch-all).
          type: string
        headers:
          additionalProperties:
            type: string
          description: Extra HTTP headers to send with deliveries created by this subscription, merged with the webhook's own headers.
          type: object
        label_filters:
          additionalProperties:
            type: string
          description: Key/value pairs that must ALL be present in an event's labels for this subscription to receive it. Empty means match every event of event_name.
          type: object
        method:
          description: HTTP method used for deliveries from this subscription. Defaults to POST.
          type: string
        timeout:
          description: Per-delivery request timeout in seconds, overriding the webhook's default.
          format: int64
          type: integer
        transform_enabled:
          description: Whether to render transform_template into the delivered payload instead of sending the raw event payload.
          type: boolean
        transform_template:
          description: Go template rendered against the event to produce the delivered body. See GET /v1/template-functions for available helpers; test it with POST /v1/subscriptions:testTemplate.
          type: string
        webhook_id:
          description: Webhook to deliver matching events to.
          type: string
      required:
        - webhook_id
        - event_name
      type: object
    DeliveryItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeliveryItem.json
          format: uri
          readOnly: true
          type: string
        attempt_count:
          description: Number of delivery attempts made so far.
          format: int64
          type: integer
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        delivery_id:
          description: Delivery id (UUID).
          type: string
        error_category:
          description: Failure classification from the most recent attempt, used to decide retryability.
          enum:
            - success
            - client_error
            - server_error
            - timeout
            - dns_error
            - tls_error
            - connection_refused
            - network_error
            - rate_limited
            - unexpected_status
            - unknown
            - ""
          type: string
        error_message:
          description: Human-readable failure reason from the most recent attempt.
          type: string
        event_id:
          description: Pushed event occurrence this delivery originated from.
          type: string
        last_attempted_at:
          description: Timestamp of the most recent attempt, RFC3339.
          type: string
        max_attempts:
          description: Maximum attempts allowed before the delivery is marked failed.
          format: int64
          type: integer
        next_retry_at:
          description: Timestamp of the next scheduled retry, RFC3339, if one is pending.
          type: string
        response_body:
          description: Endpoint response body from the most recent attempt, if capture_response_body is enabled.
          type: string
        response_code:
          description: HTTP status code returned by the endpoint on the most recent attempt, if any.
          format: int64
          type: integer
        status:
          description: Current delivery status.
          enum:
            - pending
            - sending
            - success
            - failed
            - retrying
            - expired
          type: string
        webhook_id:
          description: Webhook this delivery was sent to.
          type: string
      required:
        - delivery_id
        - webhook_id
        - event_id
        - status
        - attempt_count
        - max_attempts
        - created_at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    EventOccurrenceItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventOccurrenceItem.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When this occurrence was pushed, RFC3339.
          type: string
        event:
          description: Event type name.
          type: string
        event_id:
          description: Event occurrence id (UUID).
          type: string
        failed_deliveries:
          description: Deliveries that failed (exhausted retries or non-retryable error).
          format: int32
          type: integer
        labels:
          additionalProperties:
            type: string
          description: Key/value labels used to match against subscription label filters.
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata stored with the occurrence.
          type: object
        namespace:
          description: Tenant namespace this occurrence was pushed into.
          type: string
        payload:
          additionalProperties: {}
          description: The pushed payload.
          type: object
        pending_deliveries:
          description: Deliveries still pending or retrying.
          format: int32
          type: integer
        schema_valid:
          description: Whether the payload validated against the event type's JSON Schema at push time.
          type: boolean
        successful_deliveries:
          description: Deliveries that succeeded.
          format: int32
          type: integer
        webhook_count:
          description: Number of webhooks whose subscriptions matched this occurrence.
          format: int32
          type: integer
      required:
        - event_id
        - namespace
        - event
        - payload
        - schema_valid
        - webhook_count
        - successful_deliveries
        - failed_deliveries
        - pending_deliveries
        - created_at
      type: object
    EventTypeBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeBody.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether events of this type can be pushed. Defaults to true.
          type: boolean
        description:
          description: Human-readable summary of what this event represents.
          type: string
        event_schema:
          additionalProperties: {}
          description: "Optional JSON Schema for the payload. Validation is soft: non-conforming payloads are still accepted, with warnings returned from the push call."
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata for your own tooling.
          type: object
        name:
          description: Unique event type name, e.g. order.created. Immutable after creation.
          type: string
      type: object
    EventTypeItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeItem.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether events of this type can currently be pushed.
          type: boolean
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        description:
          description: Human-readable summary of what this event represents.
          type: string
        event_schema:
          additionalProperties: {}
          description: JSON Schema payloads are softly validated against, if one is registered.
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata.
          type: object
        name:
          description: Event type name, e.g. order.created.
          type: string
        sample_payload:
          additionalProperties: {}
          description: Example payload derived from the schema, used to preview subscription transform templates.
          type: object
        updated_at:
          description: Last-modified timestamp, RFC3339.
          type: string
      required:
        - name
        - active
        - created_at
        - updated_at
      type: object
    HealthSummaryOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthSummaryOutputBody.json
          format: uri
          readOnly: true
          type: string
        degraded_count:
          description: Webhooks currently degraded, across all namespaces.
          format: int64
          type: integer
        healthy_count:
          description: Webhooks currently healthy, across all namespaces.
          format: int64
          type: integer
        unhealthy_count:
          description: Webhooks currently unhealthy, across all namespaces.
          format: int64
          type: integer
        unknown_count:
          description: Webhooks with no recent delivery attempts, across all namespaces.
          format: int64
          type: integer
      required:
        - healthy_count
        - degraded_count
        - unhealthy_count
        - unknown_count
      type: object
    ListDeliveriesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListDeliveriesOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/DeliveryItem"
          type:
            - array
            - "null"
        pagination:
          $ref: "#/components/schemas/PaginationOutput"
        retry_id:
          description: Snapshot id for the batch retry endpoint, present when prepare_retry was set.
          type: string
      required:
        - items
        - pagination
      type: object
    ListEventOccurrencesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListEventOccurrencesOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/EventOccurrenceItem"
          type:
            - array
            - "null"
        pagination:
          $ref: "#/components/schemas/PaginationOutput"
        repush_id:
          description: Snapshot id for the batch re-push endpoint, present when prepare_repush was set.
          type: string
      required:
        - items
        - pagination
      type: object
    ListEventTypesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListEventTypesOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/EventTypeItem"
          type:
            - array
            - "null"
        pagination:
          $ref: "#/components/schemas/PaginationOutput"
      required:
        - items
        - pagination
      type: object
    ListSubscriptionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListSubscriptionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/SubscriptionItem"
          type:
            - array
            - "null"
        pagination:
          $ref: "#/components/schemas/PaginationOutput"
      required:
        - items
        - pagination
      type: object
    ListWebhooksOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListWebhooksOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/WebhookOut"
          type:
            - array
            - "null"
        pagination:
          $ref: "#/components/schemas/PaginationOutput"
      required:
        - items
        - pagination
      type: object
    NamespaceStatsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/NamespaceStatsOutputBody.json
          format: uri
          readOnly: true
          type: string
        active_webhooks:
          description: Webhooks currently active (not paused).
          format: int64
          type: integer
        failed_deliveries:
          description: Deliveries that failed.
          format: int64
          type: integer
        pending_deliveries:
          description: Deliveries pending or retrying.
          format: int64
          type: integer
        success_rate:
          description: Overall success rate, 0.0 to 1.0.
          format: double
          type: number
        successful_deliveries:
          description: Deliveries that succeeded.
          format: int64
          type: integer
        total_deliveries:
          description: Total delivery attempts recorded.
          format: int64
          type: integer
        total_webhooks:
          description: Total webhooks registered.
          format: int64
          type: integer
      required:
        - total_webhooks
        - active_webhooks
        - total_deliveries
        - successful_deliveries
        - failed_deliveries
        - pending_deliveries
        - success_rate
      type: object
    PaginationOutput:
      additionalProperties: false
      properties:
        has_more:
          type: boolean
        limit:
          format: int32
          type: integer
        offset:
          format: int32
          type: integer
        total_count:
          format: int32
          type: integer
      required:
        - limit
        - offset
        - total_count
        - has_more
      type: object
    PatchSubscriptionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PatchSubscriptionBody.json
          format: uri
          readOnly: true
          type: string
        headers:
          additionalProperties:
            type: string
          description: Replace the extra HTTP headers.
          type: object
        label_filters:
          additionalProperties:
            type: string
          description: Replace the label filters.
          type: object
        method:
          description: Replace the HTTP method.
          type: string
        timeout:
          description: Replace the per-delivery timeout override, in seconds.
          format: int64
          type: integer
        transform_enabled:
          description: Enable or disable payload transformation.
          type: boolean
        transform_template:
          description: Replace the transform template.
          type: string
      type: object
    PatchWebhookBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PatchWebhookBody.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Enable or disable the webhook.
          type: boolean
        description:
          description: Replace the human-readable description.
          type: string
        events:
          description: Replace the full set of subscribed event type names.
          items:
            type: string
          type: array
        headers:
          additionalProperties:
            type: string
          description: Replace the static headers sent with every delivery.
          type: object
        http_config:
          $ref: "#/components/schemas/WebhookHTTPConfig"
          description: Replace the HTTP delivery configuration.
        secret_headers:
          additionalProperties:
            type: string
          description: Replace the encrypted, masked-on-read secret headers.
          type: object
        signature_type:
          description: Replace the authoritative signature algorithm (hmac or ed25519).
          type: string
        timeout:
          description: Replace the request timeout in seconds (equivalent to http_config.request_timeout_seconds).
          format: int64
          type: integer
        url:
          description: Replace the delivery endpoint URL.
          type: string
      type: object
    PushEventBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PushEventBody.json
          format: uri
          readOnly: true
          type: string
        idempotency_key:
          description: Optional client-supplied key; re-pushing with the same key returns the original event instead of creating a duplicate.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Key/value labels a subscription's label filters can match against to select which subscribers receive this occurrence.
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata stored with the occurrence.
          type: object
        payload:
          additionalProperties: {}
          description: Event payload, validated (softly) against the event type's JSON Schema if one is registered.
          type: object
        ttl_seconds:
          description: Optional time-to-live in seconds; deliveries are no longer attempted after this expires.
          format: int64
          type: integer
      required:
        - payload
      type: object
    PushEventOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PushEventOutputBody.json
          format: uri
          readOnly: true
          type: string
        duplicate:
          description: True when idempotency_key matched an existing event occurrence; no new event or deliveries were created.
          type: boolean
        event_id:
          description: Id (UUID) of the created event occurrence. When duplicate is true, this is the id of the PREVIOUSLY created event, not a new one.
          type: string
        schema_valid:
          description: Whether the payload validated against the event type's JSON Schema. False does not mean the push was rejected — see warnings.
          type: boolean
        warnings:
          description: Non-fatal schema validation warnings. The event is stored and delivered regardless.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - event_id
        - duplicate
        - schema_valid
      type: object
    RegisterWebhookBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RegisterWebhookBody.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether the webhook receives deliveries. Defaults to true. Inactive webhooks accept no new deliveries but keep their history.
          type: boolean
        description:
          description: Free-text note for humans, e.g. which system or team owns this endpoint.
          type: string
        events:
          description: Event type names this webhook should receive; auto-creates one subscription per entry. Use "*" as the sole entry to subscribe to every event in the namespace. Omit or leave empty to register the webhook with no subscriptions, then attach them individually via POST .../subscriptions (e.g. to set a per-subscription transform_template).
          items:
            type: string
          type:
            - array
            - "null"
        headers:
          additionalProperties: {}
          description: Static HTTP headers sent with every delivery to this webhook.
          type: object
        http_config:
          $ref: "#/components/schemas/WebhookHTTPConfig"
          description: Per-webhook HTTP delivery tuning (retries, timeouts, rate limit). Falls back to server defaults for any field left unset.
        rate_limit_rps:
          description: Maximum sustained delivery rate to this webhook, in requests per second. Excess deliveries queue and are sent once the leaky bucket has capacity.
          format: double
          type: number
        secret_headers:
          additionalProperties:
            type: string
          description: HTTP headers whose values are envelope-encrypted at rest and masked in every API response (e.g. an upstream auth token).
          type: object
        signature_type:
          description: Which signature algorithm to require verification against. Every delivery is always dual-signed (HMAC-SHA256 and Ed25519, Standard Webhooks format); this only changes which one is treated as authoritative. Defaults to hmac.
          enum:
            - hmac
            - ed25519
            - ""
          type: string
        url:
          description: HTTPS/HTTP endpoint to POST deliveries to. Private, loopback, and cloud metadata addresses are rejected (SSRF protection).
          format: uri
          type: string
      required:
        - url
      type: object
    RepushBatchInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RepushBatchInputBody.json
          format: uri
          readOnly: true
          type: string
        repush_id:
          description: Snapshot id from an earlier prepare_repush=true or prepare_retry=true list call.
          type: string
      required:
        - repush_id
      type: object
    RepushEventOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RepushEventOutputBody.json
          format: uri
          readOnly: true
          type: string
        event_id:
          description: Id of the re-pushed event occurrence (same id, replayed).
          type: string
        warnings:
          description: Non-fatal schema validation warnings from re-validating the stored payload.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - event_id
      type: object
    RetryDeliveriesByWebhookInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RetryDeliveriesByWebhookInputBody.json
          format: uri
          readOnly: true
          type: string
        force:
          description: If true, also retry deliveries that already exhausted their max attempts.
          type: boolean
        webhook_id:
          description: Retry every eligible delivery for this webhook.
          type: string
      required:
        - webhook_id
      type: object
    RetryOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RetryOutputBody.json
          format: uri
          readOnly: true
          type: string
        count:
          description: Number of deliveries retried.
          format: int32
          type: integer
        delivery_ids:
          description: Ids of the deliveries that were retried.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - count
      type: object
    SubscriptionItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SubscriptionItem.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        event_name:
          description: Event type name this subscription matches, or "*" for catch-all.
          type: string
        headers:
          additionalProperties:
            type: string
          description: Extra HTTP headers sent with deliveries from this subscription.
          type: object
        label_filters:
          additionalProperties:
            type: string
          description: Key/value pairs that must all be present in an event's labels for this subscription to receive it.
          type: object
        method:
          description: HTTP method used for deliveries from this subscription.
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          type: string
        namespace:
          description: Tenant namespace this subscription belongs to.
          type: string
        subscription_id:
          description: Subscription id (UUID).
          type: string
        timeout:
          description: Per-delivery request timeout in seconds, overriding the webhook's default.
          format: int64
          type: integer
        transform_enabled:
          description: Whether transform_template is rendered into the delivered payload.
          type: boolean
        transform_template:
          description: Go template rendered against the event to produce the delivered body.
          type: string
        updated_at:
          description: Last-modified timestamp, RFC3339.
          type: string
        webhook_id:
          description: Webhook this subscription delivers to.
          type: string
      required:
        - subscription_id
        - namespace
        - webhook_id
        - event_name
        - transform_enabled
        - created_at
        - updated_at
      type: object
    TemplateFunctionItem:
      additionalProperties: false
      properties:
        description:
          description: Markdown documentation for the function, including usage and an example.
          type: string
        name:
          description: Function name, as used in a transform_template.
          type: string
      required:
        - name
        - description
      type: object
    TemplateFunctionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TemplateFunctionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/TemplateFunctionItem"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    TestTemplateBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TestTemplateBody.json
          format: uri
          readOnly: true
          type: string
        event_name:
          description: Registered event type whose sample payload the template is rendered against.
          type: string
        template:
          description: Go template to render, in the same syntax used by transform_template.
          type: string
      required:
        - event_name
        - template
      type: object
    TestTemplateOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TestTemplateOutputBody.json
          format: uri
          readOnly: true
          type: string
        rendered:
          description: The template rendered against the event type's sample payload.
          type: string
      required:
        - rendered
      type: object
    WebhookHTTPConfig:
      additionalProperties: false
      properties:
        capture_response_body:
          description: Whether to store the endpoint's response body alongside each delivery attempt, for debugging.
          type: boolean
        content_type:
          description: Content-Type header sent with deliveries. Defaults to application/json.
          type: string
        expected_status_codes:
          description: HTTP status codes treated as a successful delivery. Defaults to 2xx if left empty.
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        follow_redirects:
          description: Whether to follow HTTP redirects returned by the endpoint.
          type: boolean
        max_retries:
          description: Maximum delivery attempts before a delivery is marked failed.
          format: int64
          type: integer
        rate_limit_rps:
          description: Per-webhook delivery rate limit override, in requests per second.
          format: double
          type: number
        request_timeout_seconds:
          description: How long to wait for the endpoint to respond before treating the attempt as a timeout.
          format: int64
          type: integer
        retry_backoff_seconds:
          description: Base delay between retry attempts, in seconds. Backoff grows exponentially from this value.
          format: int64
          type: integer
        user_agent:
          description: Custom User-Agent header sent with deliveries.
          type: string
        verify_ssl:
          description: Whether to verify the endpoint's TLS certificate. Disable only for trusted internal endpoints with self-signed certs.
          type: boolean
      type: object
    WebhookHTTPConfigOut:
      additionalProperties: false
      properties:
        capture_response_body:
          description: Whether the endpoint's response body is stored with each delivery attempt.
          type: boolean
        content_type:
          description: Content-Type header sent with deliveries.
          type: string
        expected_status_codes:
          description: HTTP status codes treated as a successful delivery; 2xx if empty.
          items:
            format: int32
            type: integer
          type:
            - array
            - "null"
        follow_redirects:
          description: Whether HTTP redirects returned by the endpoint are followed.
          type: boolean
        max_retries:
          description: Maximum delivery attempts before a delivery is marked failed.
          format: int64
          type: integer
        rate_limit_rps:
          description: Delivery rate limit for this webhook, in requests per second.
          format: double
          type: number
        request_timeout_seconds:
          description: Per-attempt request timeout, in seconds.
          format: int64
          type: integer
        retry_backoff_seconds:
          description: Base delay between retry attempts, in seconds.
          format: int64
          type: integer
        user_agent:
          description: User-Agent header sent with deliveries.
          type: string
        verify_ssl:
          description: Whether the endpoint's TLS certificate is verified.
          type: boolean
        webhook_secret:
          description: HMAC signing secret. Shown in full only once, in the response to webhook registration; masked on every later read.
          type: string
      required:
        - max_retries
        - retry_backoff_seconds
        - capture_response_body
        - follow_redirects
        - verify_ssl
        - request_timeout_seconds
      type: object
    WebhookHealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WebhookHealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        avg_response_time:
          description: Average endpoint response time, in milliseconds.
          format: int64
          type: integer
        client_errors:
          description: Count of 4xx failures.
          format: int64
          type: integer
        consecutive_failures:
          description: Current streak of consecutive failed deliveries; resets on success.
          format: int64
          type: integer
        failed_deliveries:
          description: Deliveries that failed.
          format: int64
          type: integer
        health:
          description: Computed rolling health status.
          enum:
            - healthy
            - degraded
            - unhealthy
            - unknown
          type: string
        network_errors:
          description: Count of other network-level failures (DNS, TLS, connection refused, reset).
          format: int64
          type: integer
        server_errors:
          description: Count of 5xx failures.
          format: int64
          type: integer
        success_rate:
          description: Rolling success rate, 0.0 to 1.0.
          format: double
          type: number
        successful_deliveries:
          description: Deliveries that succeeded.
          format: int64
          type: integer
        timeout_errors:
          description: Count of request/connection timeout failures.
          format: int64
          type: integer
        total_deliveries:
          description: Total deliveries recorded for this webhook.
          format: int64
          type: integer
        unexpected_status_errors:
          description: Count of responses outside the webhook's configured expected_status_codes.
          format: int64
          type: integer
        webhook_id:
          description: Webhook id (UUID).
          type: string
      required:
        - webhook_id
        - health
        - total_deliveries
        - successful_deliveries
        - failed_deliveries
        - consecutive_failures
        - success_rate
        - avg_response_time
        - client_errors
        - server_errors
        - timeout_errors
        - network_errors
        - unexpected_status_errors
      type: object
    WebhookOut:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WebhookOut.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether the webhook currently receives deliveries.
          type: boolean
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        description:
          description: Human-readable note about this webhook.
          type: string
        events:
          description: Event type names this webhook is currently subscribed to, derived from its subscriptions.
          items:
            type: string
          type:
            - array
            - "null"
        headers:
          additionalProperties:
            type: string
          description: Static HTTP headers sent with every delivery.
          type: object
        health:
          description: Computed rolling health status.
          enum:
            - healthy
            - degraded
            - unhealthy
            - unknown
          type: string
        http_config:
          $ref: "#/components/schemas/WebhookHTTPConfigOut"
          description: Per-webhook HTTP delivery configuration.
        namespace:
          description: Tenant namespace this webhook belongs to.
          type: string
        secret_headers:
          additionalProperties:
            type: string
          description: Encrypted secret header names, with values always masked.
          type: object
        signature_type:
          description: Which signature algorithm (hmac or ed25519) is treated as authoritative. Every delivery is always dual-signed with both.
          enum:
            - hmac
            - ed25519
          type: string
        signing_public_key:
          description: Ed25519 public key for verifying the v1a, delivery signature. Safe to expose; there is no private-key equivalent to mask.
          type: string
        updated_at:
          description: Last-modified timestamp, RFC3339.
          type: string
        url:
          description: HTTP endpoint deliveries are POSTed to.
          type: string
        webhook_id:
          description: Webhook id (UUID).
          type: string
      required:
        - webhook_id
        - namespace
        - events
        - url
        - active
        - health
        - signature_type
        - http_config
        - created_at
        - updated_at
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Required only when the server is started with SPARROW_API_KEY set; otherwise all endpoints are open.
      in: header
      name: X-API-Key
      type: apiKey
info:
  contact:
    name: Sparrow
    url: https://github.com/sarathsp06/sparrow
  description: |-
    Sparrow is a self-hosted webhook delivery platform: register the events your system produces, register the webhooks that should receive them, then push event occurrences and Sparrow fans them out with retries and health tracking.

    ## Concepts

    - **Event type** (`Event Types`) — a named, versioned schema for something that happened in your system, e.g. `order.created`. Optional JSON Schema validation is *soft*: invalid payloads are stored with warnings, never rejected.
    - **Event** (`Events`) — one occurrence of an event type, pushed with a payload. Pushing an event asynchronously fans it out to every matching subscription.
    - **Webhook** (`Webhooks`) — a registered HTTP endpoint plus its delivery configuration (retries, timeouts, signing). Every delivery is signed with HMAC-SHA256 and Ed25519.
    - **Subscription** (`Subscriptions`) — links one webhook to one event type within a namespace, optionally with a Go-template payload transform and label filters. Registering a webhook auto-creates matching subscriptions.
    - **Delivery** (`Deliveries`) — one attempt (and its retry history) to send an event to a webhook. Failures are classified as retryable (5xx, timeout, network) or not (4xx, DNS, TLS).
    - **Health** (`Health`) — a rolling per-webhook status (healthy/degraded/unhealthy) computed from recent delivery outcomes.

    ## Namespaces

    Webhooks, events, subscriptions, and deliveries are scoped to a `namespace` path segment (defaults to `default` if you don't need multi-tenancy). A handful of read endpoints are deliberately global (no namespace) for cross-tenant dashboards and id-only lookups where the resource id is already globally unique.

    ## Authentication

    Optional. When the server is started with `SPARROW_API_KEY` set, every `/v1/*` request must include it in the `X-API-Key` header. When unset, all endpoints are open.
  license:
    identifier: MIT
    name: MIT
  title: Sparrow
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/deliveries/{delivery_id}:
    get:
      description: Namespace-agnostic lookup by delivery id, for callers that only have the id (e.g. a webhook-signature verification failure report) and don't know which namespace it belongs to.
      operationId: getDeliveryGlobal
      parameters:
        - in: path
          name: delivery_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryItem"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a delivery by id (any namespace)
      tags:
        - Deliveries
  /v1/deliveries/{delivery_id}/attempts:
    get:
      description: Namespace-agnostic variant of getDeliveryAttempts.
      operationId: getDeliveryAttemptsGlobal
      parameters:
        - in: path
          name: delivery_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptsOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a delivery's per-attempt history (any namespace)
      tags:
        - Deliveries
  /v1/deliveries/{delivery_id}:retry:
    post:
      description: Namespace-agnostic variant of retryDelivery.
      operationId: retryDeliveryGlobal
      parameters:
        - in: path
          name: delivery_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Retry a single delivery (any namespace)
      tags:
        - Deliveries
  /v1/event-types:
    get:
      description: Lists registered event types, optionally filtered to only active ones.
      operationId: listEventTypes
      parameters:
        - description: Only return active event types.
          explode: false
          in: query
          name: active_only
          schema:
            default: false
            description: Only return active event types.
            type: boolean
        - description: Maximum items to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return.
            format: int32
            type: integer
        - description: Number of items to skip, for pagination.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip, for pagination.
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEventTypesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List event type definitions
      tags:
        - Event Types
    post:
      description: Defines a named event type, optionally with a JSON Schema. Subscriptions reference event types by name; pushing an event requires that its type already be registered.
      operationId: registerEventType
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventTypeBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTypeItem"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Register an event type definition
      tags:
        - Event Types
  /v1/event-types/{name}:
    delete:
      description: Permanently deletes an event type definition. Existing pushed occurrences of this type are not deleted.
      operationId: deleteEventType
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Delete an event type definition
      tags:
        - Event Types
    get:
      description: Fetches one event type's schema, sample payload, and metadata.
      operationId: getEventType
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTypeItem"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get an event type by name
      tags:
        - Event Types
    patch:
      description: "Merge-patches an event type: only fields present in the request body are changed."
      operationId: updateEventType
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventTypeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTypeItem"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Update an event type definition
      tags:
        - Event Types
  /v1/events/{event_id}:
    get:
      description: Fetches one event occurrence's payload, labels, and delivery outcome counts. Event ids are globally unique, so no namespace is required.
      operationId: getEventOccurrence
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventOccurrenceItem"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a pushed event occurrence by id
      tags:
        - Events
  /v1/events/{event_id}:repush:
    post:
      description: "Re-runs fan-out for one already-pushed event occurrence: matches subscriptions again and creates new deliveries. Useful after fixing a subscription or webhook that was misconfigured."
      operationId: repushEvent
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepushEventOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Replay a single pushed event occurrence
      tags:
        - Events
  /v1/health-summary:
    get:
      description: Returns how many webhooks are currently healthy, degraded, unhealthy, or unknown, across every namespace — for a top-level dashboard tile.
      operationId: getHealthSummary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummaryOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get aggregate webhook health counts across all namespaces
      tags:
        - Health
  /v1/namespaces/{namespace}/deliveries:
    get:
      description: Lists deliveries in a namespace, optionally filtered by webhook, event occurrence, or status. Set prepare_retry to snapshot the filtered set for the batch retry endpoint.
      operationId: listDeliveries
      parameters:
        - description: Tenant namespace to list deliveries in.
          in: path
          name: namespace
          required: true
          schema:
            description: Tenant namespace to list deliveries in.
            type: string
        - description: Filter to deliveries for one webhook.
          explode: false
          in: query
          name: webhook_id
          schema:
            description: Filter to deliveries for one webhook.
            type: string
        - description: Filter to deliveries for one pushed event occurrence.
          explode: false
          in: query
          name: event_id
          schema:
            description: Filter to deliveries for one pushed event occurrence.
            type: string
        - description: Filter by delivery status (e.g. pending, success, failed, retrying).
          explode: false
          in: query
          name: status
          schema:
            description: Filter by delivery status (e.g. pending, success, failed, retrying).
            type: string
        - description: If true, snapshot the matching deliveries into a retry_id you can pass to the batch retry endpoint.
          explode: false
          in: query
          name: prepare_retry
          schema:
            default: false
            description: If true, snapshot the matching deliveries into a retry_id you can pass to the batch retry endpoint.
            type: boolean
        - description: Maximum items to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return.
            format: int32
            type: integer
        - description: Number of items to skip, for pagination.
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Number of items to skip, for pagination.
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeliveriesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List deliveries
      tags:
        - Deliveries
  /v1/namespaces/{namespace}/deliveries/{delivery_id}:
    get:
      description: Fetches one delivery's status, response code/body, and error classification.
      operationId: getDelivery
      parameters:
        - description: Tenant namespace the delivery belongs to.
          in: path
          name: namespace
          required: true
          schema:
            description: Tenant namespace the delivery belongs to.
            type: string
        - description: Delivery id (UUID).
          in: path
          name: delivery_id
          required: true
          schema:
            description: Delivery id (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryItem"
