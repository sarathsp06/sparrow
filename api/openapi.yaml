          type: string
        expires_at:
          description: "Null: never expires."
          format: date-time
          type:
            - string
            - "null"
        id:
          description: Token id (not the secret).
          type: string
        last_used_at:
          description: Approximate (updated at most once a minute).
          format: date-time
          type:
            - string
            - "null"
        name:
          description: Who or what the token is for.
          type: string
        revoked_at:
          format: date-time
          type:
            - string
            - "null"
        status:
          enum:
            - active
            - revoked
            - expired
          type: string
      required:
        - id
        - name
        - consumer
        - status
        - created_by
        - created_at
        - expires_at
        - revoked_at
        - last_used_at
      type: object
    UpdateEventTypeOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateEventTypeOutputBody.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether events of this type can currently be pushed.
          type: boolean
        change:
          $ref: "#/components/schemas/EventTypeChange"
          description: What this update did.
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        description:
