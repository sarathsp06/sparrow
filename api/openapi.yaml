      description: |-
        Deletes the subscription and its template history. The webhook stops receiving that event's occurrences; delivery history is kept. Cannot be undone. A second delete returns 404.

        Portal tokens: allowed, as DELETE /portal/api/subscriptions/{subscription_id}.
