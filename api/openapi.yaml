    patch:
      description: |-
        Partially updates a subscription's headers, method, timeout, transform, or label filters: only fields present in the body change, and map fields replace the whole map. The linked webhook_id and event_name cannot be changed; delete and recreate instead. A changed transform_template is recorded as a new template version with template_source and template_notes. Returns the updated subscription. Idempotent: repeating the same body records no new version.

        400 for invalid values, or when the webhook has requires_transform and the result has no enabled template. 404 when it is not in this consumer.

        Portal tokens: allowed, as PATCH /portal/api/subscriptions/{subscription_id}.
      operationId: updateSubscription
      parameters:
        - description: Consumer the subscription belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer the subscription belongs to.
            type: string
        - description: Subscription id (UUID).
          in: path
          name: subscription_id
          required: true
          schema:
            description: Subscription id (UUID).
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSubscriptionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionItem"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Partially update a subscription
      tags:
        - Subscriptions
  /v1/consumers/{consumer}/subscriptions/{subscription_id}/templateVersions:
    get:
      description: |-
        Returns the transform templates this subscription has been saved with, newest first; the newest is the current one. A version is recorded whenever a save changes the template, with how it was produced (manual or ai_draft), an optional note, and who saved it. The last 20 are kept. There is no restore endpoint: load a version into the editor and save the subscription, which records it as a new version.

        Portal tokens: allowed, as GET /portal/api/subscriptions/{subscription_id}/templateVersions.
      operationId: listSubscriptionTemplateVersions
      parameters:
        - description: Consumer the subscription belongs to.
          in: path
