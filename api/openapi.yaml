  /v1/consumers/{consumer}/webhooks/{webhook_id}:pause:
    post:
      description: |-
        Stops deliveries to this webhook without deleting it. Returns 204 with no body. Events keep fanning out to it: each new delivery, and any queued or retrying one, is held with status paused until it is retried after resuming. Holding never affects the webhook's health. 409 when the webhook is already paused.

        Portal tokens: allowed, as POST /portal/api/webhooks/{webhook_id}:pause.
      operationId: pauseWebhook
      parameters:
        - description: Tenant consumer the webhook belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Tenant consumer the webhook belongs to.
            type: string
        - description: Webhook id (UUID).
          in: path
          name: webhook_id
          required: true
          schema:
            description: Webhook id (UUID).
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Pause a webhook
      tags:
        - Webhooks
  /v1/consumers/{consumer}/webhooks/{webhook_id}:resume:
    post:
      description: |-
        Re-enables deliveries to a webhook paused by an operator or auto-disabled, and clears auto_disabled_at/auto_disabled_reason. Deliveries held while it was paused stay paused and are never sent automatically: the response says how many there are, so you can retry them with status=paused&webhook_id=... and the delivery retry endpoints. 409 when the webhook is already active.

        Portal tokens: allowed, as POST /portal/api/webhooks/{webhook_id}:resume.
      operationId: resumeWebhook
      parameters:
        - description: Tenant consumer the webhook belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Tenant consumer the webhook belongs to.
            type: string
        - description: Webhook id (UUID).
          in: path
          name: webhook_id
          required: true
          schema:
            description: Webhook id (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeWebhookOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Resume a paused webhook
      tags:
        - Webhooks
  /v1/consumers/{consumer}/webhooks/{webhook_id}:rotateSecret:
    post:
      description: |-
        Replaces the webhook's HMAC signing secret with a newly generated one and returns it in plaintext. This response is the only time the new secret is shown; it is masked on every later read. There is no overlap window: every attempt made after the rotation, including retries of older deliveries, is signed with the new secret only, so update the receiver right away. Not idempotent: each call generates a new secret. The Ed25519 key, if any, is not rotated.

        Portal tokens: allowed, as POST /portal/api/webhooks/{webhook_id}:rotateSecret.
      operationId: rotateWebhookSecret
      parameters:
        - description: Tenant consumer the webhook belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Tenant consumer the webhook belongs to.
            type: string
        - description: Webhook id (UUID).
          in: path
          name: webhook_id
          required: true
          schema:
            description: Webhook id (UUID).
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateWebhookSecretOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Rotate a webhook's signing secret
      tags:
        - Webhooks
  /v1/deliveries:
    get:
      description: |-
        Lists deliveries across every consumer, newest first, with the same filters, cursor pagination and prepare_retry side effect as the per-consumer route. Pass consumer to scope to one consumer.

        Portal tokens: not allowed.
      operationId: listDeliveriesGlobal
      parameters:
        - description: Filter to one consumer; omit to list deliveries across all consumers.
          explode: false
          in: query
          name: consumer
          schema:
            description: Filter to one consumer; omit to list deliveries across all consumers.
            type: string
        - description: Filter to deliveries for one webhook (UUID; 400 otherwise).
          explode: false
          in: query
          name: webhook_id
          schema:
            description: Filter to deliveries for one webhook (UUID; 400 otherwise).
            type: string
        - description: Filter to deliveries for one pushed event occurrence (UUID; 400 otherwise).
          explode: false
          in: query
          name: event_id
          schema:
            description: Filter to deliveries for one pushed event occurrence (UUID; 400 otherwise).
            type: string
        - description: Filter by delivery status.
          explode: false
          in: query
          name: status
          schema:
            description: Filter by delivery status.
            enum:
              - pending
              - sending
              - success
              - failed
              - retrying
              - expired
              - paused
            type: string
        - description: Filter by the most recent attempt's error_category, e.g. server_error, client_error, timeout.
          explode: false
          in: query
          name: error_category
          schema:
            description: Filter by the most recent attempt's error_category, e.g. server_error, client_error, timeout.
            type: string
        - description: Filter to deliveries created by one subscription (UUID), e.g. its paused deliveries.
          explode: false
          in: query
          name: subscription_id
          schema:
            description: Filter to deliveries created by one subscription (UUID), e.g. its paused deliveries.
            type: string
        - description: Filter to deliveries of one event type, e.g. order.created. Also matches deliveries whose subscription has since been replaced or deleted.
          explode: false
          in: query
          name: event_name
          schema:
            description: Filter to deliveries of one event type, e.g. order.created. Also matches deliveries whose subscription has since been replaced or deleted.
            type: string
        - description: "Only deliveries created at or after this time: YYYY-MM-DD (start of that day, UTC) or an RFC3339 timestamp (e.g. an import's imported_at)."
          explode: false
          in: query
          name: created_after
          schema:
            description: "Only deliveries created at or after this time: YYYY-MM-DD (start of that day, UTC) or an RFC3339 timestamp (e.g. an import's imported_at)."
            type: string
        - description: "Only deliveries created at or before this time: YYYY-MM-DD (through the end of that day, UTC) or an RFC3339 timestamp."
          explode: false
          in: query
          name: created_before
          schema:
            description: "Only deliveries created at or before this time: YYYY-MM-DD (through the end of that day, UTC) or an RFC3339 timestamp."
            type: string
        - description: "Side effect: when true, also snapshots the ids of every delivery matching the filters (not just this page; at most 10,000, more is an error) into a batch job and returns its id as retry_id. Pass it to POST .../deliveries:retryBatch within 15 minutes. Each call creates a new snapshot."
          explode: false
          in: query
          name: prepare_retry
          schema:
            default: false
            description: "Side effect: when true, also snapshots the ids of every delivery matching the filters (not just this page; at most 10,000, more is an error) into a batch job and returns its id as retry_id. Pass it to POST .../deliveries:retryBatch within 15 minutes. Each call creates a new snapshot."
            type: boolean
        - description: Maximum items to return, 1 to 1000.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return, 1 to 1000.
            format: int32
            maximum: 1000
            minimum: 1
            type: integer
        - description: "Continue after the page this came from: pagination.next_cursor of the previous response. Stable while new deliveries arrive."
          explode: false
          in: query
          name: cursor
          schema:
            description: "Continue after the page this came from: pagination.next_cursor of the previous response. Stable while new deliveries arrive."
            type: string
        - description: "Removed: page with cursor. Any value other than 0 is rejected with 400, so a client still paging by offset fails loudly instead of re-reading the first page."
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: "Removed: page with cursor. Any value other than 0 is rejected with 400, so a client still paging by offset fails loudly instead of re-reading the first page."
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeliveriesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List deliveries across all consumers
      tags:
        - Deliveries
