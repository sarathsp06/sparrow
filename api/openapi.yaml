components:
  schemas:
    AlertConfigItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AlertConfigItem.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: Consumer this alert config belongs to.
          type: string
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        email:
          description: Recipient email address.
          type: string
        event_types:
          description: Sparrow system event types this recipient is alerted on.
          items:
            type: string
          type:
            - array
            - "null"
        id:
          description: Alert config id (UUID).
          type: string
        webhook_id:
          description: Webhook this alert is scoped to; omitted for consumer-wide alerts.
          type: string
      required:
        - id
        - consumer
        - email
        - event_types
        - created_at
      type: object
    AttemptItem:
      additionalProperties: false
      properties:
        error_category:
          description: Failure classification for this attempt.
          enum:
            - success
            - client_error
            - server_error
            - timeout
            - dns_error
            - tls_error
            - connection_refused
            - network_error
            - rate_limited
            - unexpected_status
            - template_error
            - unknown
            - ""
          type: string
        error_message:
          description: Human-readable failure reason for this attempt.
          type: string
        response_code:
          description: HTTP status code returned by the endpoint on this attempt.
          format: int64
          type: integer
        response_time:
          description: Round-trip time of this attempt, in milliseconds.
          format: int64
          type: integer
        success:
          description: Whether this attempt succeeded (matched an expected status code).
          type: boolean
        timestamp:
          description: When this attempt was made, RFC3339.
          type: string
      required:
        - success
        - response_time
        - response_code
        - timestamp
      type: object
    AttemptsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AttemptsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/AttemptItem"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    BatchJobOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BatchJobOutputBody.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: Tenant consumer the job runs in.
          type: string
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        expires_at:
          description: When the job's underlying snapshot expires, RFC3339.
          type: string
        failed:
          description: Items that failed to process.
          format: int64
          type: integer
        id:
          description: Batch job id (UUID) — the repush_id/retry_id used elsewhere.
          type: string
        job_type:
          description: Which batch operation this job performs.
          enum:
            - event_repush
            - delivery_retry
          type: string
        processed:
          description: Items processed so far (successes + failures).
          format: int64
          type: integer
        status:
          description: Current job status.
          enum:
            - pending
            - processing
            - completed
            - failed
            - cancelled
          type: string
        total:
          description: Total items in the batch snapshot.
          format: int64
          type: integer
      required:
        - id
        - consumer
        - job_type
        - status
        - total
        - processed
        - failed
        - created_at
        - expires_at
      type: object
    BundleItem:
      additionalProperties: false
      properties:
        active:
          description: Whether events of this type can be pushed. Omitted means true.
          type: boolean
        description:
          description: "Human-readable summary. Omitted means empty: an import replaces the definition."
          type: string
        event_schema:
          additionalProperties: {}
          description: JSON Schema. Omitted means no schema, which removes an existing schema (a breaking change).
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata. Omitted means none.
          type: object
        name:
          description: Event type name.
          maxLength: 255
          minLength: 1
          type: string
      required:
        - name
      type: object
    BundleStampBody:
      additionalProperties: false
      properties:
        format:
          description: Bundle format number.
          format: int64
          type: integer
        sha256:
          description: sha256 of the canonical encoding of items, to tell whether they changed after export.
          type: string
        sparrow_version:
          description: Version of the Sparrow server that exported the bundle.
          type: string
      required:
        - sparrow_version
        - format
        - sha256
      type: object
    ConsumerStatsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConsumerStatsOutputBody.json
          format: uri
          readOnly: true
          type: string
        active_webhooks:
          description: Webhooks currently active (not paused).
          format: int64
          type: integer
        failed_deliveries:
          description: Deliveries that failed.
          format: int64
          type: integer
        pending_deliveries:
          description: Deliveries pending or retrying.
          format: int64
          type: integer
        success_rate:
          description: Overall success rate, 0.0 to 1.0.
          format: double
          type: number
        successful_deliveries:
          description: Deliveries that succeeded.
          format: int64
          type: integer
        total_deliveries:
          description: Total delivery attempts recorded.
          format: int64
          type: integer
        total_webhooks:
          description: Total webhooks registered.
          format: int64
          type: integer
      required:
        - total_webhooks
        - active_webhooks
        - total_deliveries
        - successful_deliveries
        - failed_deliveries
        - pending_deliveries
        - success_rate
      type: object
    CreateAlertConfigBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateAlertConfigBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Recipient email address.
          format: email
          type: string
        event_types:
          description: "Sparrow system event types to alert on: sparrow.webhook.health_changed, sparrow.webhook.delivery_failed."
          items:
            type: string
          type:
            - array
            - "null"
        webhook_id:
          description: Scope the alert to one webhook. Omit for a consumer-wide alert covering every webhook.
          type: string
      required:
        - email
        - event_types
      type: object
    CreateInviteBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateInviteBody.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: Invite into one consumer's portal. Omit for tenant-wide (operator console) access.
          type: string
        name:
          description: Name for the token the invite creates, e.g. the invitee's name.
          maxLength: 200
          minLength: 1
          type: string
        token_never_expires:
          description: The token it creates never expires; same rules as never_expires on POST /v1/tokens.
          type: boolean
        token_ttl_seconds:
          description: Lifetime of the token it creates; same defaults and limits as POST /v1/tokens.
          format: int64
          minimum: 0
          type: integer
        ttl_seconds:
          description: How long the invite can be used. Defaults to 24 hours, at most 7 days.
          format: int64
          minimum: 0
          type: integer
      required:
        - name
      type: object
    CreateInviteOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateInviteOutputBody.json
          format: uri
          readOnly: true
          type: string
        invite:
          $ref: "#/components/schemas/InviteOut"
        path:
          description: UI-relative link with the secret in the fragment (never sent to servers or logs). Prepend the base URL the UI is served from.
          type: string
        secret:
          description: The invite secret. Shown only in this response.
          type: string
      required:
        - invite
        - secret
        - path
      type: object
    CreateSubscriptionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateSubscriptionBody.json
          format: uri
          readOnly: true
          type: string
        event_name:
          description: Event type name to subscribe to, or "*" to receive every event in the consumer (catch-all).
          type: string
        headers:
          additionalProperties:
            type: string
          description: Extra HTTP headers to send with deliveries created by this subscription, merged with the webhook's own headers.
          type: object
        label_filters:
          additionalProperties:
            type: string
          description: Key/value pairs that must ALL be present in an event's labels for this subscription to receive it. Empty means match every event of event_name.
          type: object
        method:
          description: HTTP method used for deliveries from this subscription. Defaults to POST.
          type: string
        on_transform_error:
          description: "What happens when transform_template fails to render. fail (default): the delivery fails with error category template_error, is not retried automatically, and can be retried once the template is fixed; it does not affect the webhook's health. fallback: the default envelope payload is sent instead, and the error is still recorded on the delivery."
          enum:
            - fail
            - fallback
          type: string
        template_missing_key:
          description: "How transform_template reads a key the payload does not have. error (default): the render fails, so a field removed from the event schema cannot silently turn into \"<no value>\" in the body; read optional fields with index or dig (default only fills a key that is present but empty). zero: the key renders as \"<no value>\"."
          enum:
            - error
            - zero
          type: string
        timeout:
          description: Per-delivery request timeout in seconds, overriding the webhook's default.
          format: int64
          type: integer
        transform_enabled:
          description: Whether to render transform_template into the delivered payload instead of sending the raw event payload.
          type: boolean
        transform_template:
          description: Go template rendered against the event to produce the delivered body. See GET /v1/template-functions for available helpers; test it with POST /v1/subscriptions:testTemplate.
          type: string
        webhook_id:
          description: Webhook to deliver matching events to.
          type: string
      required:
        - webhook_id
        - event_name
      type: object
    CreateTokenBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateTokenBody.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: Limit the token to one consumer (portal API only). Omit for a tenant-wide token with the same power as SPARROW_API_KEY.
          type: string
        external_id:
          description: "Consumer tokens only. Your id for who or what the token is for, e.g. your user id when embedding the portal. There is at most one active token per consumer and external_id: while it is valid, asking again returns it, secret included (reused: true; name and ttl_seconds are ignored), instead of creating another; once it expires or is revoked, a new one is created. This makes minting a portal link on every page view safe. Not a secret: it is fine to log."
          maxLength: 200
          type: string
        name:
          description: Who or what the token is for, e.g. "alice" or "ci-deploy".
          maxLength: 200
          minLength: 1
          type: string
        never_expires:
          description: Create a tenant-wide token that never expires (revoke it when no longer needed). Not allowed with ttl_seconds or for consumer tokens.
          type: boolean
        ttl_seconds:
          description: Lifetime in seconds. Tenant-wide tokens default to the server's SPARROW_TOKEN_DEFAULT_TTL (90 days unless changed); consumer tokens default to 7 days and allow at most 30.
          format: int64
          minimum: 0
          type: integer
      required:
        - name
      type: object
    CreateTokenOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateTokenOutputBody.json
          format: uri
          readOnly: true
          type: string
        portal_path:
          description: "Consumer tokens only: server-relative portal URL with the token in the fragment (never sent to the server or logged). Prepend the base URL the UI is served from (the Sparrow server with SPARROW_SERVE_UI=true, or your separately hosted UI) and hand it to the end consumer."
          type: string
        reused:
          description: True when external_id matched a still-valid token, which is returned instead of a new one.
          type: boolean
        secret:
          description: "The credential. Shown only in this response (and again for the same external_id); send it as X-API-Key or Authorization: Bearer."
          type: string
        token:
          $ref: "#/components/schemas/TokenOut"
      required:
        - token
        - secret
        - reused
      type: object
    DeliveryItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeliveryItem.json
          format: uri
          readOnly: true
          type: string
        attempt_count:
          description: Number of delivery attempts made so far.
          format: int64
          type: integer
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        delivery_id:
          description: Delivery id (UUID).
          type: string
        error_category:
          description: Failure classification from the most recent attempt, used to decide retryability. template_error means the subscription's transform failed to render; it is not retried automatically and does not count against the webhook's health.
          enum:
            - success
            - client_error
            - server_error
            - timeout
            - dns_error
            - tls_error
            - connection_refused
            - network_error
            - rate_limited
            - unexpected_status
            - template_error
            - unknown
            - ""
          type: string
        error_message:
          description: Human-readable failure reason from the most recent attempt.
          type: string
        event_id:
          description: Pushed event occurrence this delivery originated from.
          type: string
        last_attempted_at:
          description: Timestamp of the most recent attempt, RFC3339.
          type: string
        max_attempts:
          description: Maximum attempts allowed before the delivery is marked failed.
          format: int64
          type: integer
        next_retry_at:
          description: Timestamp of the next scheduled retry, RFC3339, if one is pending.
          type: string
        response_body:
          description: Endpoint response body from the most recent attempt, if capture_response_body is enabled.
          type: string
        response_code:
          description: HTTP status code returned by the endpoint on the most recent attempt, if any.
          format: int64
          type: integer
        status:
          description: "Current delivery status. paused: created while its subscription was paused; not attempted until retried."
          enum:
            - pending
            - sending
            - success
            - failed
            - retrying
            - expired
            - paused
          type: string
        template_error:
          description: "The payload transform error, when the subscription's template failed to render. Set for both on_transform_error modes: with fail the delivery was not sent; with fallback the default envelope was sent instead."
          type: string
        webhook_id:
          description: Webhook this delivery was sent to.
          type: string
      required:
        - delivery_id
        - webhook_id
        - event_id
        - status
        - attempt_count
        - max_attempts
        - created_at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    EventOccurrenceItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventOccurrenceItem.json
          format: uri
          readOnly: true
          type: string
        consumer:
          description: Tenant consumer this occurrence was pushed into.
          type: string
        created_at:
          description: When this occurrence was pushed, RFC3339.
          type: string
        event:
          description: Event type name.
          type: string
        event_id:
          description: Event occurrence id (UUID).
          type: string
        event_version:
          description: Event type version this occurrence was accepted under.
          format: int64
          type: integer
        failed_deliveries:
          description: Deliveries that failed (exhausted retries or non-retryable error).
          format: int32
          type: integer
        labels:
          additionalProperties:
            type: string
          description: Key/value labels used to match against subscription label filters.
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata stored with the occurrence.
          type: object
        payload:
          additionalProperties: {}
          description: The pushed payload.
          type: object
        pending_deliveries:
          description: Deliveries still pending or retrying.
          format: int32
          type: integer
        schema_valid:
          description: Whether the payload validated against the event type's JSON Schema at push time.
          type: boolean
        successful_deliveries:
          description: Deliveries that succeeded.
          format: int32
          type: integer
        webhook_count:
          description: Number of webhooks whose subscriptions matched this occurrence.
          format: int32
          type: integer
      required:
        - event_id
        - consumer
        - event
        - payload
        - schema_valid
        - event_version
        - webhook_count
        - successful_deliveries
        - failed_deliveries
        - pending_deliveries
        - created_at
      type: object
    EventTypeBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeBody.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether events of this type can be pushed. Defaults to true.
          type: boolean
        description:
          description: Human-readable summary of what this event represents.
          type: string
        event_schema:
          additionalProperties: {}
          description: "Optional JSON Schema for the payload. Validation is soft: non-conforming payloads are still accepted, with warnings returned from the push call."
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata for your own tooling.
          type: object
        name:
          description: Unique event type name, e.g. order.created. At most 255 characters. Immutable after creation.
          type: string
      type: object
    EventTypeBundle:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeBundle.json
          format: uri
          readOnly: true
          type: string
        apiVersion:
          description: Bundle schema version.
          enum:
            - sparrow/v1
          type: string
        items:
          description: Event type definitions, sorted by name.
          items:
            $ref: "#/components/schemas/BundleItem"
          type:
            - array
            - "null"
        kind:
          description: Bundle kind.
          enum:
            - EventTypeList
          type: string
        stamp:
          $ref: "#/components/schemas/BundleStampBody"
          description: Which Sparrow produced this bundle. A compatibility hint, not a signature.
      required:
        - apiVersion
        - kind
        - stamp
        - items
      type: object
    EventTypeChange:
      additionalProperties: false
      properties:
        action:
          description: "created: new event type at version 1. new_version: the schema changed, so a new version was created and the previous one kept. updated: the current version changed in place (description, metadata, active, or a first schema added to a schema-less version). unchanged: nothing was written."
          enum:
            - created
            - new_version
            - updated
            - unchanged
          type: string
        active_change:
          description: Set when the write flips the active flag.
          enum:
            - deactivates
            - reactivates
            - ""
          type: string
        affected_subscriptions:
          description: "For new_version: subscriptions that receive this event type, by name or catch-all."
          format: int64
          type: integer
        changes:
          description: "Fields that changed: schema, schema_defined (a first schema was added in place), description, metadata, active."
          items:
            type: string
          type:
            - array
            - "null"
        compatibility:
          $ref: "#/components/schemas/SchemaCompatibilityItem"
          description: "For new_version: whether the schema change could break a subscription's payload transformation."
        previous_version:
          description: Version before the write; absent when the event type was created.
          format: int64
          type: integer
        version:
          description: Version after the write.
          format: int64
          type: integer
      required:
        - action
        - version
      type: object
    EventTypeItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeItem.json
          format: uri
          readOnly: true
          type: string
        active:
          description: Whether events of this type can currently be pushed.
          type: boolean
        created_at:
          description: Creation timestamp, RFC3339.
          type: string
        description:
          description: Human-readable summary of what this event represents.
          type: string
        event_schema:
          additionalProperties: {}
          description: JSON Schema payloads are softly validated against, if one is registered.
          type: object
        metadata:
          additionalProperties:
            type: string
          description: Arbitrary key/value metadata.
          type: object
        name:
          description: Event type name, e.g. order.created.
          type: string
        sample_payload:
          additionalProperties: {}
          description: Example payload derived from the schema, used to preview subscription transform templates.
          type: object
        updated_at:
          description: Last-modified timestamp, RFC3339.
          type: string
        version:
          description: Current schema version. Starts at 1 and increases only when the schema changes; every version is kept (see listEventTypeVersions).
          format: int64
          type: integer
      required:
        - name
        - active
        - version
        - created_at
        - updated_at
      type: object
    EventTypeVersionItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EventTypeVersionItem.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When this version was created, RFC3339.
          type: string
        description:
          description: Description as it was when this version was created.
          type: string
        event_schema:
          additionalProperties: {}
          description: JSON Schema of this version. Absent for a schema-less version.
          type: object
        name:
          description: Event type name.
          type: string
        sample_payload:
          additionalProperties: {}
          description: Example payload generated from this version's schema.
          type: object
        schema_defined_at:
          description: When a first schema was added to this version in place, RFC3339. Events pushed before this time were accepted while the version had no schema.
          type: string
        version:
          description: Version number.
          format: int64
          type: integer
      required:
        - name
        - version
        - created_at
      type: object
    ExportEventTypesInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ExportEventTypesInputBody.json
          format: uri
          readOnly: true
          type: string
        all:
          description: Export every event type.
          type: boolean
        names:
          description: Export these event types. Each must exist.
          items:
            type: string
          type:
            - array
            - "null"
        prefix:
          description: Export every event type whose name starts with this prefix.
          type: string
      type: object
    HealthSummaryOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthSummaryOutputBody.json
          format: uri
          readOnly: true
          type: string
        degraded_count:
          description: Webhooks currently degraded, across all consumers.
          format: int64
          type: integer
        healthy_count:
          description: Webhooks currently healthy, across all consumers.
          format: int64
          type: integer
        unhealthy_count:
          description: Webhooks currently unhealthy, across all consumers.
          format: int64
          type: integer
        unknown_count:
          description: Webhooks with no recent delivery attempts, across all consumers.
          format: int64
