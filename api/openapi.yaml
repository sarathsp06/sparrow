      type: object
    PushEventOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PushEventOutputBody.json
          format: uri
          readOnly: true
          type: string
        duplicate:
