  /v1/consumers/{consumer}/deliveries:
    get:
      description: |-
        Lists deliveries in a consumer, newest first, optionally filtered by webhook, event occurrence, subscription, event type, status, error category, or creation time. Cursor paginated: pass pagination.next_cursor as cursor for the next page; there is no total count and offset is rejected.

        Side effect: prepare_retry=true also snapshots every match (up to 10,000) into a batch job and returns retry_id for POST .../deliveries:retryBatch.

        Portal tokens: allowed, as GET /portal/api/deliveries.
      operationId: listDeliveries
      parameters:
        - description: Consumer to list deliveries in.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer to list deliveries in.
            type: string
        - description: Filter to deliveries for one webhook (UUID; 400 otherwise).
          explode: false
          in: query
          name: webhook_id
          schema:
            description: Filter to deliveries for one webhook (UUID; 400 otherwise).
            type: string
        - description: Filter to deliveries for one pushed event occurrence (UUID; 400 otherwise).
          explode: false
          in: query
          name: event_id
          schema:
            description: Filter to deliveries for one pushed event occurrence (UUID; 400 otherwise).
            type: string
        - description: Filter by delivery status.
          explode: false
          in: query
          name: status
          schema:
            description: Filter by delivery status.
            enum:
              - pending
              - sending
              - success
              - failed
              - retrying
              - expired
              - paused
            type: string
        - description: Filter by the most recent attempt's error_category, e.g. server_error, client_error, timeout.
          explode: false
          in: query
          name: error_category
          schema:
            description: Filter by the most recent attempt's error_category, e.g. server_error, client_error, timeout.
            type: string
        - description: Filter to deliveries created by one subscription (UUID), e.g. its paused deliveries.
          explode: false
          in: query
          name: subscription_id
          schema:
            description: Filter to deliveries created by one subscription (UUID), e.g. its paused deliveries.
            type: string
        - description: Filter to deliveries of one event type, e.g. order.created. Also matches deliveries whose subscription has since been replaced or deleted.
          explode: false
          in: query
          name: event_name
          schema:
            description: Filter to deliveries of one event type, e.g. order.created. Also matches deliveries whose subscription has since been replaced or deleted.
            type: string
        - description: "Only deliveries created at or after this time: YYYY-MM-DD (start of that day, UTC) or an RFC3339 timestamp (e.g. an import's imported_at)."
          explode: false
          in: query
          name: created_after
          schema:
            description: "Only deliveries created at or after this time: YYYY-MM-DD (start of that day, UTC) or an RFC3339 timestamp (e.g. an import's imported_at)."
            type: string
        - description: "Only deliveries created at or before this time: YYYY-MM-DD (through the end of that day, UTC) or an RFC3339 timestamp."
          explode: false
          in: query
          name: created_before
          schema:
            description: "Only deliveries created at or before this time: YYYY-MM-DD (through the end of that day, UTC) or an RFC3339 timestamp."
            type: string
        - description: "Side effect: when true, also snapshots the ids of every delivery matching the filters (not just this page; at most 10,000, more is an error) into a batch job and returns its id as retry_id. Pass it to POST .../deliveries:retryBatch within 15 minutes. Each call creates a new snapshot."
          explode: false
          in: query
          name: prepare_retry
          schema:
            default: false
            description: "Side effect: when true, also snapshots the ids of every delivery matching the filters (not just this page; at most 10,000, more is an error) into a batch job and returns its id as retry_id. Pass it to POST .../deliveries:retryBatch within 15 minutes. Each call creates a new snapshot."
            type: boolean
        - description: Maximum items to return, 1 to 1000.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum items to return, 1 to 1000.
            format: int32
            maximum: 1000
            minimum: 1
            type: integer
        - description: "Continue after the page this came from: pagination.next_cursor of the previous response. Stable while new deliveries arrive."
          explode: false
          in: query
          name: cursor
          schema:
            description: "Continue after the page this came from: pagination.next_cursor of the previous response. Stable while new deliveries arrive."
            type: string
        - description: "Removed: page with cursor. Any value other than 0 is rejected with 400, so a client still paging by offset fails loudly instead of re-reading the first page."
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: "Removed: page with cursor. Any value other than 0 is rejected with 400, so a client still paging by offset fails loudly instead of re-reading the first page."
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeliveriesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List deliveries
      tags:
        - Deliveries
  /v1/consumers/{consumer}/deliveries/{delivery_id}:
