  /v1/event-types/{name}:validate:
    post:
      description: |-
        Checks a payload against the event type's current JSON Schema without pushing an event or storing anything. pushEvent accepts events regardless of schema validity; this lets callers (e.g. the Push Test Event UI) enforce a hard gate before submitting. An invalid payload is still 200, with valid: false. 404 when the name is not registered.

        Portal tokens: not allowed.
      operationId: validateEventPayload
      parameters:
        - description: Event type name, e.g. order.created.
          in: path
