  /v1/consumers/{consumer}/deliveries/{delivery_id}:retry:
    post:
      description: |-
        Queues one delivery for another round of attempts right away: it is reset to pending and gets up to max_attempts new attempts, without TTL expiry. Works for failed, expired, paused, pending and retrying deliveries; a successful one is refused with 409 (use the bulk route with force to resend it). If the webhook or subscription is still paused the delivery is held as paused again. Not idempotent: each call queues another round.

        Portal tokens: allowed, as POST /portal/api/deliveries/{delivery_id}:retry.
      operationId: retryDelivery
      parameters:
        - description: Consumer the delivery belongs to.
          in: path
          name: consumer
          required: true
          schema:
            description: Consumer the delivery belongs to.
            type: string
        - description: Delivery id (UUID) to retry.
          in: path
          name: delivery_id
          required: true
          schema:
            description: Delivery id (UUID) to retry.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Retry a single delivery
      tags:
        - Deliveries
  /v1/consumers/{consumer}/deliveries:retry:
    post:
      description: |-
        Queues every failed, pending, retrying or paused delivery of one webhook for another round of attempts (see retryDelivery), in one request. With force, every delivery of the webhook is resent, including successful and expired ones. Returns count 0 when nothing matched. For a filtered or very large set, use prepare_retry and :retryBatch instead.

        404 when the webhook does not exist in this consumer.

