version: 1
name: twilio
description: Send events as SMS via the Twilio Messages API
params:
  - name: account_sid
    prompt: "Account SID"
    help: "Found on the Twilio Console home page; starts with AC."
    example: ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    docs_url: https://console.twilio.com/
    required: true
  - name: basic_auth
    prompt: "Basic auth token"
    help: "Base64 of AccountSID:AuthToken, e.g. the output of printf '%s:%s' <AccountSID> <AuthToken> | base64. Stored encrypted."
    docs_url: https://www.twilio.com/docs/usage/requests-to-twilio#authenticate-with-http
    required: true
    secret: true
  - name: from_number
    prompt: "Sender number"
    help: "A Twilio number you own, in E.164 without the +: digits only."
    example: "15551230000"
    required: true
  - name: to_number
    prompt: "Recipient number"
    help: "The phone that receives the SMS, in E.164 without the +: digits only."
    example: "15559876543"
    required: true
webhook:
  # The receiver only accepts the transformed payload below.
  requires_transform: true
  url: 'https://api.twilio.com/2010-04-01/Accounts/{{param "account_sid"}}/Messages.json'
  headers:
    Content-Type: application/x-www-form-urlencoded
  secret_headers:
    # Envelope-encrypted at rest, masked in API responses. Twilio auth is HTTP
    # Basic: base64("<AccountSID>:<AuthToken>"). The AuthToken never leaves the
    # encrypted store in plaintext.
    Authorization: 'Basic {{param "basic_auth"}}'
# What an ideal message for this destination looks like. Advice for
# template authors and AI drafting, not a rule: instructions and the
# receiver's own example take precedence.
guidance: |
  A good SMS is short, plain and obviously from you.
  - Start with who it is from ("Acme:"), since SMS arrive from bare numbers.
  - One message, the key fact and, if any, the next step: "Acme: payment for order 8F2 failed. Update your card at acme.co/pay".
  - Keep it within 160 characters (one segment); never above 320. Every character over adds a billed segment.
  - Stick to plain GSM-7 characters: emoji, curly quotes, em dashes, ellipses and bullets switch the whole message to UCS-2 and cut a segment to 70 characters. Use straight quotes, "-" and "...".
  - No raw ids nobody can use, no JSON, no event names; times in the reader's terms ("today 14:00 UTC").
  - Short links only; long URLs eat the budget.
  - Ongoing or marketing messages need opt-out wording ("Reply STOP to opt out"); a one-off operational alert to your own team usually does not.
  Ideal, rendered: "Acme: order 8F2 payment failed ($49.50). Retry at acme.co/o/8F2" (63 characters).
subscription:
  # Twilio expects application/x-www-form-urlencoded. To/From are set from params
  # at apply time (digits are URL-safe; %2B is the encoded '+'); Body is rendered
  # per delivery and URL-encoded.
  transform_template: |
    To=%2B{{param "to_number"}}&From=%2B{{param "from_number"}}&Body={{printf "Sparrow %s (event %s, attempt %d) at %s" .event_name .event_id .attempt .timestamp | urlencode}}
