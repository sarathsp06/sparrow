version: 1
name: clickhouse
description: Insert events into a ClickHouse table over the HTTP interface (JSONEachRow)
params:
  - name: base_url
    prompt: "ClickHouse HTTP endpoint"
    help: "Base URL of the ClickHouse HTTP interface, with scheme and port; no path."
    example: https://ch.example.com:8443
    docs_url: https://clickhouse.com/docs/en/interfaces/http
    required: true
  - name: table
    prompt: "Destination table"
    help: "Database-qualified table; it needs String columns event_id, event_name, timestamp and payload."
    example: sparrow.events
    required: true
  - name: user
    prompt: "ClickHouse user"
    help: "A user allowed to INSERT into the table."
    example: sparrow_writer
    required: true
  - name: password
    prompt: "ClickHouse password"
    help: "Password of that user. Stored encrypted and never shown again."
    required: true
    secret: true
webhook:
  # The receiver only accepts the transformed payload below.
  requires_transform: true
  url: '{{param "base_url"}}/?query=INSERT%20INTO%20{{param "table"}}%20FORMAT%20JSONEachRow'
  headers:
    X-ClickHouse-User: '{{param "user"}}'
  secret_headers:
    # Password is envelope-encrypted at rest and masked in API responses.
    X-ClickHouse-Key: '{{param "password"}}'
# What an ideal message for this destination looks like. Advice for
# template authors and AI drafting, not a rule: instructions and the
# receiver's own example take precedence.
guidance: |
  A good row keeps the data faithful and easy to query.
  - One column per key you will filter or aggregate on, typed as the table declares; keep the full payload as a JSON string column so nothing is lost.
  - Copy values as they are: no formatting, rounding, renaming of enum values or added text.
  - Timestamps in a format ClickHouse parses for the column type (RFC 3339 for String, "YYYY-MM-DD hh:mm:ss" for DateTime).
  - Emit every column the table needs on every row; use null or an empty value for absent optional fields rather than leaving the key out.
subscription:
  # payload is double-encoded ({{.payload | json | json}}) on purpose: the
  # payload column is a String, so the first json turns the map into a JSON
  # document and the second escapes that document into a JSON string literal
  # for the JSONEachRow row.
  transform_template: |
    {"event_id": {{.event_id | json}}, "event_name": {{.event_name | json}}, "timestamp": {{.timestamp | json}}, "payload": {{.payload | json | json}}}
