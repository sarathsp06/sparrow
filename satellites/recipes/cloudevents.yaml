version: 1
name: cloudevents
description: Deliver events as CloudEvents 1.0 (HTTP structured mode) to any CloudEvents receiver
params:
  - name: target_url
    prompt: "CloudEvents receiver URL"
    help: "Any HTTP receiver that accepts structured-mode CloudEvents, e.g. a Knative broker, Argo Events or Dapr endpoint."
    example: http://broker-ingress.knative-eventing.svc/default/default
    docs_url: https://github.com/cloudevents/spec/blob/main/cloudevents/bindings/http-protocol-binding.md
    required: true
  - name: source
    prompt: "Event source"
    help: "The CloudEvents source attribute identifying this producer, a URI-reference."
    example: /sparrow/prod
    docs_url: https://github.com/cloudevents/spec/blob/main/cloudevents/spec.md#source-1
    default: /sparrow
webhook:
  # The receiver only accepts the transformed payload below.
  requires_transform: true
  url: '{{param "target_url"}}'
  headers:
    # Structured content mode: every attribute travels in the JSON body.
    Content-Type: application/cloudevents+json; charset=utf-8
# What an ideal message for this destination looks like. Advice for
# template authors and AI drafting, not a rule: instructions and the
# receiver's own example take precedence.
guidance: |
  A good CloudEvent is a faithful, self-describing envelope; consumers route
  on its attributes, so they must be stable.
  - type: a stable, versioned, reverse-DNS style name ("com.acme.order.refunded.v1"); keep the event name if the consumer routes on it.
  - source + id: unique per event and stable across retries (keep .event_id), so consumers deduplicate.
  - subject: the entity the event is about (an order or user id) when the payload has one; consumers filter on it without parsing data.
  - time: when the event happened, from the payload when it has an occurrence time, else .timestamp.
  - data: the payload unchanged unless the instructions ask to reshape it; set datacontenttype to match.
subscription:
  # The event id is the CloudEvents id, so a receiver deduplicates retries of
  # the same event (id + source is unique per the spec). time is the delivery
  # time Sparrow renders the template at.
  transform_template: |
    {
      "specversion": "1.0",
      "id": {{.event_id | json}},
      "source": "{{param "source"}}",
      "type": {{.event_name | json}},
      "time": {{.timestamp | json}},
      "datacontenttype": "application/json",
      "data": {{.payload | json}}
    }
