version: 1
name: discord
description: Post events to a Discord channel as embeds via a channel webhook
params:
  - name: webhook_url
    prompt: "Discord webhook URL"
    help: "Create one under Server Settings > Integrations > Webhooks, then Copy Webhook URL."
    example: https://discord.com/api/webhooks/123456789/abcdef
    docs_url: https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks
    required: true
webhook:
  # The receiver only accepts the transformed payload below.
  requires_transform: true
  url: '{{param "webhook_url"}}'
  headers:
    Content-Type: application/json
subscription:
  transform_template: |
    {
      "embeds": [
        {
          "title": {{.event_name | json}},
          "description": {{printf "```json\n%s\n```" (json .payload | ellipsis 4000) | json}},
          "timestamp": {{.timestamp | json}}
        }
      ]
    }
