version: 1
name: sendgrid
description: Send events as email via the SendGrid v3 Mail Send API
params:
  - name: api_key
    prompt: "SendGrid API key"
    help: "A key with the Mail Send permission. Stored encrypted and never shown again."
    example: SG.xxxxxxxx.yyyyyyyy
    docs_url: https://www.twilio.com/docs/sendgrid/ui/account-and-settings/api-keys
    required: true
    secret: true
    activation_required: true
  - name: from_email
    prompt: "Sender email"
    help: "Must be a verified Single Sender or on a domain you authenticated in SendGrid, or sends are rejected."
    example: alerts@acme.com
    docs_url: https://www.twilio.com/docs/sendgrid/ui/sending-email/sender-verification
    required: true
    default: alerts@example.com
    activation_required: true
    must_override_default: true
  - name: from_name
    prompt: "Sender name"
    help: "Display name recipients see in the From line."
    example: Acme Webhooks
    default: Sparrow
  - name: default_recipient
    prompt: "Fallback recipient"
    help: "Gets events that carry no payload.alert_recipients, i.e. anything but Sparrow's own alerts."
    example: team@acme.com
    required: true
consumer:
  name: _sparrow
  note: "Register under _sparrow to deliver Sparrow's alert emails to each opted-in recipient. Under any other consumer it emails that consumer's own events to the fallback recipient."
webhook:
  # The receiver only accepts the transformed payload below.
  requires_transform: true
  url: 'https://api.sendgrid.com/v3/mail/send'
  headers:
    Content-Type: application/json
  secret_headers:
    # Envelope-encrypted at rest, masked in API responses.
    Authorization: 'Bearer {{param "api_key"}}'
subscription:
  # Sparrow's own system alerts (sparrow.webhook.health_changed /
  # delivery_failed / disabled, see the webhook_alert_configs API) carry
  # payload.alert_recipients — a list of {email} objects, one per opted-in
  # recipient; each gets its own personalization so recipients never see each
  # other's address. Any other event falls back to the default_recipient param
  # with a generic subject/body, so the recipe works for custom events too.
  transform_template: |
    {
      "personalizations": [{{if index .payload "alert_recipients"}}{{range $i, $r := index .payload "alert_recipients"}}{{if $i}},{{end}}{"to": [{"email": {{$r.email | json}}}]}{{end}}{{else}}{"to": [{"email": "{{param "default_recipient"}}"}]}{{end}}],
      "from": {"email": "{{param "from_email"}}", "name": "{{param "from_name"}}"},
      "subject": {{if eq .event_name "sparrow.webhook.health_changed"}}{{if eq .payload.new_health "healthy"}}{{printf "Sparrow: webhook for %v recovered" .payload.consumer | json}}{{else}}{{printf "Sparrow: webhook for %v is now %v" .payload.consumer .payload.new_health | json}}{{end}}{{else if eq .event_name "sparrow.webhook.delivery_failed"}}{{printf "Sparrow: delivery to %v failed permanently" .payload.consumer | json}}{{else if eq .event_name "sparrow.webhook.disabled"}}{{printf "Sparrow: webhook for %v was auto-disabled" .payload.consumer | json}}{{else}}{{printf "Sparrow event: %v" .event_name | json}}{{end}},
      "content": [{"type": "text/plain", "value": {{if eq .event_name "sparrow.webhook.health_changed"}}{{printf "Webhook %v (%v) health changed: %v -> %v" .payload.webhook_id .payload.url .payload.old_health .payload.new_health | json}}{{else if eq .event_name "sparrow.webhook.delivery_failed"}}{{printf "Webhook %v (%v) delivery %v failed permanently after %v attempt(s): %v (%v)" .payload.webhook_id .payload.url .payload.delivery_id .payload.attempt .payload.error_message .payload.error_category | json}}{{else if eq .event_name "sparrow.webhook.disabled"}}{{printf "Webhook %v (%v) was paused automatically: %v. New events are not delivered until it is resumed." .payload.webhook_id .payload.url .payload.reason | json}}{{else}}{{printf "Event %v (id %v, attempt %v) at %v\n\n%v" .event_name .event_id .attempt .timestamp (json .payload) | json}}{{end}}}]
    }
