version: 1
name: ntfy
description: Push events as notifications to an ntfy topic
params:
  - name: server_url
    prompt: "ntfy server"
    help: "The public ntfy.sh service, or your self-hosted server's URL."
    example: https://ntfy.example.com
    docs_url: https://docs.ntfy.sh/publish/
    default: https://ntfy.sh
  - name: topic
    prompt: "Topic"
    help: "Subscribers to this topic get the notifications. On ntfy.sh topics are public, so pick a hard-to-guess name."
    example: sparrow_alerts_x7k2
    required: true
webhook:
  # The receiver only accepts the transformed payload below.
  requires_transform: true
  # JSON publishing endpoint: POST to the server root with the topic in the
  # body. Unlike header-based publishing (X-Title etc.), this lets the title
  # be rendered per delivery instead of being fixed at apply time.
  url: '{{param "server_url"}}'
  headers:
    Content-Type: application/json
subscription:
  transform_template: |
    {
      "topic": "{{param "topic"}}",
      "title": {{.event_name | json}},
      "message": {{printf "event %v, attempt %v at %v\n\n%v" .event_id .attempt .timestamp (json .payload) | json}},
      "tags": ["incoming_envelope"]
    }
