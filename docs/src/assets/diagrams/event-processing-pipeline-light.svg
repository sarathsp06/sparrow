d edge-thickness-normal edge-pattern-solid flowchart-link" style="stroke-dasharray: 0 0 32 4; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_WW_T_0" data-points="W3sieCI6MTM3LjIwMzEyNSwieSI6MTM4M30seyJ4IjoxMzcuMjAzMTI1LCJ5IjoxNDIzfV0=" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/></g><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-IN-0" data-look="neo" transform="translate(137.203125, 45)"><rect class="basic label-container" style="" x="-125.203125" y="-33" width="250.40625" height="66"/><g class="label" style="" transform="translate(-109.203125, -21)"><rect/><foreignObject width="218.40625" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>POST /v1/consumers/{consumer}/events</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-H-1" data-look="neo" transform="translate(137.203125, 308.5)"><rect class="basic label-container" style="" x="-80.1015625" y="-190.5" width="160.203125" height="381"/><g class="label" style="" transform="translate(-64.1015625, -178.5)"><rect/><foreignObject width="128.203125" height="357"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>Push (internal/webhooks)<br />1. Reject unknown event types (404) unless auto-register is on<br />2. Dedup on idempotency key<br />3. Validate payload against the current schema (soft)<br />4. Insert event_record with event_version<br />5. Enqueue EventArgs (River, events queue)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-EW-3" data-look="neo" transform="translate(137.203125, 666.5)"><rect class="basic label-container" style="" x="-92.8125" y="-127.5" width="185.625" height="255"/><g class="label" style="" transform="translate(-76.8125, -115.5)"><rect/><foreignObject width="153.625" height="231"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>EventProcessingWorker<br />1. Load event<br />2. Match subscriptions (consumer + event name or * + labels)<br />3. Batch-insert deliveries: paused for paused subscriptions<br />4. Batch-enqueue WebhookArgs for the rest</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-WW-5" data-look="neo" transform="translate(137.203125, 1108.5)"><rect class="basic label-container" style="" x="-76" y="-274.5" width="152" height="549"/><g class="label" style="" transform="translate(-60, -262.5)"><rect/><foreignObject width="120" height="525"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>WebhookWorker<br />1. Load webhook, event, subscription<br />2. Render the transform (strict by default); on failure fail with template_error or fall back<br />3. Rate limit (leaky bucket in PostgreSQL)<br />4. HTTP request with Standard Webhooks signing<br />5. Update delivery; record health for receiver outcomes only<br />6. Retryable failure: re-enqueue with backoff</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T-7" data-look="neo" transform="translate(137.203125, 1466.5)"><rect class="basic label-container" style="" x="-76" y="-43.5" width="152" height="87"/><g class="label" style="" transform="translate(-60, -31.5)"><rect/><foreignObject width="120" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>Target URL receives the webhook</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>